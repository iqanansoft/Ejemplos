        /**
         * Importa el archivo, elimina un posible BOM UTF-8 y actualiza ambas
         * representaciones del documento manteniendo activa la vista actual.
         */
        async function importSelectedFile(file) {
            const result =
                await importController.importFile(
                    file
                );

            if (!result.success) {
                if (
                    result.reason ===
                    "unsupported"
                ) {
                    showImportError(
                        "El archivo seleccionado no es compatible. "
                        +
                        "Solo se pueden importar archivos Markdown .md/.markdown y archivos de texto plano .txt. "
                        +
                        "Si el navegador proporciona un tipo MIME, también debe ser compatible."
                    );
                } else {
                    showImportError(
                        result.error?.message
                        ||
                        "No se ha podido importar el archivo seleccionado."
                    );
                }

                return false;
            }

            let markdown =
                result.content;

            if (
                markdown.charCodeAt(0) ===
                0xFEFF
            ) {
                markdown =
                    markdown.substring(1);
            }

            markdownEditor.value =
                markdown;

            markdownEditor.setSelectionRange(
                0,
                0
            );

            formattedEditor.innerHTML =
                markdownController.markdownToHtml(
                    markdown
                );

            if (
                activeView ===
                "markdown"
            ) {
                markdownEditor.focus();
            } else {
                formattedEditor.focus();
            }

            updateToolbarState();

            return true;
        }


        importFileInput.addEventListener(
            "change",
            async () => {
                const file =
                    importFileInput.files?.[0];

                if (!file) {
                    return;
                }

                await importSelectedFile(
                    file
                );

                importFileInput.value = "";
            }
        );


        /* ===== FORMATOS DE GUARDADO DISPONIBLES =====
         * Cada formato declara qué tipo de contenido acepta y si necesita un
         * manejador especial (por ejemplo PDF o DOCX).
         */
        const saveController =
            new SaveController();


        saveController.registerContentType({
            name: "markdown",
            title: "Código Markdown"
        });

        saveController.registerContentType({
            name: "formatted",
            title: "Texto formateado"
        });


        saveController.register({
            name: "markdown",
            title: "Markdown",
            extension: "md",
            mimeType: "text/markdown;charset=utf-8",
            defaultFileName: "documento",

            supportedContent: [
                "markdown"
            ],

            getContent(contentTypeName) {
                if (contentTypeName === "markdown") {
                    return getMarkdownForSave();
                }

                return "";
            }
        });

        saveController.register({
            name: "pdf",
            title: "PDF",
            extension: "pdf",
            mimeType: "application/pdf",
            defaultFileName: "documento",

            supportedContent: [
                "markdown",
                "formatted"
            ],

            saveHandler(contentTypeName) {
                return savePdfContent(
                    contentTypeName
                );
            }
        });


        saveController.register({
            name: "html",
            title: "HTML",
            extension: "html",
            mimeType: "text/html;charset=utf-8",
            defaultFileName: "documento",

            supportedContent: [
                "markdown",
                "formatted"
            ],

            getContent(contentTypeName) {
                return getHtmlForSave(
                    contentTypeName
                );
            }
        });


        saveController.register({
            name: "docx",
            title: "DOCX",
            extension: "docx",
            mimeType:
                "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            defaultFileName: "documento",

            supportedContent: [
                "markdown",
                "formatted"
            ],

            saveHandler(contentTypeName) {
                return saveDocxContent(
                    contentTypeName
                );
            }
        });


        async function saveFile(
            formatName,
            contentTypeName
        ) {
            const saved =
                await saveController.save(
                    formatName,
                    contentTypeName
                );

            if (!saved) {
                updateSaveDialogState();
                return false;
            }

            closeSaveDialog();

            if (
                activeView ===
                "markdown"
            ) {
                markdownEditor.focus();
            } else {
                formattedEditor.focus();
            }

            return true;
        }

        /* ===== LÓGICA DEL DIÁLOGO DE GUARDADO ===== */
        function updateSaveDialogState() {
            for (
                const button
                of saveFormatList.querySelectorAll(
                    ".save-format-button"
                )
            ) {
                const formatName =
                    button.dataset.formatName;

                const contentTypeName =
                    button.dataset.contentTypeName;

                const compatible =
                    saveController.supportsContent(
                        formatName,
                        contentTypeName
                    );

                const selected =
                    compatible
                    &&
                    selectedSaveFormatName === formatName
                    &&
                    selectedSaveContentTypeName === contentTypeName;

                button.disabled =
                    !compatible;

                button.classList.toggle(
                    "selected",
                    selected
                );

                button.setAttribute(
                    "aria-checked",
                    selected ? "true" : "false"
                );
            }

            const validSelection =
                selectedSaveContentTypeName !== null
                &&
                selectedSaveFormatName !== null
                &&
                saveController.supportsContent(
                    selectedSaveFormatName,
                    selectedSaveContentTypeName
                );

            saveDialogSaveButton.disabled =
                !validSelection;
        }

        function selectSaveOption(
            formatName,
            contentTypeName
        ) {
            if (
                !saveController.supportsContent(
                    formatName,
                    contentTypeName
                )
            ) {
                return;
            }

            const sameSelection =
                selectedSaveFormatName === formatName
                &&
                selectedSaveContentTypeName === contentTypeName;

            if (sameSelection) {
                selectedSaveFormatName =
                    null;

                selectedSaveContentTypeName =
                    null;
            } else {
                selectedSaveFormatName =
                    formatName;

                selectedSaveContentTypeName =
                    contentTypeName;
            }

            updateSaveDialogState();
        }

        function createSaveContentOptionButton(
            format,
            contentType
        ) {
            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "save-format-button";

            button.dataset.formatName =
                format.name;

            button.dataset.contentTypeName =
                contentType.name;

            button.setAttribute(
                "role",
                "radio"
            );

            button.setAttribute(
                "aria-checked",
                "false"
            );

            const check =
                document.createElement(
                    "span"
                );

            check.className =
                "save-format-check";

            check.textContent =
                "✓";

            check.setAttribute(
                "aria-hidden",
                "true"
            );

            const content =
                document.createElement(
                    "span"
                );

            content.className =
                "save-format-content";

            const title =
                document.createElement(
                    "strong"
                );

            title.textContent =

            content.append(
                title
            );

            button.append(

                content
            );

        function createDirectSaveFormatButton(
            format,
            contentType
        ) {
            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "save-format-button direct-save-format-button";

            button.dataset.formatName =
                format.name;

            button.dataset.contentTypeName =
                contentType.name;

            button.setAttribute(
                "role",
                "radio"
            );

            button.setAttribute(
                "aria-checked",
                "false"
            );

            const check =
                document.createElement(
                    "span"
                );

            check.className =
                "save-format-check";

            check.textContent =
                "✓";

            check.setAttribute(
                "aria-hidden",
                "true"
            );

            const content =
                document.createElement(
                    "span"
                );

            content.className =
                "save-format-content";

            const title =
                document.createElement(
                    "strong"
                );

            title.textContent =
                format.title;

            const extension =
                document.createElement(
                    "span"
                );

            extension.className =
                "save-format-extension";

            extension.textContent =
                `Archivo .${format.extension}`;

            content.append(
                title,
                extension
            );

            button.append(
                check,
                content
            );

            button.addEventListener(
                "click",
                () => {
                    selectSaveOption(

                    );

        function renderSaveFormats() {
            saveFormatList.replaceChildren();

            for (
                const format
                of saveController.getAll()
            ) {
                const compatibleContentTypes =
                    saveController
                        .getAllContentTypes()
                        .filter(
                            contentType =>
                                saveController.supportsContent(
                                    format.name,
                                    contentType.name
                                )
                        );

                if (compatibleContentTypes.length === 1) {
                    saveFormatList.append(
                        createDirectSaveFormatButton(
                            format,
                            compatibleContentTypes[0]
                        )
                    );

                    continue;
                }

                const group =
                    document.createElement(
                        "div"
                    );

                group.className =
                    "save-file-format-group";

                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "save-file-format-title";

                const name =
                    document.createElement(
                        "strong"
                    );

                name.textContent =
                    format.title;

                const extension =
                    document.createElement(
                        "span"
                    );

                extension.textContent =
                    `Archivo .${format.extension}`;

                title.append(
                    name,
                    extension
                );

                const options =
                    document.createElement(
                        "div"
                    );

                options.className =
                    "save-file-format-options";

                for (
                    const contentType
                    of compatibleContentTypes
                ) {
                    options.append(
                        createSaveContentOptionButton(
                            format,
                            contentType
                        )
                    );
                }

                group.append(
                    title,
                    options
                );

                saveFormatList.append(
                    group
                );
            }
        }

        function openSaveDialog() {
            selectedSaveContentTypeName =
                null;

            selectedSaveFormatName =
                null;

            renderSaveFormats();
            updateSaveDialogState();

            saveDialogBackdrop.classList.remove(
                "hidden"
            );

            const firstEnabledOption =
                saveFormatList.querySelector(
                    ".save-format-button:not(:disabled)"
                );

            firstEnabledOption?.focus();
        }

        function closeSaveDialog() {
            saveDialogBackdrop.classList.add(
                "hidden"
            );

            selectedSaveContentTypeName =
                null;

            selectedSaveFormatName =
                null;

            saveDialogSaveButton.disabled =
                true;
        }

        async function saveSelectedFormat() {
            if (
                !selectedSaveContentTypeName
                ||
                !selectedSaveFormatName
                ||
                !saveController.supportsContent(
                    selectedSaveFormatName,
                    selectedSaveContentTypeName
                )
            ) {
                return;
            }

            saveDialogSaveButton.disabled =
                true;

            await saveFile(
                selectedSaveFormatName,
                selectedSaveContentTypeName
            );
        }


        /* ===== BARRA DE HERRAMIENTAS =====
         * Se genera a partir de los formatos registrados para que añadir un nuevo
         * formato no obligue a escribir su botón directamente en el HTML.
         */
        function createToolbar() {
            toolbar.replaceChildren();

            for (const tag of markdownController.getAll()) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "toolbar-button";
                button.textContent = tag.buttonText;
                button.title = tag.title;
                button.disabled = !tag.implemented;
                button.dataset.tagName = tag.name;

                button.addEventListener("mousedown", event => {
                    event.preventDefault();
                });

                button.addEventListener("click", () => {
                    applyFormat(tag.name);
                });

                toolbar.append(button);
            }

            const separator = document.createElement("span");
            separator.className = "toolbar-separator";
            toolbar.append(separator);

            const clearButton = document.createElement("button");
            clearButton.type = "button";
            clearButton.className = "toolbar-button";
            clearButton.textContent = "Borrar todo";
            clearButton.addEventListener("click", () => {
                markdownEditor.value = "";
                formattedEditor.innerHTML = "";
                updateToolbarState();

                if (activeView === "markdown") markdownEditor.focus();
                else formattedEditor.focus();
            });
            toolbar.append(clearButton);

            const saveButton = document.createElement("button");
            saveButton.type = "button";
            saveButton.className = "toolbar-button";
            saveButton.textContent = "Guardar";
            saveButton.title = "Guardar";
            saveButton.addEventListener("mousedown", event => {
                event.preventDefault();
            });
            saveButton.addEventListener("click", openSaveDialog);
            toolbar.append(saveButton);

            const importButton = document.createElement("button");
            importButton.type = "button";
            importButton.className = "toolbar-button";
            importButton.textContent = "Importar";
            importButton.title = "Importar";
            importButton.addEventListener("mousedown", event => {
                event.preventDefault();
            });
            importButton.addEventListener("click", openImportFilePicker);
            toolbar.append(importButton);
        }

        /**
         * Activa, desactiva o marca cada botón según el contexto actual del cursor
         * y la vista que esté usando el usuario.
         */
        function updateToolbarState() {
            for (const tag of markdownController.getAll()) {
                const button = toolbar.querySelector(
                    `[data-tag-name="${tag.name}"]`
                );

                if (!button) continue;

                let active = false;

                const codeTag = markdownController.get("code");
                const codeContextActive = codeTag
                    ? (
                        activeView === "markdown"
                            ? markdownController.isCodeActiveInMarkdown(
                                codeTag,
                                markdownEditor
                            )
                            : markdownController.isActiveInFormatted(
                                codeTag,
                                formattedEditor
                            )
                    )
                    : false;

                if (codeContextActive && tag.name !== "code") {
                    button.classList.remove("active");
                    continue;
                }

                if (
                    tag.formatGroup === "image"
                    &&
                    imageDialogState !== null
                ) {
                    active = true;
                } else if (
                    tag.formatGroup === "link"
                    &&
                    linkDialogState !== null
                ) {
                    active = true;
                } else if (
                    tag.formatGroup === "table"
                    &&
                    tableDialogState !== null
                ) {
                    active = true;
                } else if (tag.implemented) {
                    if (activeView === "markdown") {
                        if (tag.formatGroup === "heading") {
                            active = markdownController.isHeadingActiveInMarkdown(
                                tag,
                                markdownEditor
                            );
                        } else if (tag.formatGroup === "highlight") {
                            active = markdownController.isHighlightActiveInMarkdown(
                                tag,
                                markdownEditor
                            );
                        } else if (tag.formatGroup === "quote") {
                            active = markdownController.isQuoteActiveInMarkdown(
                                tag,
                                markdownEditor
                            );
                        } else if (tag.formatGroup === "separator") {
                            active = markdownController.isSeparatorActiveInMarkdown(
                                tag,
                                markdownEditor
                            );
                        } else if (tag.formatGroup === "image") {
                            active = markdownController.isImageActiveInMarkdown(
                                tag,
                                markdownEditor
                            );
                        } else if (tag.formatGroup === "link") {
                            active = markdownController.isLinkActiveInMarkdown(
                                tag,
                                markdownEditor
                            );
                        } else if (tag.formatGroup === "code") {
                            active = markdownController.isCodeActiveInMarkdown(
                                tag,
                                markdownEditor
                            );
                        } else if (tag.formatGroup === "table") {
                            active = markdownController.isTableActiveInMarkdown(
                                tag,
                                markdownEditor
                            );
                        } else if (tag.formatGroup === "list") {
                            active = markdownController.isListActiveInMarkdown(
                                tag,
                                markdownEditor
                            );
                        } else if (tag.formatGroup === "footnote") {
                            active = markdownController.isFootnoteActiveInMarkdown(
                                tag,
                                markdownEditor
                            );
                        } else if (tag.type === "inline") {
                            active = markdownController.isInlineActiveInMarkdown(
                                tag,
                                markdownEditor
                            );
                        }
                    } else {
                        active = markdownController.isActiveInFormatted(
                            tag,
                            formattedEditor
                        );
                    }
                }

                button.classList.toggle("active", active);
            }

            updateTableContextToolbar();
        }

        /* ===== CAMBIO ENTRE VISTAS ===== */
        function showMarkdown() {
            if (activeView !== "markdown") {
                markdownEditor.value = markdownController.htmlToMarkdown(
                    formattedEditor
                );
            }

            markdownController.normalizeSeparatorsInEditor(markdownEditor);
            formattedEditor.classList.add("hidden");
            markdownEditor.classList.remove("hidden");
            formattedOption.classList.remove("active");
            markdownOption.classList.add("active");
            activeView = "markdown";
            markdownEditor.focus();
            updateToolbarState();
        }

        function showFormatted() {
            let selectedImageIndex = -1;
            let selectedLinkIndex = -1;
            let selectedCodeIndex = -1;

            if (activeView !== "formatted") {
                markdownController.normalizeSeparatorsInEditor(markdownEditor);

                const imageTag = markdownController.get("image");
                const linkTag = markdownController.get("link");
                const codeTag = markdownController.get("code");

                if (
                    codeTag
                    &&
                    markdownController.isCodeActiveInMarkdown(
                        codeTag,
                        markdownEditor
                    )
                ) {
                    const selectedCode = markdownController.findCodeBlockRange(
                        markdownEditor.value,
                        markdownEditor.selectionStart,
                        markdownEditor.selectionEnd
                    );

                    if (selectedCode) {
                        selectedCodeIndex = markdownController
                            .getCodeBlockRanges(markdownEditor.value)
                            .findIndex(
                                code =>
                                    code.openStart === selectedCode.openStart
                                    &&
                                    code.closeEnd === selectedCode.closeEnd
                            );
                    }
                }

                if (
                    imageTag
                    &&
                    markdownController.isImageActiveInMarkdown(
                        imageTag,
                        markdownEditor
                    )
                ) {
                    const selectedImage = markdownController.findImageRange(
                        markdownEditor.value,
                        markdownEditor.selectionStart,
                        markdownEditor.selectionEnd
                    );

                    if (selectedImage) {
                        selectedImageIndex = markdownController
                            .getImageRanges(markdownEditor.value)
                            .findIndex(
                                image =>
                                    image.openStart === selectedImage.openStart
                                    &&
                                    image.closeEnd === selectedImage.closeEnd
                            );
                    }
                }

                if (
                    linkTag
                    &&
                    markdownController.isLinkActiveInMarkdown(
                        linkTag,
                        markdownEditor
                    )
                ) {
                    const selectedLink = markdownController.findLinkRange(
                        markdownEditor.value,
                        markdownEditor.selectionStart,
                        markdownEditor.selectionEnd
                    );

                    if (
                        selectedLink
                        &&
                        /^!\[[^\]\n]*\]\([^\)\n]*\)$/.test(
                            selectedLink.content
                        )
                    ) {
                        selectedLinkIndex = markdownController
                            .getLinkRanges(markdownEditor.value)
                            .findIndex(
                                link =>
                                    link.openStart === selectedLink.openStart
                                    &&
                                    link.closeEnd === selectedLink.closeEnd
                            );
                    }
                }

                formattedEditor.innerHTML = markdownController.markdownToHtml(
                    markdownEditor.value
                );
            }

            markdownEditor.classList.add("hidden");
            formattedEditor.classList.remove("hidden");
            markdownOption.classList.remove("active");
            formattedOption.classList.add("active");
            activeView = "formatted";
            formattedEditor.focus();

            if (selectedCodeIndex !== -1) {
                const blocks = formattedEditor.querySelectorAll(
                    ".code-block"
                );

                const block = blocks[selectedCodeIndex];
                const firstLine = block?.firstElementChild;

                if (firstLine) {
                    markdownController.placeCaretAtStart(firstLine);
                }
            } else if (selectedLinkIndex !== -1) {
                const links = formattedEditor.querySelectorAll("a");
                const link = links[selectedLinkIndex];

                if (
                    link
                    &&
                    link.children.length === 1
                    &&
                    link.firstElementChild?.tagName === "IMG"
                ) {
                    markdownController.placeCaretAfterLink(
                        link
                    );
                }
            } else if (selectedImageIndex !== -1) {
                const images = formattedEditor.querySelectorAll("img");
                const image = images[selectedImageIndex];

                if (image && image.parentElement?.tagName !== "A") {
                    markdownController.placeCaretAfterImage(
                        image
                    );
                }
            }

            updateToolbarState();
        }

        /**
         * Punto de entrada común de los botones de formato. Decide si la operación
         * debe ejecutarse sobre Markdown o directamente sobre el DOM formateado.
         */
        function applyFormat(tagName) {
            const tag = markdownController.get(tagName);

            if (!tag || !tag.implemented) return;

            const codeTag = markdownController.get("code");
            const codeIsActive = codeTag
                ? (
                    activeView === "markdown"
                        ? markdownController.isCodeActiveInMarkdown(
                            codeTag,
                            markdownEditor
                        )
                        : markdownController.isActiveInFormatted(
                            codeTag,
                            formattedEditor
                        )
                )
                : false;

            if (codeIsActive && tagName !== "code") {
                if (activeView === "markdown") {
                    markdownEditor.focus();
                } else {
                    formattedEditor.focus();
                }

                updateToolbarState();
                return;
            }

            const imageWasActive =
                tagName === "image"
                &&
                (
                    activeView === "markdown"
                        ? markdownController.isImageActiveInMarkdown(
                            tag,
                            markdownEditor
                        )
                        : markdownController.isActiveInFormatted(
                            tag,
                            formattedEditor
                        )
                );

            const linkWasActive =
                tagName === "link"
                &&
                (
                    activeView === "markdown"
                        ? markdownController.isLinkActiveInMarkdown(
                            tag,
                            markdownEditor
                        )
                        : markdownController.isActiveInFormatted(
                            tag,
                            formattedEditor
                        )
                );

            const tableWasActive =
                tagName === "table"
                &&
                (
                    activeView === "markdown"
                        ? markdownController.isTableActiveInMarkdown(
                            tag,
                            markdownEditor
                        )
                        : markdownController.isActiveInFormatted(
                            tag,
                            formattedEditor
                        )
                );

            if (
                tagName === "table"
                &&
                !tableWasActive
            ) {
                openTableDialog();
                return;
            }

            if (tagName === "footnote") {
                const footnoteWasActive = activeView === "markdown"
                    ? markdownController.isFootnoteActiveInMarkdown(
                        tag,
                        markdownEditor
                    )
                    : markdownController.isActiveInFormatted(
                        tag,
                        formattedEditor
                    );

                if (!footnoteWasActive) {
                    createFootnoteDirectly();
                    return;
                }
            }

            let linkRemoveOnCancel = false;

            if (
                tagName === "link"
                &&
                !linkWasActive
            ) {
                if (activeView === "markdown") {
                    const selectedImage =
                        markdownController.findImageRange(
                            markdownEditor.value,
                            markdownEditor.selectionStart,
                            markdownEditor.selectionEnd
                        );

                    linkRemoveOnCancel =
                        selectedImage === null
                        &&
                        markdownEditor.selectionStart ===
                        markdownEditor.selectionEnd;
                } else {
                    const selection = window.getSelection();
                    const selectedImage =
                        markdownController.getSelectedImage(
                            formattedEditor
                        );

                    linkRemoveOnCancel =
                        selectedImage === null
                        &&
                        (
                            !selection
                            ||
                            selection.rangeCount === 0
                            ||
                            selection.getRangeAt(0).collapsed
                        );
                }
            }

            if (activeView === "markdown") {
                markdownController.normalizeSeparatorsInEditor(markdownEditor);
                markdownController.applyToMarkdown(tagName, markdownEditor);
            } else {
                markdownController.applyToFormatted(tagName, formattedEditor);
                markdownEditor.value = markdownController.htmlToMarkdown(
                    formattedEditor
                );
            }

            if (
                tagName === "image"
                &&
                !imageWasActive
            ) {
                openImageDialog();
            }

            if (
                tagName === "link"
                &&
                !linkWasActive
            ) {
                openLinkDialog(
                    linkRemoveOnCancel
                );
            }

            updateToolbarState();
        }

        for (const button of [
            tableAddRowAboveButton,
            tableAddRowBelowButton,
            tableAddColumnLeftButton,
            tableAddColumnRightButton,
            tableDeleteRowButton,
            tableDeleteColumnButton
        ]) {
            button.addEventListener("mousedown", event => {
                event.preventDefault();
            });
        }

        tableAddRowAboveButton.addEventListener(
            "click",
            () => addFormattedTableRow("above")
        );

        tableAddRowBelowButton.addEventListener(
            "click",
            () => addFormattedTableRow("below")
        );

        tableAddColumnLeftButton.addEventListener(
            "click",
            () => addFormattedTableColumn("left")
        );

        tableAddColumnRightButton.addEventListener(
            "click",
            () => addFormattedTableColumn("right")
        );

        tableDeleteRowButton.addEventListener(
            "click",
            deleteFormattedTableRow
        );

        tableDeleteColumnButton.addEventListener(
            "click",
            deleteFormattedTableColumn
        );

        markdownOption.addEventListener("click", showMarkdown);
        formattedOption.addEventListener("click", showFormatted);

        markdownEditor.addEventListener("keydown", event => {
            const codeTag = markdownController.get("code");
            const codeActive = codeTag
                &&
                markdownController.isCodeActiveInMarkdown(
                    codeTag,
                    markdownEditor
                );

            if (event.key === "Tab" && codeActive) {
                const handled = markdownController.handleTabOnCodeMarkdown(
                    markdownEditor,
                    event.shiftKey
                );

                if (handled) {
                    event.preventDefault();
                    updateToolbarState();
                }

                return;
            }

            if (event.key === "Enter" && codeActive) {
                const handled = markdownController.handleEnterOnCodeMarkdown(
                    markdownEditor
                );

                if (handled) {
                    event.preventDefault();
                    updateToolbarState();
                }

                return;
            }

            if (event.key === "Tab") {
                const handled = markdownController.handleTabOnListMarkdown(
                    markdownEditor,
                    event.shiftKey
                );

                if (handled) {
                    event.preventDefault();
                    updateToolbarState();
                }

                return;
            }

            if (event.key !== "Enter") return;

            const listHandled = markdownController.handleEnterOnListMarkdown(
                markdownEditor
            );

            if (listHandled) {
                event.preventDefault();
                updateToolbarState();
                return;
            }

            const quoteHandled = markdownController.handleEnterOnQuoteMarkdown(
                markdownEditor
            );

            if (quoteHandled) {
                event.preventDefault();
                updateToolbarState();
                return;
            }

            const highlightHandled =
                markdownController.handleEnterOnHighlightMarkdown(
                    markdownEditor
                );

            if (!highlightHandled) return;

            event.preventDefault();
            updateToolbarState();
        });

        markdownEditor.addEventListener("input", () => {
            markdownController.normalizeSeparatorsInEditor(markdownEditor);
            updateToolbarState();
        });

        markdownEditor.addEventListener("click", updateToolbarState);
        markdownEditor.addEventListener("keyup", updateToolbarState);
        markdownEditor.addEventListener("select", updateToolbarState);

        formattedEditor.addEventListener("keydown", event => {
            if (event.key === "Backspace") {
                const separatorHandled =
                    markdownController.handleBackspaceOnSeparator(
                        formattedEditor
                    );

                if (separatorHandled) {
                    event.preventDefault();
                    markdownEditor.value = markdownController.htmlToMarkdown(
                        formattedEditor
                    );
                    updateToolbarState();
                    return;
                }
            }

            const selection = window.getSelection();
            const codeActive =
                selection
                &&
                selection.rangeCount > 0
                &&
                markdownController.getCodeAncestor(
                    selection.getRangeAt(0).startContainer,
                    formattedEditor
                ) !== null;

            if (event.key === "Tab" && codeActive) {
                const handled = markdownController.handleTabOnCodeFormatted(
                    formattedEditor,
                    event.shiftKey
                );

                if (handled) {
                    event.preventDefault();
                    markdownEditor.value = markdownController.htmlToMarkdown(
                        formattedEditor
                    );
                    updateToolbarState();
                }

                return;
            }

            if (event.key === "Enter" && codeActive) {
                const handled = markdownController.handleEnterOnCodeFormatted(
                    formattedEditor
                );

                if (handled) {
                    event.preventDefault();
                    markdownEditor.value = markdownController.htmlToMarkdown(
                        formattedEditor
                    );
                    updateToolbarState();
                }

                return;
            }

            if (event.key === "Tab") {
                const handled = markdownController.handleTabOnListFormatted(
                    formattedEditor,
                    event.shiftKey
                );

                if (handled) {
                    event.preventDefault();
                    markdownEditor.value = markdownController.htmlToMarkdown(
                        formattedEditor
                    );
                    updateToolbarState();
                }

                return;
            }

            if (event.key !== "Enter") return;

            const textContainerHandled =
                markdownController.handleEnterOnTextContainer(
                    formattedEditor
                );

            if (textContainerHandled) {
                event.preventDefault();
                markdownEditor.value = markdownController.htmlToMarkdown(
                    formattedEditor
                );
                updateToolbarState();
                return;
            }

            const linkListHandled =
                markdownController.handleEnterOnLinkListFormatted(
                    formattedEditor
                );

            if (linkListHandled) {
                event.preventDefault();
                markdownEditor.value = markdownController.htmlToMarkdown(
                    formattedEditor
                );
                updateToolbarState();
                return;
            }

            const linkedImageHandled =
                markdownController.handleEnterAfterLinkedImage(
                    formattedEditor
                );

            if (linkedImageHandled) {
                event.preventDefault();
                markdownEditor.value = markdownController.htmlToMarkdown(
                    formattedEditor
                );
                updateToolbarState();
                return;
            }

            const separatorHandled = markdownController.handleEnterOnSeparator(
                formattedEditor
            );

            if (separatorHandled) {
                event.preventDefault();
                markdownEditor.value = markdownController.htmlToMarkdown(
                    formattedEditor
                );
                updateToolbarState();
                return;
            }

        });

        formattedEditor.addEventListener("mouseup", event => {
            const corrected = markdownController.correctCaretAroundSeparator(
                formattedEditor,
                event.clientY
            );

            if (corrected) {
                markdownEditor.value = markdownController.htmlToMarkdown(
                    formattedEditor
                );
            }

            updateToolbarState();
        });

        formattedEditor.addEventListener("input", () => {
            markdownEditor.value = markdownController.htmlToMarkdown(
                formattedEditor
            );
            updateToolbarState();
        });

        formattedEditor.addEventListener(
            "error",
            event => {
                const image = event.target;

                if (
                    image?.nodeType !== Node.ELEMENT_NODE
                    ||
                    image.tagName !== "IMG"
                ) {
                    return;
                }

                const link = image.parentElement;

                if (
                    !link
                    ||
                    link.tagName !== "A"
                ) {
                    return;
                }

                const unavailableText =
                    "imagen no disponible";

                image.setAttribute(
                    "alt",
                    unavailableText
                );

                image.dataset.markdownAlt =
                    unavailableText;

                const selectedLink =
                    markdownController.getSelectedLink(
                        formattedEditor
                    );

                const selectedImage =
                    markdownController.getSelectedImage(
                        formattedEditor
                    );

                markdownEditor.value =
                    markdownController.htmlToMarkdown(
                        formattedEditor
                    );

                if (
                    selectedLink === link
                    ||
                    selectedImage === image
                ) {
                    markdownController.placeCaretAfterLink(
                        link
                    );
                }

                updateToolbarState();
            },
            true
        );

        function getFootnoteReferenceCaretContext() {
            const selection = window.getSelection();

            if (
                !selection
                ||
                selection.rangeCount === 0
            ) {
                return null;
            }

            const range = selection.getRangeAt(0);

            if (!range.collapsed) {
                return null;
            }

            let reference = null;
            let offset = 0;

            if (
                range.startContainer.nodeType === Node.TEXT_NODE
                &&
                range.startContainer.parentElement?.classList.contains(
                    "footnote-reference"
                )
            ) {
                reference = range.startContainer.parentElement;
                offset = range.startOffset;
            } else if (
                range.startContainer.nodeType === Node.ELEMENT_NODE
                &&
                range.startContainer.classList.contains(
                    "footnote-reference"
                )
            ) {
                reference = range.startContainer;
                offset = range.startOffset === 0
                    ? 0
                    : (reference.textContent ?? "").length;
            } else {
                return null;
            }

            const length =
                (reference.textContent ?? "").length;

            return {
                reference,
                side: offset <= Math.floor(length / 2)
                    ? "before"
                    : "after"
            };
        }

        function placeCaretNextToFootnote(reference, side) {
            const textNode =
                document.createTextNode("\u200B");

            if (side === "before") {
                reference.before(textNode);
            } else {
                reference.after(textNode);
            }

            markdownController.placeCaretInTextNode(
                textNode,
                1
            );

            return textNode;
        }

        function insertTextAtFootnoteBoundary(text) {
            const context =
                getFootnoteReferenceCaretContext();

            if (!context) {
                return false;
            }

            const textNode = document.createTextNode(text);

            if (context.side === "before") {
                context.reference.before(textNode);
            } else {
                context.reference.after(textNode);
            }

            markdownController.placeCaretInTextNode(
                textNode,
                text.length
            );

            markdownEditor.value =
                markdownController.htmlToMarkdown(
                    formattedEditor
                );

            formattedEditor.focus();
            updateToolbarState();

            return true;
        }

        function getEdgeTextNode(reference, direction) {
            let node = direction === "before"
                ? reference.previousSibling
                : reference.nextSibling;

            while (node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    return node;
                }

                if (node.nodeType === Node.ELEMENT_NODE) {
                    const walker = document.createTreeWalker(
                        node,
                        NodeFilter.SHOW_TEXT
                    );

                    const texts = [];
                    let current;

                    while ((current = walker.nextNode())) {
                        texts.push(current);
                    }

                    if (texts.length > 0) {
                        return direction === "before"
                            ? texts[texts.length - 1]
                            : texts[0];
                    }
                }

                node = direction === "before"
                    ? node.previousSibling
                    : node.nextSibling;
            }

            return null;
        }

        function deleteTextAtFootnoteBoundary(inputType) {
            const context =
                getFootnoteReferenceCaretContext();

            if (!context) {
                return false;
            }

            const removeReference =
                (
                    context.side === "before"
                    &&
                    inputType === "deleteContentForward"
                )
                ||
                (
                    context.side === "after"
                    &&
                    inputType === "deleteContentBackward"
                );

            if (removeReference) {
                const selection = window.getSelection();
                const range = document.createRange();
                range.selectNodeContents(context.reference);
                selection.removeAllRanges();
                selection.addRange(range);

                markdownController.removeFootnoteFromFormatted(
                    formattedEditor
                );

                markdownEditor.value =
                    markdownController.htmlToMarkdown(
                        formattedEditor
                    );

                updateToolbarState();
                return true;
            }

            const direction =
                context.side === "before"
                    ? "before"
                    : "after";

            const textNode =
                getEdgeTextNode(
                    context.reference,
                    direction
                );

            if (!textNode) {
                placeCaretNextToFootnote(
                    context.reference,
                    context.side
                );

                return true;
            }

            let value =
                textNode.textContent.replaceAll(
                    "\u200B",
                    ""
                );

            if (direction === "before") {
                value = value.slice(0, -1);
                textNode.textContent = value;
                markdownController.placeCaretInTextNode(
                    textNode,
                    value.length
                );
            } else {
                value = value.slice(1);
                textNode.textContent = value;
                markdownController.placeCaretInTextNode(
                    textNode,
                    0
                );
            }

            markdownEditor.value =
                markdownController.htmlToMarkdown(
                    formattedEditor
                );

            updateToolbarState();
            return true;
        }

        formattedEditor.addEventListener("beforeinput", event => {
            if (activeView !== "formatted") {
                return;
            }

            if (
                (
                    event.inputType === "insertText"
                    ||
                    event.inputType === "insertCompositionText"
                )
                &&
                typeof event.data === "string"
                &&
                event.data.length > 0
            ) {
                if (insertTextAtFootnoteBoundary(event.data)) {
                    event.preventDefault();
                }

                return;
            }

            if (
                event.inputType === "deleteContentBackward"
                ||
                event.inputType === "deleteContentForward"
            ) {
                if (deleteTextAtFootnoteBoundary(event.inputType)) {
                    event.preventDefault();
                }
            }
        });

        /* ===== EVENTOS DE INTERACCIÓN DE LA VISTA FORMATEADA ===== */
        formattedEditor.addEventListener("click", event => {
            const link = event.target.closest?.("a");

            if (link) {
                const href = markdownController.normalizeWebUrl(
                    link.getAttribute("href")
                    ?? ""
                );

                if (href.length > 0) {
                    event.preventDefault();
                    link.setAttribute("href", href);

                    window.open(
                        href,
                        "_blank",
                        "noopener,noreferrer"
                    );
                }

                if (
                    event.target.tagName === "IMG"
                    &&
                    event.target.parentElement === link
                ) {
                    markdownController.placeCaretAfterLink(
                        link
                    );
                }
            }

            updateToolbarState();
        });
        formattedEditor.addEventListener("keyup", updateToolbarState);

        document.addEventListener("selectionchange", () => {
            if (activeView === "formatted") {
                updateToolbarState();
            }
        });

        /* ===== EVENTOS DE LOS DIÁLOGOS =====
         * Escape cancela/cierra y Enter confirma cuando la acción es válida.
         */
        imageDialogAcceptButton.addEventListener(
            "click",
            acceptImageDialog
        );

        imageDialogCancelButton.addEventListener(
            "click",
            cancelImageDialog
        );

        imageDialogBackdrop.addEventListener(
            "mousedown",
            event => {
                if (event.target === imageDialogBackdrop) {
                    cancelImageDialog();
                }
            }
        );

        imageDialogBackdrop.addEventListener(
            "keydown",
            event => {
                if (event.key === "Escape") {
                    event.preventDefault();
                    cancelImageDialog();
                    return;
                }

                if (event.key === "Enter") {
                    event.preventDefault();
                    acceptImageDialog();
                }
            }
        );

        linkImageToggle.addEventListener(
            "click",
            () => {
                linkImageMode = !linkImageMode;

                updateLinkImageField();

                if (linkImageMode) {
                    linkImageUrlInput.focus();
                    linkImageUrlInput.select();
                } else {
                    linkTextInput.focus();
                    linkTextInput.select();
                }
            }
        );

        linkDialogAcceptButton.addEventListener(
            "click",
            acceptLinkDialog
        );

        linkDialogCancelButton.addEventListener(
            "click",
            cancelLinkDialog
        );

        linkDialogBackdrop.addEventListener(
            "mousedown",
            event => {
                if (event.target === linkDialogBackdrop) {
                    cancelLinkDialog();
                }
            }
        );

        linkDialogBackdrop.addEventListener(
            "keydown",
            event => {
                if (event.key === "Escape") {
                    event.preventDefault();
                    cancelLinkDialog();
                    return;
                }

                if (event.key === "Enter") {
                    event.preventDefault();
                    acceptLinkDialog();
                }
            }
        );

        tableDialogAcceptButton.addEventListener(
            "click",
            acceptTableDialog
        );

        tableDialogCancelButton.addEventListener(
            "click",
            cancelTableDialog
        );

        tableDialogBackdrop.addEventListener(
            "mousedown",
            event => {
                if (event.target === tableDialogBackdrop) {
                    cancelTableDialog();
                }
            }
        );

        tableDialogBackdrop.addEventListener(
            "keydown",
            event => {
                if (event.key === "Escape") {
                    event.preventDefault();
                    cancelTableDialog();
                    return;
                }

                if (event.key === "Enter") {
                    event.preventDefault();
                    acceptTableDialog();
                }
            }
        );

        saveDialogSaveButton.addEventListener(
            "click",
            saveSelectedFormat
        );

        saveDialogCancelButton.addEventListener(
            "click",
            closeSaveDialog
        );

        saveDialogBackdrop.addEventListener(
            "mousedown",
            event => {
                if (event.target === saveDialogBackdrop) {
                    closeSaveDialog();
                }
            }
        );

        saveDialogBackdrop.addEventListener(
            "keydown",
            event => {
                if (event.key === "Escape") {
                    event.preventDefault();
                    closeSaveDialog();
                    return;
                }

                if (
                    event.key === "Enter"
                    &&
                    !saveDialogSaveButton.disabled
                ) {
                    event.preventDefault();
                    saveSelectedFormat();
                }
            }
        );

        /* Atajo de guardado: Ctrl+S en Windows/Linux y Cmd+S en macOS. */
        document.addEventListener("keydown", event => {
            if (
                (event.ctrlKey || event.metaKey)
                &&
                event.key.toLowerCase() === "s"
            ) {
                event.preventDefault();
                openSaveDialog();
            }
        });

        /* ===== INICIALIZACIÓN ===== */
        createToolbar();
        updateToolbarState();
    </script>
</body>
</html>
