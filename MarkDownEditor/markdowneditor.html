                                    contentIndex < closeIndex;
                                    contentIndex++
                                ) {
                                    contentLines.push(lines[contentIndex]);
                                }

                                contentLines.push(
                                    lines[closeIndex].substring(
                                        0,
                                        lines[closeIndex].length - 2
                                    )
                                );
                            }

                            html.push(
                                '<div class="highlight-block">' +
                                this.renderHighlightContent(contentLines) +
                                "</div>"
                            );

                            index = closeIndex;
                            continue;
                        }
                    }

                    if (this.parseMarkdownListLine(line)) {
                        const listLines = [];
                        let listIndex = index;

                        while (
                            listIndex < lines.length
                            &&
                            this.parseMarkdownListLine(lines[listIndex])
                        ) {
                            listLines.push(lines[listIndex]);
                            listIndex++;
                        }

                        html.push(this.renderListBlock(listLines));
                        index = listIndex - 1;
                        continue;
                    }

                    if (this.isQuoteMarkdownLine(line)) {
                        const quoteLines = [];
                        let quoteIndex = index;

                        while (
                            quoteIndex < lines.length &&
                            this.isQuoteMarkdownLine(lines[quoteIndex])
                        ) {
                            quoteLines.push(lines[quoteIndex]);
                            quoteIndex++;
                        }

                        html.push(
                            '<div class="quote-block">' +
                            this.renderQuoteContent(quoteLines) +
                            "</div>"
                        );

                        index = quoteIndex - 1;
                        continue;
                    }

                    html.push(this.renderMarkdownLine(line));
                }

                if (footnoteDefinitions.length > 0) {
                    html.push(
                        '<div class="footnotes-section">' +
                        '<hr class="footnotes-separator" contenteditable="false">' +
                        footnoteDefinitions.join("") +
                        '</div>'
                    );
                }

                return html.join("");
            }

            /* HTML -> MARKDOWN */

            htmlToMarkdown(editor) {
                const convertInline = node => {
                    if (node.nodeType === Node.TEXT_NODE) {
                        return node.textContent.replaceAll("\u200B", "");
                    }

                    if (node.nodeType !== Node.ELEMENT_NODE) return "";
                    if (node.tagName === "BR") return "";

                    if (
                        node.tagName === "SUP"
                        &&
                        node.classList.contains("footnote-reference")
                    ) {
                        const id = node.dataset.footnoteId ?? "";
                        return `[^${id}]`;
                    }

                    if (node.tagName === "IMG") {
                        const alternativeText =
                            node.dataset.markdownAlt
                            ??
                            node.getAttribute("alt")
                            ??
                            "";

                        const url = node.getAttribute("src") ?? "";
                        return `![${alternativeText}](${url})`;
                    }

                    if (node.tagName === "A") {
                        const url = node.getAttribute("href") ?? "";
                        const content = [...node.childNodes]
                            .map(convertInline)
                            .join("");

                        return `[${content}](${url})`;
                    }

                    const children = [...node.childNodes]
                        .map(convertInline)
                        .join("");

                    for (const tag of this.tags.values()) {
                        if (tag.type !== "inline" || !tag.htmlTags) continue;

                        if (tag.htmlTags.includes(node.tagName.toLowerCase())) {
                            return tag.markdownStart + children + tag.markdownEnd;
                        }
                    }

                    return children;
                };

                const convertQuote = block => {
                    const content = [...block.childNodes]
                        .map(convertBlock)
                        .join("\n");

                    return content
                        .split("\n")
                        .map(line => line.length === 0 ? ">" : "> " + line)
                        .join("\n");
                };

                const convertHighlight = block => {
                    const content = [...block.childNodes]
                        .map(convertBlock)
                        .join("\n");

                    return "==" + content + "==";
                };

                const convertList = (list, level = 0) => {
                    const ordered = list.tagName === "OL";
                    const linkList =
                        list.tagName === "UL"
                        &&
                        list.classList.contains("link-list");
                    const start = ordered
                        ? Number.parseInt(list.getAttribute("start") ?? "1", 10)
                        : 1;

                    const lines = [];
                    const items = [...list.children].filter(
                        child => child.tagName === "LI"
                    );

                    items.forEach((item, index) => {
                        const content = [...item.childNodes]
                            .filter(node => !(
                                node.nodeType === Node.ELEMENT_NODE
                                &&
                                (node.tagName === "UL" || node.tagName === "OL")
                            ))
                            .map(node => {
                                if (
                                    node.nodeType === Node.ELEMENT_NODE
                                    &&
                                    (node.tagName === "DIV" || node.tagName === "P")
                                ) {
                                    return [...node.childNodes]
                                        .map(convertInline)
                                        .join("");
                                }

                                return convertInline(node);
                            })
                            .join("")
                            .replaceAll("\u200B", "");

                        const marker = ordered
                            ? `${start + index}.`
                            : "-";

                        const indent = "    ".repeat(level);
                        lines.push(`${indent}${marker} ${content}`);

                        for (const child of item.children) {
                            if (child.tagName === "UL" || child.tagName === "OL") {
                                lines.push(convertList(child, level + 1));
                            }
                        }
                    });

                    return lines.join("\n");
                };

                const convertTable = table => {
                    const headerRow = table.querySelector(
                        ":scope > thead > tr:first-child"
                    );

                    const hasHeaders =
                        table.dataset.hasHeaders === "false"
                            ? false
                            : headerRow !== null;

                    const headers = hasHeaders && headerRow
                        ? [...headerRow.children]
                        : [];

                    const bodyRows = [
                        ...table.querySelectorAll(
                            ":scope > tbody > tr"
                        )
                    ];

                    const wrapTableCellSerializedLines = (
                        serialized,
                        type
                    ) => {
                        const parts = serialized.split(/<br\s*\/?>/i);

                        return parts.map(part => (
                            type === "quote"
                                ? "> " + part
                                : "==" + part + "=="
                        )).join("<br>");
                    };

                    const serializeTableCellChildren = container => {
                        const segments = [];
                        let inline = "";

                        const flushInline = () => {
                            if (inline.length === 0) return;
                            segments.push(inline);
                            inline = "";
                        };

                        for (const child of container.childNodes) {
                            const isTextContainer = (
                                child.nodeType === Node.ELEMENT_NODE
                                && (
                                    child.classList.contains("quote-block")
                                    || child.classList.contains("highlight-block")
                                )
                            );

                            const isLineBlock = (
                                child.nodeType === Node.ELEMENT_NODE
                                && /^(DIV|P|H[1-6])$/.test(child.tagName)
                                && !isTextContainer
                            );

                            if (isTextContainer || isLineBlock) {
                                flushInline();
                                segments.push(convertTableCellNode(child));
                                continue;
                            }

                            inline += convertTableCellNode(child);
                        }

                        flushInline();

                        if (segments.length === 0) {
                            segments.push("");
                        }

                        return segments.join("<br>");
                    };

                    const convertTableCellNode = node => {
                        if (node.nodeType === Node.TEXT_NODE) {
                            return node.textContent.replaceAll("\u200B", "");
                        }

                        if (node.nodeType !== Node.ELEMENT_NODE) return "";

                        if (node.classList.contains("highlight-block")) {
                            return wrapTableCellSerializedLines(
                                serializeTableCellChildren(node),
                                "highlight"
                            );
                        }

                        if (node.classList.contains("quote-block")) {
                            return wrapTableCellSerializedLines(
                                serializeTableCellChildren(node),
                                "quote"
                            );
                        }

                        if (
                            node.tagName === "DIV"
                            || node.tagName === "P"
                            || /^H[1-6]$/.test(node.tagName)
                        ) {
                            return [...node.childNodes]
                                .map(convertTableCellNode)
                                .join("");
                        }

                        return convertInline(node);
                    };

                    const cellMarkdown = cell => (
                        serializeTableCellChildren(cell)
                            .replaceAll("\n", " ")
                            .trim()
                    );

                    const columnCount = hasHeaders
                        ? headers.length
                        : Math.max(
                            0,
                            ...bodyRows.map(row => row.children.length)
                        );

                    if (columnCount === 0) {
                        return "";
                    }

                    const lines = [];

                    if (hasHeaders) {
                        lines.push(
                            "| "
                            +
                            headers.map(cellMarkdown).join(" | ")
                            +
                            " |"
                        );
                    }

                    lines.push(
                        "| "
                        +
                        Array.from(
                            { length: columnCount },
                            () => "---"
                        ).join(" | ")
                        +
                        " |"
                    );

                    for (const row of bodyRows) {
                        const cells = [...row.children];

                        lines.push(
                            "| "
                            +
                            Array.from(
                                { length: columnCount },
                                (_, index) => (
                                    cells[index]
                                        ? cellMarkdown(cells[index])
                                        : ""
                                )
                            ).join(" | ")
                            +
                            " |"
                        );
                    }

                    return lines.join("\n");
                };

                const convertBlock = node => {
                    if (node.nodeType === Node.TEXT_NODE) {
                        return node.textContent.replaceAll("\u200B", "");
                    }

                    if (node.nodeType !== Node.ELEMENT_NODE) return "";
                    if (node.tagName === "IMG") return convertInline(node);

                    if (node.classList.contains("footnotes-section")) {
                        return [...node.querySelectorAll(
                            ":scope > .footnote-definition"
                        )]
                            .map(definition => convertBlock(definition))
                            .join("\n");
                    }

                    if (node.classList.contains("footnotes-separator")) {
                        return "";
                    }

                    if (node.classList.contains("footnote-definition")) {
                        const id = node.dataset.footnoteId ?? "";
                        const textContainer = node.querySelector(
                            ":scope > .footnote-text"
                        );

                        const noteText = textContainer
                            ? [...textContainer.childNodes]
                                .map(convertInline)
                                .join("")
                            : "";

                        return `[^${id}]: ${noteText}`;
                    }

                    if (node.classList.contains("code-block")) {
                        const code = [...node.children]
                            .map(line => (
                                line.textContent ?? ""
                            ).replaceAll("\u200B", ""))
                            .join("\n");

                        return (
                            "```\n"
                            + code
                            + (code.endsWith("\n") ? "" : "\n")
                            + "```"
                        );
                    }

                    if (node.classList.contains("quote-block")) return convertQuote(node);
                    if (node.classList.contains("highlight-block")) return convertHighlight(node);

                    const tagName = node.tagName.toLowerCase();

                    if (tagName === "table") {
                        return convertTable(node);
                    }

                    if (tagName === "ul" || tagName === "ol") {
                        return convertList(node);
                    }

                    if (tagName === "hr") return "~~~";

                    const heading = tagName.match(/^h([1-6])$/);

                    if (heading) {
                        const level = Number(heading[1]);
                        const content = [...node.childNodes]
                            .map(convertInline)
                            .join("");

                        return "#".repeat(level) + " " + content;
                    }

                    if (tagName === "div" || tagName === "p") {
                        return [...node.childNodes]
                            .map(convertInline)
                            .join("");
                    }

                    return convertInline(node);
                };

                const result = [...editor.childNodes].map(convertBlock);
                return this.normalizeSeparatorText(result.join("\n"));
            }

            /* INLINE MARKDOWN */

            findInlineRange(tag, text, start, end) {
                const lineStart = this.getLineStart(text, start);
                const lineEnd = this.getLineEnd(text, end);
                const bounds = this.getLineContentBounds(text, lineStart, lineEnd);
                const content = text.substring(bounds.contentStart, bounds.contentEnd);
                const localStart = Math.max(0, start - bounds.contentStart);
                const localEnd = Math.min(content.length, end - bounds.contentStart);
                const startMarker = tag.markdownStart;
                const endMarker = tag.markdownEnd;
                let searchPosition = 0;

                while (searchPosition < content.length) {
                    const open = content.indexOf(startMarker, searchPosition);
                    if (open === -1) break;

                    const contentStart = open + startMarker.length;
                    const close = content.indexOf(endMarker, contentStart);
                    if (close === -1) break;

                    const closeEnd = close + endMarker.length;
                    const collapsed = localStart === localEnd;

                    const insideContent =
                        localStart >= contentStart
                        &&
                        localEnd <= close;

                    /*
                     * Cuando hay selección, el navegador/usuario puede incluir
                     * también uno o los dos marcadores del formato. Sigue siendo
                     * el mismo formato y el botón debe quitarlo, no anidarlo.
                     */
                    const selectionInsideWrapper =
                        !collapsed
                        &&
                        localStart >= open
                        &&
                        localEnd <= closeEnd
                        &&
                        localStart < close
                        &&
                        localEnd > contentStart;

                    const insideOpeningMarker =
                        collapsed
                        &&
                        localStart > open
                        &&
                        localStart < contentStart;

                    const insideClosingMarker =
                        collapsed
                        &&
                        localStart > close
                        &&
                        localStart < closeEnd;

                    if (
                        insideContent
                        ||
                        selectionInsideWrapper
                        ||
                        insideOpeningMarker
                        ||
                        insideClosingMarker
                    ) {
                        return {
                            openStart: bounds.contentStart + open,
                            contentStart: bounds.contentStart + contentStart,
                            closeStart: bounds.contentStart + close,
                            closeEnd: bounds.contentStart + closeEnd
                        };
                    }

                    searchPosition = close + endMarker.length;
                }

                return null;
            }

            findStrikethroughRange(text, start, end = start) {
                const lineStart = this.getLineStart(text, start);
                const lineEnd = this.getLineEnd(text, end);
                const line = text.substring(lineStart, lineEnd);

                if (line === "~~~") {
                    return null;
                }

                const runs = [];
                const expression = /~~/g;
                let match;

                while ((match = expression.exec(line)) !== null) {
                    runs.push({
                        start: lineStart + match.index,
                        end: lineStart + match.index + 2
                    });
                }

                for (let index = 0; index + 1 < runs.length; index += 2) {
                    const opening = runs[index];
                    const closing = runs[index + 1];

                    const collapsed = start === end;
                    const insideRange = collapsed
                        ? (
                            start > opening.start
                            &&
                            start < closing.end
                        )
                        : (
                            start >= opening.start
                            &&
                            end <= closing.end
                            &&
                            start < closing.start
                            &&
                            end > opening.end
                        );

                    if (insideRange) {
                        return {
                            openStart: opening.start,
                            contentStart: opening.end,
                            closeStart: closing.start,
                            closeEnd: closing.end,
                            openLength: opening.end - opening.start,
                            closeLength: closing.end - closing.start
                        };
                    }
                }

                return null;
            }

            removeStrikethroughFromMarkdown(editor, formatRange) {
                const value = editor.value;
                const selectionStart = editor.selectionStart;
                const selectionEnd = editor.selectionEnd;

                const partialSelection =
                    selectionStart < selectionEnd
                    && selectionStart >= formatRange.contentStart
                    && selectionEnd <= formatRange.closeStart
                    && !(
                        selectionStart === formatRange.contentStart
                        && selectionEnd === formatRange.closeStart
                    );

                if (partialSelection) {
                    const openMarker = value.substring(
                        formatRange.openStart,
                        formatRange.contentStart
                    );

                    const closeMarker = value.substring(
                        formatRange.closeStart,
                        formatRange.closeEnd
                    );

                    const before = value.substring(
                        formatRange.contentStart,
                        selectionStart
                    );

                    const selected = value.substring(
                        selectionStart,
                        selectionEnd
                    );

                    const after = value.substring(
                        selectionEnd,
                        formatRange.closeStart
                    );

                    const beforeFormatted = before.length > 0
                        ? openMarker + before + closeMarker
                        : "";

                    const afterFormatted = after.length > 0
                        ? openMarker + after + closeMarker
                        : "";

                    const replacement =
                        beforeFormatted
                        + selected
                        + afterFormatted;

                    editor.value =
                        value.substring(0, formatRange.openStart)
                        + replacement
                        + value.substring(formatRange.closeEnd);

                    const newStart =
                        formatRange.openStart
                        + beforeFormatted.length;

                    editor.setSelectionRange(
                        newStart,
                        newStart + selected.length
                    );

                    editor.focus();
                    return;
                }

                const content = value.substring(
                    formatRange.contentStart,
                    formatRange.closeStart
                );

                editor.value =
                    value.substring(0, formatRange.openStart)
                    +
                    content
                    +
                    value.substring(formatRange.closeEnd);

                const adjustPosition = position => {
                    if (position <= formatRange.openStart) {
                        return position;
                    }

                    if (position <= formatRange.contentStart) {
                        return formatRange.openStart;
                    }

                    if (position <= formatRange.closeStart) {
                        return position - formatRange.openLength;
                    }

                    if (position <= formatRange.closeEnd) {
                        return formatRange.openStart + content.length;
                    }

                    return (
                        position
                        -
                        formatRange.openLength
                        -
                        formatRange.closeLength
                    );
                };

                const newStart = Math.max(
                    formatRange.openStart,
                    adjustPosition(selectionStart)
                );

                const newEnd = Math.max(
                    newStart,
                    adjustPosition(selectionEnd)
                );

                editor.setSelectionRange(
                    newStart,
                    newEnd
                );

                editor.focus();
            }

            findInlineRangeFromMarkerPosition(tag, text, position) {
                if (
                    !tag.markdownStart
                    ||
                    tag.markdownStart !== tag.markdownEnd
                    ||
                    tag.markdownStart.length < 2
                ) {
                    return null;
                }

                const marker = tag.markdownStart;
                const markerStart = position - 1;

                if (
                    markerStart < 0
                    ||
                    text.substring(
                        markerStart,
                        markerStart + marker.length
                    ) !== marker
                ) {
                    return null;
                }

                const lineStart = this.getLineStart(text, position);
                const lineEnd = this.getLineEnd(text, position);
                const occurrences = [];
                let searchPosition = lineStart;

                while (searchPosition < lineEnd) {
                    const found = text.indexOf(
                        marker,
                        searchPosition
                    );

                    if (found === -1 || found >= lineEnd) {
                        break;
                    }

                    occurrences.push(found);
                    searchPosition = found + marker.length;
                }

                const markerIndex = occurrences.indexOf(markerStart);

                if (markerIndex === -1) {
                    return null;
                }

                const openingIndex =
                    markerIndex % 2 === 0
                        ? markerIndex
                        : markerIndex - 1;

                const closingIndex = openingIndex + 1;

                if (
                    openingIndex < 0
                    ||
                    closingIndex >= occurrences.length
                ) {
                    return null;
                }

                const openStart = occurrences[openingIndex];
                const closeStart = occurrences[closingIndex];

                return {
                    openStart,
                    contentStart: openStart + marker.length,
                    closeStart,
                    closeEnd: closeStart + marker.length
                };
            }

            inlineHasFormat(tag, text, start, end) {
                if (tag.allowNesting) return false;

                if (
                    start === end
                    &&
                    this.findInlineRangeFromMarkerPosition(
                        tag,
                        text,
                        start
                    )
                ) {
                    return true;
                }

                return this.findInlineRange(tag, text, start, end) !== null;
            }

            removeInlineFromMarkdown(tag, editor, formatRange) {
                const value = editor.value;
                const selectionStart = editor.selectionStart;
                const selectionEnd = editor.selectionEnd;
                const startLength = tag.markdownStart.length;
                const endLength = tag.markdownEnd.length;

                /*
                 * Si solo se ha seleccionado una parte del contenido que ya
                 * tiene este formato, no quitamos el formato a todo el bloque.
                 * Partimos el envoltorio en las secciones necesarias para que
                 * únicamente la selección quede sin ese formato.
                 */
                const partialSelection =
                    selectionStart < selectionEnd
                    && selectionStart >= formatRange.contentStart
                    && selectionEnd <= formatRange.closeStart
                    && !(
                        selectionStart === formatRange.contentStart
                        && selectionEnd === formatRange.closeStart
                    );

                if (partialSelection) {
                    const before = value.substring(
                        formatRange.contentStart,
                        selectionStart
                    );

                    const selected = value.substring(
                        selectionStart,
                        selectionEnd
                    );

                    const after = value.substring(
                        selectionEnd,
                        formatRange.closeStart
                    );

                    const beforeFormatted = before.length > 0
                        ? tag.markdownStart + before + tag.markdownEnd
                        : "";

                    const afterFormatted = after.length > 0
                        ? tag.markdownStart + after + tag.markdownEnd
                        : "";

                    const replacement =
                        beforeFormatted
                        + selected
                        + afterFormatted;

                    editor.value =
                        value.substring(0, formatRange.openStart)
                        + replacement
                        + value.substring(formatRange.closeEnd);

                    const newStart =
                        formatRange.openStart
                        + beforeFormatted.length;

                    editor.setSelectionRange(
                        newStart,
                        newStart + selected.length
                    );

                    editor.focus();
                    return;
                }

                const content = value.substring(
                    formatRange.contentStart,
                    formatRange.closeStart
                );

                editor.value =
                    value.substring(0, formatRange.openStart) +
                    content +
                    value.substring(formatRange.closeEnd);

                const adjustPosition = position => {
                    if (position <= formatRange.openStart) return position;
                    if (position <= formatRange.closeStart) return position - startLength;
                    return position - startLength - endLength;
                };

                const newStart = Math.max(
                    formatRange.openStart,
                    adjustPosition(selectionStart)
                );

                const newEnd = Math.max(
                    newStart,
                    adjustPosition(selectionEnd)
                );

                editor.setSelectionRange(newStart, newEnd);
                editor.focus();
            }

            /* ESTADOS MARKDOWN */

            isHeadingActiveInMarkdown(tag, editor) {
                const value = editor.value;
                const position = editor.selectionStart;
                const lineStart = this.getLineStart(value, position);
                const lineEnd = this.getLineEnd(value, position);
                const bounds = this.getContainerLineBounds(value, lineStart, lineEnd);
                let content = value.substring(bounds.contentStart, bounds.contentEnd);
                content = content.replace(/^>\s?/, "");
                const heading = content.match(/^(#{1,6})\s*/);
                return heading ? heading[1].length === tag.level : false;
            }

            isHighlightActiveInMarkdown(tag, editor) {
                return this.findHighlightRange(
                    editor.value,
                    editor.selectionStart,
                    editor.selectionEnd
                ) !== null;
            }

            isQuoteActiveInMarkdown(tag, editor) {
                const value = editor.value;
                const position = editor.selectionStart;
                const lineStart = this.getLineStart(value, position);
                const lineEnd = this.getLineEnd(value, position);
                const bounds = this.getContainerLineBounds(value, lineStart, lineEnd);
                const content = value.substring(bounds.contentStart, bounds.contentEnd);
                return /^>\s?/.test(content);
            }

            getTextLinkExternalFormatStructure(text, link) {
                const wrappers = [];
                let openStart = link.openStart;
                let closeEnd = link.closeEnd;
                let expanded = true;

                while (expanded) {
                    expanded = false;

                    for (const inlineTag of this.tags.values()) {
                        if (inlineTag.type !== "inline") continue;
                        if (!inlineTag.markdownStart || !inlineTag.markdownEnd) continue;

                        const startLength = inlineTag.markdownStart.length;
                        const endLength = inlineTag.markdownEnd.length;
                        const wrapperOpenStart = openStart - startLength;
                        const wrapperCloseStart = closeEnd;

                        if (
                            wrapperOpenStart >= 0
                            &&
                            text.substring(
                                wrapperOpenStart,
                                openStart
                            ) === inlineTag.markdownStart
                            &&
                            text.substring(
                                closeEnd,
                                closeEnd + endLength
                            ) === inlineTag.markdownEnd
                        ) {
                            wrappers.push({
                                tag: inlineTag,
                                openStart: wrapperOpenStart,
                                openEnd: openStart,
                                closeStart: wrapperCloseStart,
                                closeEnd: closeEnd + endLength
                            });

                            openStart = wrapperOpenStart;
                            closeEnd += endLength;
                            expanded = true;
                            break;
                        }
                    }
                }

                return {
                    wrappers,
                    openStart,
                    closeEnd
                };
            }

            getTextLinkExternalFormatContextAtPosition(text, position) {
                for (const link of this.getLinkRanges(text)) {
                    if (
                        /^!\[[^\]\n]*\]\([^\)\n]*\)$/.test(
                            link.content
                        )
                    ) {
                        continue;
                    }

                    const structure =
                        this.getTextLinkExternalFormatStructure(
                            text,
                            link
                        );

                    for (const wrapper of structure.wrappers) {
                        const inOpeningMarker =
                            position >= wrapper.openStart
                            &&
                            position < wrapper.openEnd;

                        const inClosingMarker =
                            position >= wrapper.closeStart
                            &&
                            position < wrapper.closeEnd;

                        if (inOpeningMarker || inClosingMarker) {
                            return {
                                link,
                                structure,
                                wrapper
                            };
                        }
                    }
                }

                return null;
            }

            getTextLinkExternalFormatMarkerAtPosition(text, position) {
                return this.getTextLinkExternalFormatContextAtPosition(
                    text,
                    position
                )?.wrapper.tag ?? null;
            }

            toggleInlineFromTextLinkFormatMarker(tag, editor) {
                if (editor.selectionStart !== editor.selectionEnd) {
                    return false;
                }

                const context =
                    this.getTextLinkExternalFormatContextAtPosition(
                        editor.value,
                        editor.selectionStart
                    );

                if (
                    !context
                    ||
                    context.wrapper.tag.name !== tag.name
                ) {
                    return false;
                }

                const markdown = editor.value.substring(
                    context.structure.openStart,
                    context.structure.closeEnd
                );

                const newMarkdown =
                    this.toggleWholeInlineMarkdownContent(
                        markdown,
                        tag
                    );

                editor.setRangeText(
                    newMarkdown,
                    context.structure.openStart,
                    context.structure.closeEnd,
                    "end"
                );

                editor.setSelectionRange(
                    context.structure.openStart,
                    context.structure.openStart + newMarkdown.length
                );

                editor.focus();
                return true;
            }

            isInlineActiveInMarkdown(tag, editor) {
                if (tag.name === "strikethrough") {
                    return this.findStrikethroughRange(
                        editor.value,
                        editor.selectionStart,
                        editor.selectionEnd
                    ) !== null;
                }

                if (editor.selectionStart === editor.selectionEnd) {
                    const markerTag =
                        this.getTextLinkExternalFormatMarkerAtPosition(
                            editor.value,
                            editor.selectionStart
                        );

                    if (markerTag) {
                        return markerTag.name === tag.name;
                    }
                }

                const link = this.getSelectedTextLinkRangeInMarkdown(editor);

                if (link) {
                    const structure =
                        this.getTextLinkExternalFormatStructure(
                            editor.value,
                            link
                        );

                    return structure.wrappers.some(
                        wrapper => wrapper.tag.name === tag.name
                    );
                }

                return this.inlineHasFormat(
                    tag,
                    editor.value,
                    editor.selectionStart,
                    editor.selectionEnd
                );
            }

            isSeparatorActiveInMarkdown(tag, editor) {
                const value = editor.value;
                const position = editor.selectionStart;
                const lineStart = this.getLineStart(value, position);
                const lineEnd = this.getLineEnd(value, position);
                const bounds = this.getLineContentBounds(value, lineStart, lineEnd);

                return value.substring(
                    bounds.contentStart,
                    bounds.contentEnd
                ) === tag.markdownLine;
            }

            /* APLICAR MARKDOWN */

            applyToMarkdown(tagName, editor) {
                const tag = this.get(tagName);
                if (!tag || !tag.implemented) return;

                if (tag.formatGroup === "heading") {
                    this.toggleHeadingToMarkdown(tag, editor);
                    return;
                }

                if (tag.formatGroup === "separator") {
                    this.toggleSeparatorToMarkdown(tag, editor);
                    return;
                }

                if (tag.formatGroup === "highlight") {
                    this.toggleHighlightToMarkdown(tag, editor);
                    return;
                }

                if (tag.formatGroup === "quote") {
                    this.toggleQuoteToMarkdown(tag, editor);
                    return;
                }

                if (tag.formatGroup === "image") {
                    this.toggleImageToMarkdown(tag, editor);
                    return;
                }

                if (tag.formatGroup === "link") {
                    const listInfo = this.getMarkdownListLineAtPosition(
                        editor.value,
                        editor.selectionStart
                    );

                    if (listInfo) {
                        editor.focus();
                        return;
                    }

                    this.toggleLinkToMarkdown(tag, editor);
                    return;
                }

                if (tag.formatGroup === "code") {
                    this.toggleCodeToMarkdown(tag, editor);
                    return;
                }

                if (tag.formatGroup === "table") {
                    this.toggleTableToMarkdown(tag, editor);
                    return;
                }

                if (tag.formatGroup === "list") {
                    this.toggleListToMarkdown(tag, editor);
                    return;
                }

                if (tag.formatGroup === "footnote") {
                    this.removeFootnoteFromMarkdown(editor);
                    return;
                }

                if (tag.type === "inline") {
                    this.toggleInlineToMarkdown(tag, editor);
                }
            }

            toggleHighlightToMarkdown(tag, editor) {
                const value = editor.value;
                const selectionStart = editor.selectionStart;
                const selectionEnd = editor.selectionEnd;
                const activeRange = this.findHighlightRange(
                    value,
                    selectionStart,
                    selectionEnd
                );

                if (activeRange) {
                    const openLength = tag.markdownStart.length;
                    const closeLength = tag.markdownEnd.length;

                    editor.value =
                        value.substring(0, activeRange.openStart)
                        + value.substring(activeRange.contentStart, activeRange.closeStart)
                        + value.substring(activeRange.closeEnd);

                    const adjustPosition = position => {
                        if (position <= activeRange.openStart) return position;
                        if (position <= activeRange.contentStart) {
                            return activeRange.openStart;
                        }
                        if (position <= activeRange.closeStart) {
                            return position - openLength;
                        }
                        if (position <= activeRange.closeEnd) {
                            return activeRange.closeStart - openLength;
                        }
                        return position - openLength - closeLength;
                    };

                    const newStart = adjustPosition(selectionStart);
                    const newEnd = adjustPosition(selectionEnd);
                    editor.setSelectionRange(newStart, Math.max(newStart, newEnd));
                    editor.focus();
                    return;
                }

                const blockStart = this.getLineStart(value, selectionStart);
                let effectiveEnd = selectionEnd;

                if (effectiveEnd > blockStart && value[effectiveEnd - 1] === "\n") {
                    effectiveEnd--;
                }

                const blockEnd = this.getLineEnd(value, effectiveEnd);
                const firstLineEnd = this.getLineEnd(value, blockStart);
                const lastLineStart = this.getLineStart(value, blockEnd);
                const firstBounds = this.getDeepContainerLineBounds(
                    value,
                    blockStart,
                    firstLineEnd
                );
                const lastBounds = this.getDeepContainerLineBounds(
                    value,
                    lastLineStart,
                    blockEnd
                );

                const openPosition = firstBounds.contentStart;
                const closePosition = lastBounds.contentEnd;

                /*
                 * Siempre añadimos una capa nueva. Si ya estamos dentro de un
                 * citado/destacado, los marcadores se insertan dentro de la
                 * capa activa en lugar de sustituirla.
                 */
                editor.setRangeText(
                    tag.markdownEnd,
                    closePosition,
                    closePosition,
                    "preserve"
                );

                editor.setRangeText(
                    tag.markdownStart,
                    openPosition,
                    openPosition,
                    "preserve"
                );

                const contentStart = openPosition + tag.markdownStart.length;
                const contentEnd = closePosition + tag.markdownStart.length;

                if (selectionStart === selectionEnd) {
                    const relative = Math.max(
                        0,
                        Math.min(selectionStart - openPosition, closePosition - openPosition)
                    );
                    const cursor = contentStart + relative;
                    editor.setSelectionRange(cursor, cursor);
                } else {
                    editor.setSelectionRange(contentStart, contentEnd);
                }

                editor.focus();
            }

            /* TEXTO CITADO MARKDOWN */

            toggleQuoteToMarkdown(tag, editor) {
                const value = editor.value;
                const selectionStart = editor.selectionStart;
                const selectionEnd = editor.selectionEnd;
                const blockStart = this.getLineStart(value, selectionStart);
                let effectiveEnd = selectionEnd;

                if (effectiveEnd > blockStart && value[effectiveEnd - 1] === "\n") {
                    effectiveEnd--;
                }

                const blockEnd = this.getLineEnd(value, effectiveEnd);
                const removals = [];
                let checkLineStart = blockStart;

                while (checkLineStart <= blockEnd) {
                    const checkLineEnd = this.getLineEnd(value, checkLineStart);
                    const line = value.substring(checkLineStart, checkLineEnd);
                    let position = 0;
                    const quoteTokens = [];

                    while (position < line.length) {
                        if (line.startsWith("==", position)) {
                            position += 2;
                            continue;
                        }

                        const quote = line.substring(position).match(/^>\s?/);
                        if (quote) {
                            quoteTokens.push({
                                start: checkLineStart + position,
                                end: checkLineStart + position + quote[0].length
                            });
                            position += quote[0].length;
                            continue;
                        }

                        break;
                    }

                    if (quoteTokens.length > 0) {
                        removals.push(quoteTokens[quoteTokens.length - 1]);
                    }

                    if (checkLineEnd >= blockEnd) break;
                    checkLineStart = checkLineEnd + 1;
                }

                const quoteActiveAtStart = (() => {
                    const currentLineStart = this.getLineStart(value, selectionStart);
                    const currentLineEnd = this.getLineEnd(value, selectionStart);
                    const line = value.substring(currentLineStart, currentLineEnd);
                    let position = 0;

                    while (position < line.length) {
                        if (line.startsWith("==", position)) {
                            position += 2;
                            continue;
                        }

                        const quote = line.substring(position).match(/^>\s?/);
                        if (quote) return true;
                        break;
                    }

                    return false;
                })();

                if (quoteActiveAtStart && removals.length > 0) {
                    let newValue = value;

                    for (let index = removals.length - 1; index >= 0; index--) {
                        const removal = removals[index];
                        newValue =
                            newValue.substring(0, removal.start)
                            + newValue.substring(removal.end);
                    }

                    const adjustPosition = position => {
                        let adjusted = position;

                        for (const removal of removals) {
                            if (position <= removal.start) continue;
                            const removedLength = removal.end - removal.start;
                            adjusted -= Math.min(
                                removedLength,
                                position - removal.start
                            );
                        }

                        return adjusted;
                    };

                    editor.value = newValue;
                    const newStart = adjustPosition(selectionStart);
                    const newEnd = adjustPosition(selectionEnd);
                    editor.setSelectionRange(newStart, Math.max(newStart, newEnd));
                    editor.focus();
                    return;
                }

                const lines = [];
                let lineStart = blockStart;

                while (lineStart <= blockEnd) {
                    const lineEnd = this.getLineEnd(value, lineStart);
                    const bounds = this.getDeepContainerLineBounds(
                        value,
                        lineStart,
                        lineEnd
                    );

                    lines.push({
                        start: bounds.contentStart,
                        end: bounds.contentEnd
                    });

                    if (lineEnd >= blockEnd) break;
                    lineStart = lineEnd + 1;
                }

                /* Insertamos de abajo arriba para no invalidar posiciones. */
                for (let index = lines.length - 1; index >= 0; index--) {
                    editor.setRangeText(
                        tag.markdownPrefix,
                        lines[index].start,
                        lines[index].start,
                        "preserve"
                    );
                }

                const addedBeforeStart = lines
                    .filter(line => line.start <= selectionStart)
                    .length * tag.markdownPrefix.length;

                const addedBeforeEnd = lines
                    .filter(line => line.start <= selectionEnd)
                    .length * tag.markdownPrefix.length;

                editor.setSelectionRange(
                    selectionStart + addedBeforeStart,
                    selectionEnd + addedBeforeEnd
                );
                editor.focus();
            }

            handleEnterOnQuoteMarkdown(editor) {
                const value = editor.value;
                const selectionStart = editor.selectionStart;
                const selectionEnd = editor.selectionEnd;

                if (selectionStart !== selectionEnd) return false;

                if (
                    this.getInnermostMarkdownTextContainerType(
                        value,
                        selectionStart
                    ) !== "quote"
                ) {
                    return false;
                }

                const lineStart = this.getLineStart(value, selectionStart);
                const lineEnd = this.getLineEnd(value, selectionStart);
                const opening = this.getMarkdownLineOpeningTokens(
                    value,
                    lineStart,
                    lineEnd
                );
                const quoteTokens = opening.tokens.filter(
                    token => token.type === "quote"
                );

                if (quoteTokens.length === 0) return false;

                const currentBounds = this.getDeepContainerLineBounds(
                    value,
                    lineStart,
                    lineEnd
                );
                const currentEmpty = value.substring(
                    currentBounds.contentStart,
                    currentBounds.contentEnd
                ).trim().length === 0;

                if (currentEmpty && lineStart > 0) {
                    const previousLineEnd = lineStart - 1;
                    const previousLineStart = this.getLineStart(
                        value,
                        Math.max(0, previousLineEnd)
                    );
                    const previousOpening = this.getMarkdownLineOpeningTokens(
                        value,
                        previousLineStart,
                        previousLineEnd
                    );
                    const previousQuoteTokens = previousOpening.tokens.filter(
                        token => token.type === "quote"
                    );
                    const previousBounds = this.getDeepContainerLineBounds(
                        value,
                        previousLineStart,
                        previousLineEnd
                    );
                    const previousEmpty = value.substring(
                        previousBounds.contentStart,
                        previousBounds.contentEnd
                    ).trim().length === 0;

                    if (
                        previousEmpty
                        && previousQuoteTokens.length === quoteTokens.length
                    ) {
                        const outerQuotePrefix = quoteTokens
                            .slice(0, -1)
                            .map(token => token.text)
                            .join("");

                        editor.setRangeText(
                            outerQuotePrefix,
                            previousLineStart,
                            currentBounds.contentEnd,
                            "end"
                        );
                        editor.focus();
                        return true;
                    }
                }

                const repeatedQuotePrefix = quoteTokens
                    .map(token => token.text)
                    .join("");

                /*
                 * Una o dos líneas vacías siguen perteneciendo al citado.
                 * Solo la siguiente pulsación de Enter, con dos vacías
                 * consecutivas, sale de la capa de citado más interna.
                 */
                editor.setRangeText(
                    "\n" + repeatedQuotePrefix,
                    selectionStart,
                    selectionEnd,
                    "end"
                );
                editor.focus();
                return true;
            }

            handleEnterOnHighlightMarkdown(editor) {
                const value = editor.value;
                const selectionStart = editor.selectionStart;
                const selectionEnd = editor.selectionEnd;

                if (selectionStart !== selectionEnd) return false;

                if (
                    this.getInnermostMarkdownTextContainerType(
                        value,
                        selectionStart
                    ) !== "highlight"
                ) {
                    return false;
                }

                const highlight = this.findHighlightRange(
                    value,
                    selectionStart,
                    selectionEnd
                );

                if (!highlight) return false;

                const lineStart = this.getLineStart(value, selectionStart);
                const lineEnd = this.getLineEnd(value, selectionStart);
                const opening = this.getMarkdownLineOpeningTokens(
                    value,
                    lineStart,
                    lineEnd
                );
                const highlightQuoteDepth =
                    this.getQuoteDepthBeforePosition(
                        value,
                        highlight.openStart
                    );
                const quoteTokens = opening.tokens.filter(
                    token => token.type === "quote"
                );
                const outerQuotePrefix = quoteTokens
                    .slice(0, highlightQuoteDepth)
                    .map(token => token.text)
                    .join("");
                const currentBounds = this.getDeepContainerLineBounds(
                    value,
                    lineStart,
                    lineEnd
                );
                const currentEmpty = value.substring(
                    currentBounds.contentStart,
                    currentBounds.contentEnd
                ).trim().length === 0;

                if (currentEmpty && lineStart > 0) {
                    const previousLineEnd = lineStart - 1;
                    const previousLineStart = this.getLineStart(
                        value,
                        Math.max(0, previousLineEnd)
                    );
                    const previousBounds = this.getDeepContainerLineBounds(
                        value,
                        previousLineStart,
                        previousLineEnd
                    );
                    const previousEmpty = value.substring(
                        previousBounds.contentStart,
                        previousBounds.contentEnd
                    ).trim().length === 0;

                    if (previousEmpty) {
                        const lastContentLineEnd = Math.max(
                            highlight.contentStart,
                            previousLineStart - 1
                        );

                        editor.setRangeText(
                            "==\n" + outerQuotePrefix,
                            lastContentLineEnd,
                            highlight.closeEnd,
                            "end"
                        );
                        editor.focus();
                        return true;
                    }
                }

                /*
                 * Una o dos líneas vacías siguen perteneciendo al destacado.
                 * Solo la siguiente pulsación de Enter, con dos vacías
                 * consecutivas, cierra la capa de destacado más interna.
                 */
                editor.setRangeText(
                    "\n" + outerQuotePrefix,
                    selectionStart,
                    selectionEnd,
                    "end"
                );
                editor.focus();
                return true;
            }

            /* TÍTULOS MARKDOWN */

            toggleHeadingToMarkdown(tag, editor) {
                const value = editor.value;
                const selectionStart = editor.selectionStart;
                const selectionEnd = editor.selectionEnd;
                const blockStart = this.getLineStart(value, selectionStart);
                let effectiveEnd = selectionEnd;

                if (effectiveEnd > blockStart && value[effectiveEnd - 1] === "\n") {
                    effectiveEnd--;
                }

                const blockEnd = this.getLineEnd(value, effectiveEnd);
                const lines = value.substring(blockStart, blockEnd).split("\n");
                const newPrefix = "#".repeat(tag.level) + " ";

                const result = lines.map(line => {
                    let highlightPrefix = "";
                    let highlightSuffix = "";
                    let quotePrefix = "";
                    let content = line;

                    if (content.startsWith("==")) {
                        highlightPrefix = "==";
                        content = content.substring(2);
                    }

                    if (content.endsWith("==")) {
                        highlightSuffix = "==";
                        content = content.substring(0, content.length - 2);
                    }

                    const quote = content.match(/^>\s?/);

                    if (quote) {
                        quotePrefix = quote[0];
                        content = content.substring(quote[0].length);
                    }

                    if (content === "~~~") {
                        return highlightPrefix + quotePrefix + content + highlightSuffix;
                    }

                    if (content.length === 0) {
                        if (lines.length === 1) content = newPrefix;
                        return highlightPrefix + quotePrefix + content + highlightSuffix;
                    }

                    const heading = content.match(/^(#{1,6})\s+(.*)$/);

                    if (heading) {
                        const currentLevel = heading[1].length;
                        content = currentLevel === tag.level
                            ? heading[2]
                            : newPrefix + heading[2];

                        return highlightPrefix + quotePrefix + content + highlightSuffix;
                    }

                    const emptyHeading = content.match(/^(#{1,6})\s*$/);

                    if (emptyHeading) {
                        const currentLevel = emptyHeading[1].length;
                        content = currentLevel === tag.level ? "" : newPrefix;
                        return highlightPrefix + quotePrefix + content + highlightSuffix;
                    }

                    content = newPrefix + content;
                    return highlightPrefix + quotePrefix + content + highlightSuffix;
                });

                editor.setRangeText(
                    result.join("\n"),
                    blockStart,
                    blockEnd,
                    "select"
                );

                editor.focus();
            }

            /* INLINE MARKDOWN */

            toggleInlineToMarkdown(tag, editor) {
                if (tag.name === "strikethrough") {
                    const strikethroughRange =
                        this.findStrikethroughRange(
                            editor.value,
                            editor.selectionStart,
                            editor.selectionEnd
                        );

                    if (strikethroughRange) {
                        this.removeStrikethroughFromMarkdown(
                            editor,
                            strikethroughRange
                        );
                        return;
                    }
                }

                if (
                    editor.selectionStart === editor.selectionEnd
                ) {
                    const markerRange =
                        this.findInlineRangeFromMarkerPosition(
                            tag,
                            editor.value,
                            editor.selectionStart
                        );

                    if (markerRange) {
                        this.removeInlineFromMarkdown(
                            tag,
                            editor,
                            markerRange
                        );
                        return;
                    }
                }

                if (
                    this.toggleInlineFromTextLinkFormatMarker(
                        tag,
                        editor
                    )
                ) {
                    return;
                }

                if (
                    this.toggleInlineOnTextLinkToMarkdown(
                        tag,
                        editor
                    )
                ) {
                    return;
                }

                const value = editor.value;
                let selectionStart = editor.selectionStart;
                let selectionEnd = editor.selectionEnd;

                const existing = this.findInlineRange(
                    tag,
                    value,
                    selectionStart,
                    selectionEnd
                );

                if (existing) {
                    this.removeInlineFromMarkdown(tag, editor, existing);
                    return;
                }

                if (selectionStart === selectionEnd) {
                    const lineStart = this.getLineStart(value, selectionStart);
                    const lineEnd = this.getLineEnd(value, selectionStart);
                    const bounds = this.getLineContentBounds(value, lineStart, lineEnd);
                    const position = Math.max(
                        bounds.contentStart,
                        Math.min(selectionStart, bounds.contentEnd)
                    );

                    editor.setRangeText(
                        tag.markdownStart + tag.markdownEnd,
                        position,
                        position,
                        "end"
                    );

                    const newPosition = position + tag.markdownStart.length;
                    editor.setSelectionRange(newPosition, newPosition);
                    editor.focus();
                    return;
                }

                const selectedText = value.substring(selectionStart, selectionEnd);

                if (!selectedText.includes("\n")) {
                    const lineStart = this.getLineStart(value, selectionStart);
                    const lineEnd = this.getLineEnd(value, selectionEnd);
                    const bounds = this.getLineContentBounds(value, lineStart, lineEnd);

                    selectionStart = Math.max(selectionStart, bounds.contentStart);
                    selectionEnd = Math.min(selectionEnd, bounds.contentEnd);

                    if (selectionStart >= selectionEnd) {
                        editor.focus();
                        return;
                    }

                    const content = value.substring(selectionStart, selectionEnd);

                    editor.setRangeText(
                        tag.markdownStart + content + tag.markdownEnd,
                        selectionStart,
                        selectionEnd,
                        "select"
                    );

                    editor.focus();
                    return;
                }

                const blockStart = this.getLineStart(value, selectionStart);
                let effectiveEnd = selectionEnd;

                if (effectiveEnd > blockStart && value[effectiveEnd - 1] === "\n") {
                    effectiveEnd--;
                }

                const blockEnd = this.getLineEnd(value, effectiveEnd);
                const lines = value.substring(blockStart, blockEnd).split("\n");

                const result = lines.map(line => {
                    let highlightPrefix = "";
                    let highlightSuffix = "";
                    let quotePrefix = "";
                    let content = line;

                    if (content.startsWith("==")) {
                        highlightPrefix = "==";
                        content = content.substring(2);
                    }

                    if (content.endsWith("==")) {
                        highlightSuffix = "==";
                        content = content.substring(0, content.length - 2);
                    }

                    const quote = content.match(/^>\s?/);

                    if (quote) {
                        quotePrefix = quote[0];
                        content = content.substring(quote[0].length);
                    }

                    let headingPrefix = "";
                    const heading = content.match(/^(#{1,6})\s+/);

                    if (heading) {
                        headingPrefix = heading[0];
                        content = content.substring(heading[0].length);
                    }

                    if (content.length === 0 || content === "~~~") {
                        return (
                            highlightPrefix +
                            quotePrefix +
                            headingPrefix +
                            content +
                            highlightSuffix
                        );
                    }

                    const existingInline = this.findInlineRange(
                        tag,
                        content,
                        0,
                        content.length
                    );

                    if (existingInline) {
                        content = content.substring(
                            existingInline.contentStart,
                            existingInline.closeStart
                        );
                    } else {
                        content = tag.markdownStart + content + tag.markdownEnd;
                    }

                    return (
                        highlightPrefix +
                        quotePrefix +
                        headingPrefix +
                        content +
                        highlightSuffix
                    );
                });

                editor.setRangeText(
                    result.join("\n"),
                    blockStart,
                    blockEnd,
                    "select"
                );

                editor.focus();
            }

            /* SEPARADOR MARKDOWN */

            toggleSeparatorToMarkdown(tag, editor) {
                this.normalizeSeparatorsInEditor(editor);

                const value = editor.value;
                const position = editor.selectionEnd;
                const lineStart = this.getLineStart(value, position);
                const lineEnd = this.getLineEnd(value, position);
                const bounds = this.getLineContentBounds(value, lineStart, lineEnd);
                const content = value.substring(bounds.contentStart, bounds.contentEnd);

                if (content === tag.markdownLine) {
                    editor.setRangeText(
                        "",
                        bounds.contentStart,
                        bounds.contentEnd,
                        "end"
                    );

                    editor.setSelectionRange(
                        bounds.contentStart,
                        bounds.contentStart
                    );

                    editor.focus();
                    return;
                }

                const cursor = Math.max(
                    bounds.contentStart,
                    Math.min(position, bounds.contentEnd)
                );

                const before = value.substring(bounds.contentStart, cursor);
                const after = value.substring(cursor, bounds.contentEnd);
                let replacement = "";

                if (before.length > 0) replacement += before + "\n";
                replacement += tag.markdownLine;
                replacement += after.length > 0 ? "\n" + after : "\n";

                editor.setRangeText(
                    replacement,
                    bounds.contentStart,
                    bounds.contentEnd,
                    "end"
                );

                const newPosition =
                    bounds.contentStart +
                    (before.length > 0 ? before.length + 1 : 0) +
                    tag.markdownLine.length +
                    1;

                const finalPosition = Math.min(newPosition, editor.value.length);
                editor.setSelectionRange(finalPosition, finalPosition);
                editor.focus();
            }

            /* DOM */

            createEmptyEditableBlock() {
                const block = document.createElement("div");
                const textNode = document.createTextNode("\u200B");
                block.append(textNode);
                return { block, textNode };
            }

            createEmptyHighlightBlock() {
                const block = document.createElement("div");
                block.classList.add("highlight-block");
                const empty = this.createEmptyEditableBlock();
                block.append(empty.block);
                return { block, textNode: empty.textNode };
            }

            createEmptyQuoteBlock() {
                const block = document.createElement("div");
                block.classList.add("quote-block");
                const empty = this.createEmptyEditableBlock();
                block.append(empty.block);
                return { block, textNode: empty.textNode };
            }

            createSeparatorElement(tag) {
                const separator = document.createElement(tag.htmlCreateTag);
                separator.setAttribute("contenteditable", "false");
                return separator;
            }

            placeCaretInTextNode(textNode, position = 0) {
                const selection = window.getSelection();
                const range = document.createRange();
                const finalPosition = Math.min(position, textNode.textContent.length);
                range.setStart(textNode, finalPosition);
                range.collapse(true);
                selection.removeAllRanges();
                selection.addRange(range);
            }

            placeCaretAtStart(element) {
                if (element.nodeType === Node.TEXT_NODE) {
                    this.placeCaretInTextNode(
                        element,
                        element.textContent.startsWith("\u200B") ? 1 : 0
                    );
                    return;
                }

                let current = element;

                while (current.firstChild) {
                    current = current.firstChild;
                }

                if (current.nodeType === Node.TEXT_NODE) {
                    this.placeCaretInTextNode(
                        current,
                        current.textContent.startsWith("\u200B") ? 1 : 0
                    );
                    return;
                }

                const selection = window.getSelection();
                const range = document.createRange();
                range.setStart(element, 0);
                range.collapse(true);
                selection.removeAllRanges();
                selection.addRange(range);
            }

            getDirectChild(node, container) {
                if (node === container) return null;

                let current = node.nodeType === Node.TEXT_NODE
                    ? node.parentNode
                    : node;

                while (current && current.parentNode !== container) {
                    current = current.parentNode;
                }

                return current;
            }

            getTopLevelBlock(node, editor) {
                return this.getDirectChild(node, editor);
            }

            getBlockFromBoundary(container, offset, editor) {
                if (container === editor) {
                    if (editor.childNodes.length === 0) return null;

                    let index = offset;

                    if (index >= editor.childNodes.length) {
                        index = editor.childNodes.length - 1;
                    }

                    return editor.childNodes[index];
                }

                return this.getTopLevelBlock(container, editor);
            }

            getClassAncestor(node, className, editor) {
                let current = node.nodeType === Node.ELEMENT_NODE
                    ? node
                    : node.parentElement;

                while (current && current !== editor) {
                    if (current.classList?.contains(className)) {
                        return current;
                    }

                    current = current.parentElement;
                }

                return null;
            }

            getHighlightAncestor(node, editor) {
                return this.getClassAncestor(node, "highlight-block", editor);
            }

            getQuoteAncestor(node, editor) {
                return this.getClassAncestor(node, "quote-block", editor);
            }

            getTableCellAncestor(node, editor) {
                let current = node?.nodeType === Node.ELEMENT_NODE
