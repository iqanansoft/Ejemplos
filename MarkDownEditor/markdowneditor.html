                    const beforeBlock = block.cloneNode(false);
                    beforeBlock.append(beforeFragment);
                    nodes.push(beforeBlock);
                }

                const separator = this.createSeparatorElement(tag);
                nodes.push(separator);

                let afterBlock;

                if (hasAfter) {
                    const blockTag = block.tagName.toLowerCase();

                    if (/^h[1-6]$/.test(blockTag)) {
                        afterBlock = document.createElement("div");
                        afterBlock.append(afterFragment);
                    } else {
                        afterBlock = block.cloneNode(false);
                        afterBlock.append(afterFragment);
                    }
                } else {
                    afterBlock = this.createEmptyEditableBlock().block;
                }

                nodes.push(afterBlock);
                block.replaceWith(...nodes);
                this.placeCaretAtStart(afterBlock);
                editor.focus();
            }

            /* LISTAS FORMATEADAS */

            getListAncestor(node, editor) {
                let current = node.nodeType === Node.ELEMENT_NODE
                    ? node
                    : node.parentElement;

                while (current && current !== editor) {
                    if (
                        current.tagName === "LI"
                        &&
                        current.parentElement
                        &&
                        (
                            current.parentElement.tagName === "UL"
                            ||
                            current.parentElement.tagName === "OL"
                        )
                    ) {
                        return current.parentElement;
                    }

                    current = current.parentElement;
                }

                return null;
            }

            getListItemAncestor(node, editor) {
                let current = node.nodeType === Node.ELEMENT_NODE
                    ? node
                    : node.parentElement;

                while (current && current !== editor) {
                    if (current.tagName === "LI") {
                        return current;
                    }

                    current = current.parentElement;
                }

                return null;
            }

            getListItemOwnText(listItem) {
                if (!listItem) {
                    return "";
                }

                return [...listItem.childNodes]
                    .filter(node => !(
                        node.nodeType === Node.ELEMENT_NODE
                        &&
                        (
                            node.tagName === "UL"
                            ||
                            node.tagName === "OL"
                        )
                    ))
                    .map(node => node.textContent ?? "")
                    .join("")
                    .replaceAll("\u200B", "");
            }

            getFormattedListType(list) {
                if (!list || list.nodeType !== Node.ELEMENT_NODE) {
                    return null;
                }

                if (list.tagName === "OL") {
                    return "ordered";
                }

                if (list.tagName === "UL") {
                    return list.classList.contains("link-list")
                        ? "links"
                        : "unordered";
                }

                return null;
            }

            formattedListMatchesType(list, listType) {
                return this.getFormattedListType(list) === listType;
            }

            createFormattedListElement(listType) {
                const list = document.createElement(
                    listType === "ordered" ? "ol" : "ul"
                );

                if (listType === "links") {
                    list.classList.add("link-list");
                }

                if (listType === "ordered") {
                    list.removeAttribute("start");
                }

                return list;
            }

            createNestedFormattedList(tag, listItem) {
                let nestedList = [...listItem.children].find(child =>
                    this.formattedListMatchesType(
                        child,
                        tag.listType
                    )
                );

                if (!nestedList) {
                    nestedList = this.createFormattedListElement(
                        tag.listType
                    );

                    listItem.append(nestedList);
                }

                const nestedItem = document.createElement("li");

                if (tag.listType === "links") {
                    const link = document.createElement("a");
                    link.setAttribute("href", this.normalizeWebUrl(tag.defaultUrl));
                    link.setAttribute("target", "_blank");
                    link.setAttribute("rel", "noopener noreferrer");
                    const textNode = document.createTextNode(tag.defaultText);
                    link.append(textNode);
                    nestedItem.append(link);
                    nestedList.append(nestedItem);
                    this.placeCaretInTextNode(textNode, 0);
                } else {
                    const textNode = document.createTextNode("\u200B");
                    nestedItem.append(textNode);
                    nestedList.append(nestedItem);
                    this.placeCaretInTextNode(textNode, 1);
                }

                return nestedList;
            }

            isListActiveInFormatted(tag, editor) {
                const selection = window.getSelection();

                if (!selection || selection.rangeCount === 0) {
                    return false;
                }

                const range = selection.getRangeAt(0);
                const list = this.getListAncestor(
                    range.startContainer,
                    editor
                );

                if (!list) {
                    return false;
                }

                if (tag.listType === "links") {
                    return (
                        list.tagName === "UL"
                        &&
                        list.classList.contains("link-list")
                    );
                }

                if (tag.listType === "unordered") {
                    return (
                        list.tagName === "UL"
                        &&
                        !list.classList.contains("link-list")
                    );
                }

                return list.tagName === "OL";
            }

            normalizeNestedOrderedListsInFormatted(editor) {
                for (const list of editor.querySelectorAll("ol")) {
                    if (list.parentElement?.tagName === "LI") {
                        list.removeAttribute("start");
                    }
                }
            }

            removeFormattedList(list, editor) {
                if (!list?.isConnected) {
                    return;
                }

                const parent = list.parentElement;

                if (parent?.tagName === "LI") {
                    list.remove();

                    const remainingText = (parent.textContent ?? "")
                        .replaceAll("\u200B", "")
                        .trim();

                    if (remainingText.length === 0) {
                        const caretText = document.createTextNode("\u200B");
                        parent.append(caretText);
                        this.placeCaretInTextNode(caretText, 1);
                    } else {
                        this.placeCaretAtEnd(parent);
                    }

                    editor.focus();
                    return;
                }

                const empty = this.createEmptyEditableBlock();
                list.replaceWith(empty.block);
                this.placeCaretInTextNode(empty.textNode, 1);
                editor.focus();
            }

            toggleListToFormatted(tag, editor) {
                const selection = window.getSelection();

                if (selection && selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    const currentList = this.getListAncestor(
                        range.startContainer,
                        editor
                    );

                    const sameType = currentList
                        &&
                        this.formattedListMatchesType(
                            currentList,
                            tag.listType
                        );

                    if (sameType) {
                        this.removeFormattedList(
                            currentList,
                            editor
                        );
                        return;
                    }

                    if (currentList && range.collapsed) {
                        const listItem = this.getListItemAncestor(
                            range.startContainer,
                            editor
                        );

                        if (listItem) {
                            const ownText = this.getListItemOwnText(
                                listItem
                            );

                            if (ownText.trim().length === 0) {
                                const previousItem =
                                    listItem.previousElementSibling;

                                if (
                                    previousItem
                                    &&
                                    previousItem.tagName === "LI"
                                ) {
                                    let nestedList =
                                        [...previousItem.children].find(child =>
                                            this.formattedListMatchesType(
                                                child,
                                                tag.listType
                                            )
                                        );

                                    if (!nestedList) {
                                        nestedList = this.createFormattedListElement(
                                            tag.listType
                                        );

                                        previousItem.append(nestedList);
                                    }

                                    if (tag.listType === "links") {
                                        listItem.replaceChildren();

                                        const link = document.createElement("a");
                                        link.setAttribute("href", this.normalizeWebUrl(tag.defaultUrl));
                                        link.setAttribute("target", "_blank");
                                        link.setAttribute("rel", "noopener noreferrer");
                                        const textNode = document.createTextNode(
                                            tag.defaultText
                                        );
                                        link.append(textNode);
                                        listItem.append(link);
                                    }

                                    listItem.remove();
                                    nestedList.append(listItem);

                                    if (
                                        currentList.children.length === 0
                                    ) {
                                        currentList.remove();
                                    }

                                    this.placeCaretAtStart(listItem);
                                    this.normalizeNestedOrderedListsInFormatted(
                                        editor
                                    );
                                    editor.focus();
                                    return;
                                }
                            }

                            this.createNestedFormattedList(
                                tag,
                                listItem
                            );

                            this.normalizeNestedOrderedListsInFormatted(
                                editor
                            );
                            editor.focus();
                            return;
                        }
                    }
                }

                if (tag.listType === "links") {
                    const selection = window.getSelection();

                    if (!selection || selection.rangeCount === 0) {
                        return;
                    }

                    const range = selection.getRangeAt(0);
                    const selectedText = range.toString().replaceAll("\n", " ").trim();
                    const list = document.createElement("ul");
                    list.classList.add("link-list");
                    const item = document.createElement("li");
                    const link = document.createElement("a");
                    link.setAttribute("href", this.normalizeWebUrl(tag.defaultUrl));
                    link.setAttribute("target", "_blank");
                    link.setAttribute("rel", "noopener noreferrer");
                    const textNode = document.createTextNode(
                        selectedText.length > 0
                            ? selectedText
                            : tag.defaultText
                    );

                    link.append(textNode);
                    item.append(link);
                    list.append(item);

                    const topBlock = this.getTopLevelBlock(
                        range.startContainer,
                        editor
                    );

                    if (topBlock && this.isBlockEmpty(topBlock)) {
                        topBlock.replaceWith(list);
                    } else if (topBlock) {
                        topBlock.after(list);
                    } else {
                        editor.append(list);
                    }

                    this.placeCaretInTextNode(textNode, 0);
                    editor.focus();
                    return;
                }

                editor.focus();

                const command =
                    tag.listType === "unordered"
                        ? "insertUnorderedList"
                        : "insertOrderedList";

                document.execCommand(command, false, null);
                this.normalizeNestedOrderedListsInFormatted(editor);
                editor.focus();
            }

            handleEnterOnLinkListFormatted(editor) {
                const selection = window.getSelection();

                if (!selection || selection.rangeCount === 0) {
                    return false;
                }

                const range = selection.getRangeAt(0);

                if (!range.collapsed) {
                    return false;
                }

                const list = this.getListAncestor(
                    range.startContainer,
                    editor
                );

                if (
                    !list
                    ||
                    list.tagName !== "UL"
                    ||
                    !list.classList.contains("link-list")
                ) {
                    return false;
                }

                const currentItem = this.getListItemAncestor(
                    range.startContainer,
                    editor
                );

                if (!currentItem) {
                    return false;
                }

                const currentLink = [...currentItem.children].find(
                    child => child.tagName === "A"
                );

                if (
                    currentLink
                    &&
                    (currentLink.textContent ?? "").trim().length === 0
                    &&
                    (currentLink.getAttribute("href") ?? "").trim().length === 0
                ) {
                    this.removeFormattedList(list, editor);
                    return true;
                }

                const linkTag = this.get("link");
                const newItem = document.createElement("li");
                const newLink = document.createElement("a");
                newLink.setAttribute("href", this.normalizeWebUrl(linkTag.defaultUrl));
                newLink.setAttribute("target", "_blank");
                newLink.setAttribute("rel", "noopener noreferrer");
                const textNode = document.createTextNode(linkTag.defaultText);
                newLink.append(textNode);
                newItem.append(newLink);
                currentItem.after(newItem);
                this.placeCaretInTextNode(textNode, 0);
                editor.focus();
                return true;
            }

            handleTabOnListFormatted(editor, outdent = false) {
                const selection = window.getSelection();

                if (!selection || selection.rangeCount === 0) {
                    return false;
                }

                const range = selection.getRangeAt(0);
                const list = this.getListAncestor(
                    range.startContainer,
                    editor
                );

                if (!list) {
                    return false;
                }

                if (outdent) {
                    const currentItem = this.getListItemAncestor(
                        range.startContainer,
                        editor
                    );

                    const parentItem = list.parentElement;
                    const parentList = parentItem?.tagName === "LI"
                        ? parentItem.parentElement
                        : null;

                    if (
                        currentItem
                        &&
                        parentList
                        &&
                        (parentList.tagName === "UL" || parentList.tagName === "OL")
                        &&
                        this.getFormattedListType(parentList) !==
                            this.getFormattedListType(list)
                    ) {
                        const host = parentList.parentElement;
                        let targetList = parentList.nextElementSibling;

                        if (
                            !this.formattedListMatchesType(
                                targetList,
                                this.getFormattedListType(list)
                            )
                        ) {
                            targetList = this.createFormattedListElement(
                                this.getFormattedListType(list)
                            );

                            parentList.after(targetList);
                        }

                        currentItem.remove();
                        targetList.append(currentItem);

                        if (list.children.length === 0) {
                            list.remove();
                        }

                        this.placeCaretAtStart(currentItem);
                        this.normalizeNestedOrderedListsInFormatted(editor);
                        editor.focus();
                        return true;
                    }
                }

                if (
                    list.tagName === "UL"
                    &&
                    list.classList.contains("link-list")
                ) {
                    const currentItem = this.getListItemAncestor(
                        range.startContainer,
                        editor
                    );

                    if (!currentItem) {
                        return false;
                    }

                    if (outdent) {
                        const parentItem = list.parentElement;

                        if (
                            !parentItem
                            ||
                            parentItem.tagName !== "LI"
                        ) {
                            editor.focus();
                            return true;
                        }

                        const parentList = parentItem.parentElement;

                        if (
                            !parentList
                            ||
                            !this.formattedListMatchesType(
                                parentList,
                                "links"
                            )
                        ) {
                            editor.focus();
                            return true;
                        }

                        parentItem.after(currentItem);

                        if (list.children.length === 0) {
                            list.remove();
                        }

                        this.placeCaretAtStart(currentItem);
                        editor.focus();
                        return true;
                    }

                    const previousItem = currentItem.previousElementSibling;

                    if (
                        !previousItem
                        ||
                        previousItem.tagName !== "LI"
                    ) {
                        editor.focus();
                        return true;
                    }

                    let nestedList = [...previousItem.children].find(child => (
                        child.tagName === "UL"
                        &&
                        child.classList.contains("link-list")
                    ));

                    if (!nestedList) {
                        nestedList = document.createElement("ul");
                        nestedList.classList.add("link-list");
                        previousItem.append(nestedList);
                    }

                    nestedList.append(currentItem);

                    if (list.children.length === 0) {
                        list.remove();
                    }

                    this.placeCaretAtStart(currentItem);
                    editor.focus();
                    return true;
                }

                document.execCommand(
                    outdent ? "outdent" : "indent",
                    false,
                    null
                );

                this.normalizeNestedOrderedListsInFormatted(editor);
                editor.focus();
                return true;
            }

            isActiveInFormatted(tag, editor) {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return false;

                const range = selection.getRangeAt(0);

                if (
                    !editor.contains(range.commonAncestorContainer) &&
                    range.commonAncestorContainer !== editor
                ) {
                    return false;
                }

                if (tag.formatGroup === "highlight") {
                    return this.getHighlightAncestor(range.startContainer, editor) !== null;
                }

                if (tag.formatGroup === "quote") {
                    return this.getQuoteAncestor(range.startContainer, editor) !== null;
                }

                if (tag.formatGroup === "image") {
                    const image = this.getSelectedImage(editor);

                    if (!image) {
                        return false;
                    }

                    return image.parentElement?.tagName !== "A";
                }

                if (tag.formatGroup === "link") {
                    const list = this.getListAncestor(
                        range.startContainer,
                        editor
                    );

                    if (
                        list
                        &&
                        list.tagName === "UL"
                        &&
                        list.classList.contains("link-list")
                    ) {
                        return false;
                    }

                    return this.getSelectedLink(editor) !== null;
                }

                if (tag.formatGroup === "code") {
                    return this.getCodeAncestor(
                        range.startContainer,
                        editor
                    ) !== null;
                }

                if (tag.formatGroup === "table") {
                    return this.getTableAncestor(
                        range.startContainer,
                        editor
                    ) !== null;
                }

                if (tag.formatGroup === "list") {
                    return this.isListActiveInFormatted(tag, editor);
                }

                if (tag.formatGroup === "footnote") {
                    return this.getSelectedFootnoteElement(editor) !== null;
                }

                if (tag.formatGroup === "heading") {
                    return this.getFormatAncestor(tag, range.startContainer, editor) !== null;
                }

                if (tag.formatGroup === "separator") {
                    return this.getSelectedSeparator(editor) !== null;
                }

                if (tag.type === "inline") {
                    const textLink = this.getSelectedTextLink(editor);

                    if (textLink) {
                        return this.getWholeFormattedLinkWrapper(
                            textLink,
                            tag,
                            editor
                        ) !== null;
                    }

                    return this.formattedHasFormat(tag, range, editor);
                }

                return false;
            }

            /* APLICAR FORMATEADO */

            applyToFormatted(tagName, editor) {
                const tag = this.get(tagName);
                if (!tag || !tag.implemented) return;

                if (tag.formatGroup === "heading") {
                    this.toggleHeadingToFormatted(tag, editor);
                    return;
                }

                if (tag.formatGroup === "highlight") {
                    this.toggleHighlightToFormatted(tag, editor);
                    return;
                }

                if (tag.formatGroup === "quote") {
                    this.toggleQuoteToFormatted(tag, editor);
                    return;
                }

                if (tag.formatGroup === "separator") {
                    this.toggleSeparatorToFormatted(tag, editor);
                    return;
                }

                if (tag.formatGroup === "image") {
                    this.toggleImageToFormatted(tag, editor);
                    return;
                }

                if (tag.formatGroup === "link") {
                    const selection = window.getSelection();

                    if (selection && selection.rangeCount > 0) {
                        const list = this.getListAncestor(
                            selection.getRangeAt(0).startContainer,
                            editor
                        );

                        if (list) {
                            editor.focus();
                            return;
                        }
                    }

                    this.toggleLinkToFormatted(tag, editor);
                    return;
                }

                if (tag.formatGroup === "code") {
                    this.toggleCodeToFormatted(tag, editor);
                    return;
                }

                if (tag.formatGroup === "table") {
                    this.toggleTableToFormatted(tag, editor);
                    return;
                }

                if (tag.formatGroup === "list") {
                    this.toggleListToFormatted(tag, editor);
                    return;
                }

                if (tag.formatGroup === "footnote") {
                    this.removeFootnoteFromFormatted(editor);
                    return;
                }

                if (tag.type === "inline") {
                    this.toggleInlineToFormatted(tag, editor);
                }
            }
        }

        /* ===== EDICIÓN CONTEXTUAL DE TABLAS EN LA VISTA FORMATEADA ===== */
        function getFormattedTableCellFromNode(node) {
            let current =
                node?.nodeType === Node.ELEMENT_NODE
                    ? node
                    : node?.parentElement;

            while (current && current !== formattedEditor) {
                if (
                    current.tagName === "TD"
                    ||
                    current.tagName === "TH"
                ) {
                    return current;
                }

                current = current.parentElement;
            }

            return null;
        }

        function getSelectedFormattedTableCell() {
            const selection = window.getSelection();

            if (!selection || selection.rangeCount === 0) {
                return null;
            }

            const range = selection.getRangeAt(0);

            if (
                !formattedEditor.contains(range.startContainer)
                &&
                range.startContainer !== formattedEditor
            ) {
                return null;
            }

            return getFormattedTableCellFromNode(
                range.startContainer
            );
        }

        function placeCaretInTableCell(cell) {
            if (!cell?.isConnected) return;

            if (cell.childNodes.length === 0) {
                cell.append(
                    document.createTextNode("\u200B")
                );
            }

            markdownController.placeCaretAtStart(
                cell
            );

            formattedEditor.focus();
        }

        function getTableColumnIndex(cell) {
            const row = cell?.closest("tr");
            if (!row) return -1;

            return [...row.cells].indexOf(cell);
        }

        function getTableColumnCount(table) {
            const rows = [...table.rows];

            return rows.reduce(
                (maximum, row) =>
                    Math.max(maximum, row.cells.length),
                0
            );
        }

        function createEmptyTableCell(tagName) {
            const cell = document.createElement(tagName);
            cell.append(document.createTextNode("\u200B"));
            return cell;
        }

        function syncFormattedTableToMarkdown() {
            markdownEditor.value =
                markdownController.htmlToMarkdown(
                    formattedEditor
                );

            updateToolbarState();
        }

        function updateTableContextToolbar() {
            if (activeView !== "formatted") {
                tableContextToolbar.classList.add("hidden");
                tableContextCell = null;
                return;
            }

            const selectedCell =
                getSelectedFormattedTableCell();

            if (!selectedCell) {
                tableContextToolbar.classList.add("hidden");
                tableContextCell = null;
                return;
            }

            tableContextCell = selectedCell;

            if (
                !tableContextCell.isConnected
                ||
                !formattedEditor.contains(tableContextCell)
            ) {
                tableContextToolbar.classList.add("hidden");
                tableContextCell = null;
                return;
            }

            const table = tableContextCell.closest("table");
            const columnCount = getTableColumnCount(table);

            tableDeleteColumnButton.disabled =
                columnCount <= 1;

            tableAddRowAboveButton.disabled =
                tableContextCell.tagName === "TH";

            tableContextToolbar.classList.remove("hidden");
        }

        function addFormattedTableRow(where) {
            const cell = tableContextCell;
            if (!cell?.isConnected) return;

            const table = cell.closest("table");
            const row = cell.closest("tr");
            if (!table || !row) return;

            const columnCount = getTableColumnCount(table);
            const newRow = document.createElement("tr");

            for (let index = 0; index < columnCount; index++) {
                newRow.append(
                    createEmptyTableCell("td")
                );
            }

            let targetBody = table.tBodies[0];

            if (!targetBody) {
                targetBody = document.createElement("tbody");
                table.append(targetBody);
            }

            if (cell.tagName === "TH") {
                targetBody.insertBefore(
                    newRow,
                    targetBody.firstChild
                );
            } else if (where === "above") {
                row.parentElement.insertBefore(
                    newRow,
                    row
                );
            } else {
                row.after(newRow);
            }

            tableContextCell =
                newRow.cells[
                    Math.min(
                        getTableColumnIndex(cell),
                        newRow.cells.length - 1
                    )
                ];

            placeCaretInTableCell(tableContextCell);
            syncFormattedTableToMarkdown();
        }

        function addFormattedTableColumn(where) {
            const cell = tableContextCell;
            if (!cell?.isConnected) return;

            const table = cell.closest("table");
            if (!table) return;

            const currentIndex = getTableColumnIndex(cell);
            if (currentIndex < 0) return;

            const insertIndex =
                where === "left"
                    ? currentIndex
                    : currentIndex + 1;

            let newSelectedCell = null;

            for (const row of table.rows) {
                const reference =
                    row.cells[insertIndex] ?? null;

                const tagName =
                    row.parentElement?.tagName === "THEAD"
                        ? "th"
                        : "td";

                const newCell =
                    createEmptyTableCell(tagName);

                row.insertBefore(
                    newCell,
                    reference
                );

                if (row === cell.closest("tr")) {
                    newSelectedCell = newCell;
                }
            }

            tableContextCell = newSelectedCell;
            placeCaretInTableCell(tableContextCell);
            syncFormattedTableToMarkdown();
        }

        function deleteFormattedTableRow() {
            const cell = tableContextCell;
            if (!cell?.isConnected) return;

            const table = cell.closest("table");
            const row = cell.closest("tr");
            if (!table || !row) return;

            const columnIndex = getTableColumnIndex(cell);
            const rowsBefore = [...table.rows];
            const rowIndex = rowsBefore.indexOf(row);
            const isHeaderRow =
                row.parentElement?.tagName === "THEAD";

            if (isHeaderRow) {
                row.parentElement.remove();
                table.dataset.hasHeaders = "false";
            } else {
                row.remove();
            }

            const remainingRows = [...table.rows];

            if (remainingRows.length === 0) {
                const empty =
                    markdownController.createEmptyEditableBlock();

                table.replaceWith(empty.block);
                tableContextCell = null;
                markdownController.placeCaretInTextNode(
                    empty.textNode,
                    1
                );
            } else {
                const nextRow =
                    remainingRows[
                        Math.min(rowIndex, remainingRows.length - 1)
                    ];

                tableContextCell =
                    nextRow.cells[
                        Math.min(
                            columnIndex,
                            nextRow.cells.length - 1
                        )
                    ];

                placeCaretInTableCell(tableContextCell);
            }

            syncFormattedTableToMarkdown();
        }

        function deleteFormattedTableColumn() {
            const cell = tableContextCell;
            if (!cell?.isConnected) return;

            const table = cell.closest("table");
            if (!table) return;

            const columnCount = getTableColumnCount(table);
            if (columnCount <= 1) return;

            const columnIndex = getTableColumnIndex(cell);
            const selectedRow = cell.closest("tr");

            for (const row of table.rows) {
                row.cells[columnIndex]?.remove();
            }

            tableContextCell =
                selectedRow.cells[
                    Math.min(
                        columnIndex,
                        selectedRow.cells.length - 1
                    )
                ];

            placeCaretInTableCell(tableContextCell);
            syncFormattedTableToMarkdown();
        }

        /* ===== DIÁLOGO DE IMAGEN =====
         * Conserva la selección actual para poder insertar o editar la imagen
         * aunque el foco pase temporalmente al cuadro de diálogo.
         */
        function openImageDialog() {
            const imageTag = markdownController.get("image");

            if (activeView === "markdown") {
                const range = markdownController.findImageRange(
                    markdownEditor.value,
                    markdownEditor.selectionStart,
                    markdownEditor.selectionEnd
                );

                if (!range) return;

                imageDialogState = {
                    view: "markdown",
                    openStart: range.openStart,
                    closeEnd: range.closeEnd
                };

                imageUrlInput.value = range.url;
                imageAltInput.value = range.alternativeText;
            } else {
                const image = markdownController.getSelectedImage(
                    formattedEditor
                );

                if (!image) return;

                imageDialogState = {
                    view: "formatted",
                    image
                };

                imageUrlInput.value =
                    image.getAttribute("src") ?? imageTag.defaultUrl;

                imageAltInput.value =
                    image.dataset.markdownAlt
                    ??
                    image.getAttribute("alt")
                    ??
                    imageTag.defaultAlternativeText;
            }

            imageDialogBackdrop.classList.remove("hidden");
            imageUrlInput.focus();
            imageUrlInput.select();
            updateToolbarState();
        }

        function closeImageDialog() {
            imageDialogBackdrop.classList.add("hidden");
            imageDialogState = null;
            updateToolbarState();
        }

        function acceptImageDialog() {
            if (!imageDialogState) return;

            const url = imageUrlInput.value.trim();

            const alternativeText =
                imageAltInput.value;

            if (imageDialogState.view === "markdown") {
                const markdown =
                    `![${alternativeText}](${url})`;

                markdownEditor.setRangeText(
                    markdown,
                    imageDialogState.openStart,
                    imageDialogState.closeEnd,
                    "end"
                );

                const newPosition =
                    imageDialogState.openStart + markdown.length;

                markdownEditor.setSelectionRange(
                    newPosition,
                    newPosition
                );
            } else {
                const image = imageDialogState.image;

                if (image?.isConnected) {
                    image.dataset.markdownAlt = alternativeText;
                    image.setAttribute("alt", "imagen no disponible");
                    image.setAttribute("src", url);
                }

                markdownEditor.value =
                    markdownController.htmlToMarkdown(
                        formattedEditor
                    );
            }

            const view = imageDialogState.view;
            const formattedImage =
                view === "formatted"
                    ? imageDialogState.image
                    : null;

            closeImageDialog();

            if (view === "markdown") {
                markdownEditor.focus();
            } else {
                formattedEditor.focus();

                if (formattedImage?.isConnected) {
                    markdownController.placeCaretAfterImage(
                        formattedImage
                    );
                }
            }
        }

        function cancelImageDialog() {
            if (!imageDialogState) return;

            const view = imageDialogState.view;

            if (view === "markdown") {
                markdownEditor.setRangeText(
                    "",
                    imageDialogState.openStart,
                    imageDialogState.closeEnd,
                    "end"
                );

                markdownEditor.setSelectionRange(
                    imageDialogState.openStart,
                    imageDialogState.openStart
                );
            } else {
                const image = imageDialogState.image;

                if (image?.isConnected) {
                    image.remove();
                }

                markdownEditor.value =
                    markdownController.htmlToMarkdown(
                        formattedEditor
                    );
            }

            closeImageDialog();

            if (view === "markdown") {
                markdownEditor.focus();
            } else {
                formattedEditor.focus();
            }
        }

        /* ===== DIÁLOGO DE ENLACE =====
         * El enlace puede contener texto normal o una imagen como contenido.
         */
        function updateLinkImageField() {
            linkImageUrlField.classList.toggle(
                "hidden",
                !linkImageMode
            );

            linkTextLabel.textContent =
                linkImageMode
                    ? "Texto alternativo de la imagen"
                    : "Texto del enlace";

            linkImageToggle.setAttribute(
                "aria-pressed",
                linkImageMode ? "true" : "false"
            );
        }

        function openLinkDialog(removeOnCancel = false) {
            const linkTag = markdownController.get("link");
            const imageTag = markdownController.get("image");

            let text = linkTag.defaultText;
            let linkUrl = linkTag.defaultUrl;
            let isImageLink = false;
            let imageUrl = imageTag.defaultUrl;

            if (activeView === "markdown") {
                const range = markdownController.findLinkRange(
                    markdownEditor.value,
                    markdownEditor.selectionStart,
                    markdownEditor.selectionEnd
                );

                if (!range) return;

                const imageMatch = range.content.match(
                    /^!\[([^\]\n]*)\]\(([^)\n]*)\)$/
                );

                if (imageMatch) {
                    isImageLink = true;
                    text = imageMatch[1];
                    imageUrl = imageMatch[2];
                } else {
                    text = range.content;
                }

                linkUrl = range.url;

                linkDialogState = {
                    view: "markdown",
                    openStart: range.openStart,
                    closeEnd: range.closeEnd,
                    originalContent: range.content,
                    removeOnCancel
                };
            } else {
                const link = markdownController.getSelectedLink(
                    formattedEditor
                );

                if (!link) return;

                const image =
                    link.children.length === 1 &&
                    link.firstElementChild?.tagName === "IMG"
                        ? link.firstElementChild
                        : null;

                if (image) {
                    isImageLink = true;
                    text =
                        image.dataset.markdownAlt
                        ??
                        image.getAttribute("alt")
                        ??
                        imageTag.defaultAlternativeText;
                    imageUrl = image.getAttribute("src") ?? imageTag.defaultUrl;
                } else {
                    text = link.textContent?.replaceAll("\u200B", "") ?? linkTag.defaultText;
                }

                linkUrl = link.getAttribute("href") ?? linkTag.defaultUrl;

                linkDialogState = {
                    view: "formatted",
                    link,
                    removeOnCancel
                };
            }

            linkTextInput.value = text;
            linkUrlInput.value = linkUrl;
            linkImageMode = isImageLink;
            linkImageUrlInput.value = imageUrl;
            updateLinkImageField();

            linkDialogBackdrop.classList.remove("hidden");
            linkTextInput.focus();
            linkTextInput.select();
            updateToolbarState();
        }

        function closeLinkDialog() {
            linkDialogBackdrop.classList.add("hidden");
            linkDialogState = null;
            updateToolbarState();
        }

        function acceptLinkDialog() {
            if (!linkDialogState) return;

            const linkText = linkTextInput.value;
            const linkUrl = markdownController.normalizeWebUrl(
                linkUrlInput.value
            );
            const isImageLink = linkImageMode;
            const imageUrl = linkImageUrlInput.value.trim();

            if (linkDialogState.view === "markdown") {
                const content = isImageLink
                    ? `![${linkText}](${imageUrl})`
                    : linkText;

                const markdown =
                    `[${content}](${linkUrl})`;

                markdownEditor.setRangeText(
                    markdown,
                    linkDialogState.openStart,
                    linkDialogState.closeEnd,
                    "end"
                );

                const newPosition =
                    linkDialogState.openStart + markdown.length;

                markdownEditor.setSelectionRange(
                    newPosition,
                    newPosition
                );
            } else {
                const link = linkDialogState.link;

                if (link?.isConnected) {
                    link.setAttribute("href", linkUrl);
                    link.setAttribute("target", "_blank");
                    link.setAttribute("rel", "noopener noreferrer");
                    link.replaceChildren();

                    if (isImageLink) {
                        const image = document.createElement("img");
                        image.setAttribute("src", imageUrl);
                        image.setAttribute("alt", "imagen no disponible");
                        image.dataset.markdownAlt = linkText;
                        image.setAttribute("contenteditable", "false");
                        link.append(image);

                        markdownController.placeCaretAfterLink(link);
                    } else {
                        link.append(document.createTextNode(linkText));
                    }
                }

                markdownEditor.value =
                    markdownController.htmlToMarkdown(
                        formattedEditor
                    );
            }

            const view = linkDialogState.view;
            closeLinkDialog();

            if (view === "markdown") {
                markdownEditor.focus();
            } else {
                formattedEditor.focus();
            }
        }

        function cancelLinkDialog() {
            if (!linkDialogState) return;

            const view = linkDialogState.view;

            if (view === "markdown") {
                const replacement =
                    linkDialogState.removeOnCancel
                        ? ""
                        : linkDialogState.originalContent;

                markdownEditor.setRangeText(
                    replacement,
                    linkDialogState.openStart,
                    linkDialogState.closeEnd,
                    "end"
                );

                markdownEditor.setSelectionRange(
                    linkDialogState.openStart,
                    linkDialogState.openStart + replacement.length
                );
            } else {
                const link = linkDialogState.link;

                if (link?.isConnected) {
                    if (linkDialogState.removeOnCancel) {
                        const caretText =
                            document.createTextNode("\u200B");

                        link.replaceWith(caretText);

                        markdownController.placeCaretInTextNode(
                            caretText,
                            1
                        );
                    } else {
                        markdownController.unwrapElement(link);
                    }
                }

                markdownEditor.value =
                    markdownController.htmlToMarkdown(
                        formattedEditor
                    );
            }

            closeLinkDialog();

            if (view === "markdown") {
                markdownEditor.focus();
            } else {
                formattedEditor.focus();
            }
        }

        /* ===== DIÁLOGO DE TABLA ===== */
        function clampTableNumber(value, minimum, maximum, fallback) {
            const number = Number.parseInt(value, 10);

            if (!Number.isFinite(number)) {
                return fallback;
            }

            return Math.max(
                minimum,
                Math.min(maximum, number)
            );
        }

        function openTableDialog() {
            let formattedRange = null;

            if (activeView === "formatted") {
                const selection = window.getSelection();

                if (
                    selection
                    &&
                    selection.rangeCount > 0
                    &&
                    formattedEditor.contains(
                        selection.getRangeAt(0).commonAncestorContainer
                    )
                ) {
                    formattedRange = selection.getRangeAt(0).cloneRange();
                }
            }

            tableDialogState = {
                view: activeView,
                formattedRange
            };

            tableColumnsInput.value = "2";
            tableRowsInput.value = "1";
            tableHeadersCheckbox.checked = true;

            tableDialogBackdrop.classList.remove("hidden");
            tableColumnsInput.focus();
            tableColumnsInput.select();
            updateToolbarState();
        }

        function closeTableDialog() {
            tableDialogBackdrop.classList.add("hidden");
            tableDialogState = null;
            updateToolbarState();
        }

        function acceptTableDialog() {
            if (!tableDialogState) {
                return;
            }

            const columns = clampTableNumber(
                tableColumnsInput.value,
                1,
                20,
                2
            );

            const rows = clampTableNumber(
                tableRowsInput.value,
                1,
                50,
                1
            );

            const hasHeaders =
                tableHeadersCheckbox.checked;

            const view = tableDialogState.view;
            const tag = markdownController.get("table");

            if (view === "markdown") {
                markdownController.toggleTableToMarkdown(
                    tag,
                    markdownEditor,
                    { columns, rows, hasHeaders }
                );
            } else {
                if (tableDialogState.formattedRange) {
                    const selection = window.getSelection();
                    selection.removeAllRanges();
                    selection.addRange(
                        tableDialogState.formattedRange
                    );
                }

                markdownController.toggleTableToFormatted(
                    tag,
                    formattedEditor,
                    { columns, rows, hasHeaders }
                );

                markdownEditor.value =
                    markdownController.htmlToMarkdown(
                        formattedEditor
                    );
            }

            closeTableDialog();

            if (view === "markdown") {
                markdownEditor.focus();
            } else {
                formattedEditor.focus();
            }
        }

        function cancelTableDialog() {
            if (!tableDialogState) {
                return;
            }

            const view = tableDialogState.view;
            closeTableDialog();

            if (view === "markdown") {
                markdownEditor.focus();
            } else {
                formattedEditor.focus();
            }
        }

        /* ===== CREACIÓN DIRECTA DE NOTAS AL PIE ===== */
        function createFootnoteDirectly() {
            const id = markdownController.getNextFootnoteId(
                markdownEditor.value
            );

            const text = "Texto de la nota";
            const referenceMarkdown = `[^${id}]`;
            const definitionMarkdown = `[^${id}]: ${text}`;

            if (activeView === "markdown") {
                const position = markdownEditor.selectionEnd;

                markdownEditor.setRangeText(
                    referenceMarkdown,
                    position,
                    position,
                    "end"
                );

                let value = markdownEditor.value;

                const trailingFootnoteDefinition =
                    /(?:^|\n)\[\^([^\]\n]+)\]:[^\n]*(?:\n*)$/.test(
                        value
                    );

                if (trailingFootnoteDefinition) {
                    value = value.replace(/\n+$/, "");

                    markdownEditor.value =
                        value + "\n" + definitionMarkdown;
                } else {
                    const suffix = value.length === 0
                        ? ""
                        : value.endsWith("\n\n")
                            ? ""
                            : value.endsWith("\n")
                                ? "\n"
                                : "\n\n";

                    markdownEditor.value =
                        value + suffix + definitionMarkdown;
                }

                const caret = position + referenceMarkdown.length;

                markdownEditor.setSelectionRange(
                    caret,
                    caret
                );

                markdownEditor.focus();
            } else {
                const selection = window.getSelection();

                if (!selection || selection.rangeCount === 0) {
                    return;
                }

                const range = selection.getRangeAt(0).cloneRange();
                const reference = document.createElement("sup");

                reference.classList.add("footnote-reference");
                reference.dataset.footnoteId = id;
                reference.textContent = `[${id}]`;

                range.collapse(false);
                range.insertNode(reference);

                const caretText =
                    document.createTextNode("\u200B");

                reference.after(caretText);

                markdownController.placeCaretInTextNode(
                    caretText,
                    1
                );

                const definition = document.createElement("div");
                definition.classList.add("footnote-definition");
                definition.dataset.footnoteId = id;

                const number = document.createElement("span");
                number.classList.add("footnote-number");
                number.textContent = `[${id}]`;

                const noteText = document.createElement("span");
                noteText.classList.add("footnote-text");
                noteText.textContent = text;

                definition.append(number, noteText);

                let footnotesSection = formattedEditor.querySelector(
                    ":scope > .footnotes-section"
                );

                if (!footnotesSection) {
                    footnotesSection = document.createElement("div");
                    footnotesSection.classList.add("footnotes-section");

                    const separator = document.createElement("hr");
                    separator.classList.add("footnotes-separator");
                    separator.setAttribute("contenteditable", "false");

                    footnotesSection.append(separator);
                    formattedEditor.append(footnotesSection);
                }

                footnotesSection.append(definition);

                markdownController.placeCaretInTextNode(
                    afterCaretText,
                    1
                );

                markdownEditor.value =
                    markdownController.htmlToMarkdown(
                        formattedEditor
                    );

                formattedEditor.focus();
            }

            updateToolbarState();
        }
