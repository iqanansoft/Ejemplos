<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkDown Editor</title>

    <!--
        Editor Markdown autocontenido.
        El archivo agrupa la interfaz, los estilos y toda la lógica de edición,
        conversión, importación y exportación para poder ejecutarse localmente
        sin depender de un servidor.
    -->

    <style>
        /* ===== ESTILOS GENERALES Y DISTRIBUCIÓN PRINCIPAL ===== */
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        body { font-family: system-ui, sans-serif; background: #f5f5f5; }

        .editor {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 10px;
        }

        /* Selector de vista: Markdown o texto formateado. */
        .view-options { display: flex; gap: 20px; }

        .view-option {
            padding: 6px 0;
            border: 0;
            border-bottom: 2px solid transparent;
            background: transparent;
            font: inherit;
            cursor: pointer;
        }

        .view-option.active {
            font-weight: bold;
            border-bottom-color: currentColor;
        }

        /* Barra principal de herramientas de formato. */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            padding: 5px;
            background: white;
            border: 1px solid #cccccc;
            border-radius: 6px;
        }

        .toolbar-button {
            min-width: 36px;
            height: 34px;
            padding: 0 9px;
            border: 1px solid transparent;
            border-radius: 4px;
            background: transparent;
            font-size: 14px;
            cursor: pointer;
        }

        .toolbar-button:hover:not(:disabled) {
            background: #eeeeee;
            border-color: #cccccc;
        }

        .toolbar-button.active {
            background: #dddddd;
            border-color: #888888;
            font-weight: bold;
        }

        .toolbar-button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        .toolbar-separator {
            width: 1px;
            height: 26px;
            margin: 0 6px;
            background: #cccccc;
        }

        /* Zona de edición compartida por las dos vistas. */
        .editor-content {
            flex: 1;
            width: 100%;
            min-height: 0;
            background: white;
            border: 1px solid #cccccc;
            border-radius: 6px;
            overflow: hidden;
        }

        #markdownEditor,
        #formattedEditor {
            width: 100%;
            height: 100%;
            padding: 20px;
            border: 0;
            outline: none;
            background: transparent;
            font-size: 16px;
            line-height: 1.6;
        }

        #markdownEditor {
            resize: none;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        }

        #formattedEditor { overflow: auto; }

        /* Apariencia del contenido generado en la vista formateada. */
        #formattedEditor h1,
        #formattedEditor h2,
        #formattedEditor h3,
        #formattedEditor h4,
        #formattedEditor h5,
        #formattedEditor h6 {
            margin-top: 0;
            margin-bottom: 0.5em;
        }

        #formattedEditor hr {
            margin-top: 1em;
            margin-bottom: 1em;
            user-select: none;
        }

        #formattedEditor img {
            max-width: 100%;
            height: auto;
            display: inline-block;
            vertical-align: middle;
        }

        #formattedEditor ul,
        #formattedEditor ol {
            margin: 0.5em 0;
            padding-left: 2em;
        }

        #formattedEditor li > ul,
        #formattedEditor li > ol {
            margin-top: 0.2em;
            margin-bottom: 0.2em;
        }

        #formattedEditor .highlight-block {
            margin: 0.8em 0;
            padding: 10px 14px;
            background: #f5f5f5;
            border: 1px solid #dddddd;
            border-left: 4px solid #888888;
            border-radius: 4px;
            min-height: 1.6em;
        }

        #formattedEditor .highlight-block > :first-child { margin-top: 0; }
        #formattedEditor .highlight-block > :last-child { margin-bottom: 0; }

        #formattedEditor .quote-block {
            position: relative;
            margin: 0.8em 0;
            padding: 46px 14px 12px 14px;
            background: transparent;
            border: 1px solid #000000;
            border-radius: 4px;
            min-height: 3em;
        }

        #formattedEditor .quote-block::before {
            content: '"';
            position: absolute;
            top: 5px;
            left: 12px;
            font-size: 36px;
            font-weight: 900;
            line-height: 1;
        }

        #formattedEditor .quote-block > :first-child { margin-top: 0; }
        #formattedEditor .quote-block > :last-child { margin-bottom: 0; }

        #formattedEditor table {
            border-collapse: collapse;
            margin: 0.8em 0;
            width: 100%;
        }

        #formattedEditor th,
        #formattedEditor td {
            border: 1px solid #bcbcbc;
            padding: 8px 10px;
            text-align: left;
            vertical-align: top;
        }

        #formattedEditor th {
            font-weight: 700;
            background: #f3f3f3;
        }

        #formattedEditor .code-block {
            position: relative;
            margin: 0.8em 0;
            padding: 46px 14px 12px 14px;
            background: transparent;
            border: 1px solid #000000;
            border-radius: 4px;
            min-height: 3em;
            overflow-x: auto;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            white-space: pre-wrap;
            tab-size: 4;
        }

        #formattedEditor .code-block::before {
            content: "</code>";
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 20px;
            font-weight: 900;
            line-height: 1;
        }

        #formattedEditor .code-block > div {
            min-height: 1.6em;
            font: inherit;
            white-space: inherit;
            outline: none;
        }

        #formattedEditor .footnote-reference {
            vertical-align: super;
            font-size: 0.75em;
            font-weight: 700;
            line-height: 1;
        }

        #formattedEditor .footnotes-section {
            margin-top: 1.2em;
        }

        #formattedEditor .footnotes-separator {
            margin: 0 0 0.8em;
            border: 0;
            border-top: 1px solid #999999;
        }

        #formattedEditor .footnote-definition {
            margin: 0.25em 0;
            padding: 0;
            border: 0;
            font: inherit;
            line-height: inherit;
        }

        #formattedEditor .footnote-definition .footnote-number {
            font-weight: 400;
            margin-right: 6px;
        }

        /* Barra contextual que aparece al editar una tabla formateada. */
        .table-context-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            padding: 5px;
            background: white;
            border: 1px solid #cccccc;
            border-radius: 6px;
        }

        .table-context-toolbar.hidden {
            display: none;
        }

        .table-context-button {
            min-height: 32px;
            padding: 0 9px;
            border: 1px solid transparent;
            border-radius: 4px;
            background: transparent;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .table-context-button:hover:not(:disabled) {
            background: #eeeeee;
            border-color: #cccccc;
        }

        .table-context-button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        .hidden { display: none; }

        /* ===== DIÁLOGOS MODALES =====
         * Las clases image-dialog-* se reutilizan también para enlaces, tablas
         * y guardado, de modo que todos los cuadros mantengan el mismo aspecto.
         */

        /* PROMPT FLOTANTE DE IMAGEN */

        .image-dialog-backdrop {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.28);
            z-index: 1000;
        }

        .image-dialog-backdrop.hidden {
            display: none;
        }

        .image-dialog {
            width: min(520px, 100%);
            padding: 18px;
            background: white;
            border: 1px solid #bcbcbc;
            border-radius: 8px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.22);
        }

        .image-dialog h2 {
            margin: 0 0 16px;
            font-size: 18px;
        }

        .image-dialog-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .image-dialog-field.hidden {
            display: none;
        }

        .image-dialog-field label {
            font-size: 14px;
            font-weight: 600;
        }

        .image-dialog-field input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #bcbcbc;
            border-radius: 5px;
            font: inherit;
            outline: none;
        }

        .image-dialog-field input:focus {
            border-color: #666666;
        }

        .table-dialog-checkbox {
            flex-direction: row;
            align-items: center;
            gap: 8px;
        }

        .table-dialog-checkbox input {
            width: auto;
            margin: 0;
        }

        .link-image-toggle {
            padding: 0;
            border: 0;
            background: transparent;
            font: inherit;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
        }

        .link-image-toggle:hover,
        .link-image-toggle[aria-pressed="true"] {
            text-decoration: underline;
        }

        .image-dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        .image-dialog-actions button {
            min-width: 90px;
            padding: 8px 12px;
            border: 1px solid #aaaaaa;
            border-radius: 5px;
            background: #f5f5f5;
            font: inherit;
            cursor: pointer;
        }

        .image-dialog-actions button:hover {
            background: #e9e9e9;
        }

        /* Opciones específicas del diálogo de guardado. */
        .save-dialog-section {
            margin-bottom: 16px;
        }

        .save-dialog-section-title {
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .save-format-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .save-format-button {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #bcbcbc;
            border-radius: 5px;
            background: #f5f5f5;
            font: inherit;
            text-align: left;
            cursor: pointer;

            display: flex;
            align-items: center;
            gap: 10px;
        }

        .save-format-button:hover:not(:disabled) {
            background: #e9e9e9;
        }

        .save-format-button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        .save-format-button.selected {
            background: #dddddd;
            border-color: #666666;
        }

        .save-format-check {
            width: 20px;
            flex: 0 0 20px;
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
            text-align: center;
            visibility: hidden;
        }

        .save-format-button.selected .save-format-check {
            visibility: visible;
        }

        .save-format-content {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .save-format-button strong {
            display: block;
            margin-bottom: 2px;
        }

        .save-format-extension {
            font-size: 13px;
            opacity: 0.7;
        }

        .save-file-format-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        /* En pantallas estrechas las opciones de guardado pasan a una columna. */
        @media (max-width: 600px) {
            .save-file-format-list {
                grid-template-columns: 1fr;
            }
        }

        .save-file-format-group {
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 7px;
            background: #fafafa;
        }

        .save-file-format-title {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 9px;
            font-weight: 800;
        }

        .save-file-format-title span {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.65;
        }

        .save-file-format-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .save-file-format-options .save-format-button {
            position: relative;
            justify-content: center;
            background: white;
            text-align: center;
        }

        .save-file-format-options .save-format-button .save-format-check {
            position: absolute;
            left: 12px;
        }

        .save-file-format-options .save-format-content {
            align-items: center;
            text-align: center;
        }

        .direct-save-format-button {
            position: relative;
            height: 100%;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .direct-save-format-button .save-format-check {
            position: absolute;
            left: 50%;
            top: calc(50% + 26px);
            transform: translateX(-50%);
        }

        .direct-save-format-button .save-format-content {
            align-items: center;
            justify-content: center;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- ===== INTERFAZ PRINCIPAL DEL EDITOR ===== -->
    <main class="editor">
        <nav class="view-options">
            <button id="formattedOption" class="view-option" type="button">Texto Formateado</button>
            <button id="markdownOption" class="view-option active" type="button">MarkDown</button>
        </nav>

        <!-- La barra se construye dinámicamente desde JavaScript. -->
        <div id="toolbar" class="toolbar"></div>

        <!-- Herramientas visibles solo cuando el cursor está dentro de una tabla. -->
        <div
            id="tableContextToolbar"
            class="table-context-toolbar hidden"
        >
            <button
                id="tableAddRowAboveButton"
                class="table-context-button"
                type="button"
            >
                + Fila arriba
            </button>

            <button
                id="tableAddRowBelowButton"
                class="table-context-button"
                type="button"
            >
                + Fila abajo
            </button>

            <button
                id="tableAddColumnLeftButton"
                class="table-context-button"
                type="button"
            >
                + Columna izquierda
            </button>

            <button
                id="tableAddColumnRightButton"
                class="table-context-button"
                type="button"
            >
                + Columna derecha
            </button>

            <button
                id="tableDeleteRowButton"
                class="table-context-button"
                type="button"
            >
                − Fila
            </button>

            <button
                id="tableDeleteColumnButton"
                class="table-context-button"
                type="button"
            >
                − Columna
            </button>
        </div>

        <!--
            Las dos vistas contienen el mismo documento. Al cambiar de vista se
            convierte Markdown <-> HTML y se intenta conservar la posición lógica.
        -->
        <section class="editor-content">
            <textarea id="markdownEditor" spellcheck="true" autofocus></textarea>
            <div id="formattedEditor" class="hidden" contenteditable="true" spellcheck="true"></div>
        </section>
    </main>

    <!-- ===== DIÁLOGO PARA INSERTAR O EDITAR IMÁGENES ===== -->
    <div
        id="imageDialogBackdrop"
        class="image-dialog-backdrop hidden"
    >
        <div
            class="image-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="imageDialogTitle"
        >
            <h2 id="imageDialogTitle">Imagen</h2>

            <div class="image-dialog-field">
                <label for="imageUrlInput">URL de la imagen</label>
                <input
                    id="imageUrlInput"
                    type="text"
                    autocomplete="off"
                >
            </div>

            <div class="image-dialog-field">
                <label for="imageAltInput">Texto alternativo</label>
                <input
                    id="imageAltInput"
                    type="text"
                    autocomplete="off"
                >
            </div>

            <div class="image-dialog-actions">
                <button
                    id="imageDialogCancelButton"
                    type="button"
                >
                    Cancelar
                </button>

                <button
                    id="imageDialogAcceptButton"
                    type="button"
                >
                    Aceptar
                </button>
            </div>
        </div>
    </div>

    <!-- ===== DIÁLOGO PARA INSERTAR O EDITAR ENLACES ===== -->
    <div
        id="linkDialogBackdrop"
        class="image-dialog-backdrop hidden"
    >
        <div
            class="image-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="linkDialogTitle"
        >
            <h2 id="linkDialogTitle">Enlace Web</h2>

            <div class="image-dialog-field">
                <label id="linkTextLabel" for="linkTextInput">Texto del enlace</label>
                <input
                    id="linkTextInput"
                    type="text"
                    autocomplete="off"
                >
            </div>

            <div class="image-dialog-field">
                <label for="linkUrlInput">URL del enlace</label>
                <input
                    id="linkUrlInput"
                    type="text"
                    autocomplete="off"
                >
            </div>

            <div class="image-dialog-field">
                <button
                    id="linkImageToggle"
                    class="link-image-toggle"
                    type="button"
                    aria-pressed="false"
                >
                    Haz clic para que el enlace sea una imagen
                </button>
            </div>

            <div
                id="linkImageUrlField"
                class="image-dialog-field hidden"
            >
                <label for="linkImageUrlInput">URL de la imagen</label>
                <input
                    id="linkImageUrlInput"
                    type="text"
                    autocomplete="off"
                >
            </div>

            <div class="image-dialog-actions">
                <button
                    id="linkDialogCancelButton"
                    type="button"
                >
                    Cancelar
                </button>

                <button
                    id="linkDialogAcceptButton"
                    type="button"
                >
                    Aceptar
                </button>
            </div>
        </div>
    </div>

    <!-- ===== DIÁLOGO PARA CREAR TABLAS ===== -->
    <div
        id="tableDialogBackdrop"
        class="image-dialog-backdrop hidden"
    >
        <div
            class="image-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="tableDialogTitle"
        >
            <h2 id="tableDialogTitle">Tabla</h2>

            <div class="image-dialog-field">
                <label for="tableColumnsInput">Cantidad de columnas</label>
                <input
                    id="tableColumnsInput"
                    type="number"
                    min="1"
                    max="20"
                    value="2"
                    inputmode="numeric"
                >
            </div>

            <div class="image-dialog-field">
                <label for="tableRowsInput">Cantidad de filas</label>
                <input
                    id="tableRowsInput"
                    type="number"
                    min="1"
                    max="50"
                    value="1"
                    inputmode="numeric"
                >
            </div>

            <div class="image-dialog-field table-dialog-checkbox">
                <input
                    id="tableHeadersCheckbox"
                    type="checkbox"
                    checked
                >
                <label for="tableHeadersCheckbox">Añadir cabeceras a la tabla</label>
            </div>

            <div class="image-dialog-actions">
                <button
                    id="tableDialogCancelButton"
                    type="button"
                >
                    Cancelar
                </button>

                <button
                    id="tableDialogAcceptButton"
                    type="button"
                >
                    Aceptar
                </button>
            </div>
        </div>
    </div>

    <!-- ===== DIÁLOGO PARA ELEGIR FORMATO DE GUARDADO ===== -->
    <div
        id="saveDialogBackdrop"
        class="image-dialog-backdrop hidden"
    >
        <div
            class="image-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="saveDialogTitle"
        >
            <h2 id="saveDialogTitle">Guardar contenido como...</h2>

            <div
                id="saveFormatList"
                class="save-file-format-list"
                role="radiogroup"
                aria-label="Formato y contenido a guardar"
            ></div>

            <div class="image-dialog-actions">
                <button
                    id="saveDialogSaveButton"
                    type="button"
                    disabled
                >
                    Guardar
                </button>

                <button
                    id="saveDialogCancelButton"
                    type="button"
                >
                    Cancelar
                </button>
            </div>
        </div>
    </div>


    <!-- Toda la lógica se mantiene en este archivo para conservar el editor autocontenido. -->
    <script>
        /**
         * Centraliza los formatos de salida y los tipos de contenido que pueden
         * guardarse. También contiene la descarga genérica mediante Blob cuando
         * un formato no necesita un manejador especializado.
         */
        class SaveController {
            constructor() {
                this.formats = new Map();
                this.contentTypes = new Map();
            }

            registerContentType(contentType) {
                this.contentTypes.set(
                    contentType.name,
                    contentType
                );
            }

            getContentType(name) {
                return this.contentTypes.get(
                    name
                );
            }

            getAllContentTypes() {
                return [
                    ...this.contentTypes.values()
                ];
            }

            register(format) {
                this.formats.set(
                    format.name,
                    format
                );
            }

            remove(name) {
                this.formats.delete(
                    name
                );
            }

            get(name) {
                return this.formats.get(
                    name
                );
            }

            getAll() {
                return [
                    ...this.formats.values()
                ];
            }

            supportsContent(
                formatName,
                contentTypeName
            ) {
                const format =
                    this.get(
                        formatName
                    );

                if (
                    !format
                    ||
                    !contentTypeName
                ) {
                    return false;
                }

                return (
                    Array.isArray(
                        format.supportedContent
                    )
                    &&
                    format.supportedContent.includes(
                        contentTypeName
                    )
                );
            }

            async save(
                formatName,
                contentTypeName
            ) {
                const format =
                    this.get(
                        formatName
                    );

                if (
                    !format
                    ||
                    !this.supportsContent(
                        formatName,
                        contentTypeName
                    )
                ) {
                    return false;
                }

                if (
                    typeof format.saveHandler ===
                    "function"
                ) {
                    const result =
                        await format.saveHandler(
                            contentTypeName
                        );

                    return result !== false;
                }

                const content =
                    format.getContent(
                        contentTypeName
                    );

                const fileName =
                    this.buildFileName(
                        format
                    );

                this.downloadFile(
                    content,
                    fileName,
                    format.mimeType
                );

                return true;
            }

            buildFileName(format) {
                const baseName =
                    typeof format.getFileName ===
                    "function"
                        ? format.getFileName()
                        : format.defaultFileName;

                const cleanBaseName =
                    (
                        baseName
                        ||
                        "documento"
                    )
                    .trim()
                    .replace(
                        /[\\/:*?"<>|]+/g,
                        "_"
                    );

                return (
                    cleanBaseName
                    +
                    "."
                    +
                    format.extension
                );
            }

            downloadFile(
                content,
                fileName,
                mimeType
            ) {
                const file =
                    new Blob(
                        [content],
                        {
                            type:
                                mimeType
                        }
                    );

                const fileUrl =
                    URL.createObjectURL(
                        file
                    );

                const downloadLink =
                    document.createElement(
                        "a"
                    );

                downloadLink.href =
                    fileUrl;

                downloadLink.download =
                    fileName;

                downloadLink.style.display =
                    "none";

                document.body.append(
                    downloadLink
                );

                downloadLink.click();

                downloadLink.remove();

                window.setTimeout(
                    () => {
                        URL.revokeObjectURL(
                            fileUrl
                        );
                    },
                    0
                );
            }
        }


        /**
         * Registro de formatos de entrada. Determina el importador compatible
         * usando la extensión del archivo y, cuando existe, su tipo MIME.
         */
        class ImportController {
            constructor() {
                this.formats = new Map();
            }

            register(format) {
                this.formats.set(
                    format.name,
                    format
                );
            }

            remove(name) {
                this.formats.delete(
                    name
                );
            }

            get(name) {
                return this.formats.get(
                    name
                );
            }

            getAll() {
                return [
                    ...this.formats.values()
                ];
            }

            getFileExtension(fileName) {
                const name =
                    String(
                        fileName || ""
                    );

                const dotIndex =
                    name.lastIndexOf(".");

                if (
                    dotIndex === -1
                    ||
                    dotIndex === name.length - 1
                ) {
                    return "";
                }

                return name
                    .substring(dotIndex + 1)
                    .toLowerCase();
            }

            getCompatibleFormat(file) {
                const extension =
                    this.getFileExtension(
                        file?.name
                    );

                const mimeType =
                    String(
                        file?.type || ""
                    )
                        .trim()
                        .toLowerCase();

                if (!extension) {
                    return null;
                }

                for (
                    const format
                    of this.formats.values()
                ) {
                    const extensions =
                        Array.isArray(
                            format.extensions
                        )
                            ? format.extensions
                            : [];

                    const mimeTypes =
                        Array.isArray(
                            format.mimeTypes
                        )
                            ? format.mimeTypes
                            : [];

                    const extensionIsCompatible =
                        extensions
                            .map(value =>
                                String(value)
                                    .toLowerCase()
                                    .replace(/^\./, "")
                            )
                            .includes(extension);

                    const normalizedMimeTypes =
                        mimeTypes
                            .map(value =>
                                String(value)
                                    .trim()
                                    .toLowerCase()
                            );

                    const mimeTypeIsCompatible =
                        !mimeType
                        ||
                        normalizedMimeTypes
                            .includes(mimeType);

                    if (
                        extensionIsCompatible
                        &&
                        mimeTypeIsCompatible
                    ) {
                        return format;
                    }
                }

                return null;
            }

            isCompatible(file) {
                return (
                    this.getCompatibleFormat(
                        file
                    ) !== null
                );
            }

            async importFile(file) {
                const format =
                    this.getCompatibleFormat(
                        file
                    );

                if (!format) {
                    return {
                        success: false,
                        reason: "unsupported"
                    };
                }

                try {
                    const content =
                        typeof format.importHandler ===
                        "function"
                            ? await format.importHandler(
                                file
                            )
                            : await file.text();

                    if (
                        typeof content !==
                        "string"
                    ) {
                        return {
                            success: false,
                            reason: "invalid"
                        };
                    }

                    return {
                        success: true,
                        format,
                        content
                    };
                } catch (error) {
                    return {
                        success: false,
                        reason: "read",
                        error
                    };
                }
            }
        }


        /**
         * Núcleo del editor. Gestiona los formatos registrados, la conversión
         * Markdown <-> HTML y las operaciones sobre selección, cursor y DOM en
         * las vistas Markdown y formateada.
         */
        class MarkdownController {
            constructor() {
                this.tags = new Map();
            }

            register(tag) {
                this.tags.set(tag.name, tag);
            }

            remove(name) {
                this.tags.delete(name);
            }

            get(name) {
                return this.tags.get(name);
            }

            getAll() {
                return [...this.tags.values()];
            }

            escapeHtml(text) {
                return text
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;");
            }

            escapeAttribute(text) {
                return text
                    .replaceAll("&", "&amp;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;");
            }

            normalizeWebUrl(url) {
                const value = String(url ?? "").trim();

                if (value.length === 0) {
                    return "";
                }

                if (/^https?:\/\//i.test(value)) {
                    return value;
                }

                if (value.startsWith("//")) {
                    return "https:" + value;
                }

                return "https://" + value;
            }

            getLineStart(text, position) {
                if (position <= 0) return 0;
                return text.lastIndexOf("\n", position - 1) + 1;
            }

            getLineEnd(text, position) {
                const lineEnd = text.indexOf("\n", position);
                return lineEnd === -1 ? text.length : lineEnd;
            }

            /* IMAGEN */

            getImageRanges(text) {
                const ranges = [];
                const expression = /!\[([^\]\n]*)\]\(([^)\n]*)\)/g;
                let match;

                while ((match = expression.exec(text)) !== null) {
                    ranges.push({
                        openStart: match.index,
                        closeEnd: match.index + match[0].length,
                        alternativeText: match[1],
                        url: match[2]
                    });
                }

                return ranges;
            }

            findImageRange(text, start, end = start) {
                for (const range of this.getImageRanges(text)) {
                    if (start >= range.openStart && end <= range.closeEnd) {
                        return range;
                    }
                }

                return null;
            }

            isImageActiveInMarkdown(tag, editor) {
                const image = this.findImageRange(
                    editor.value,
                    editor.selectionStart,
                    editor.selectionEnd
                );

                if (!image) {
                    return false;
                }

                const link = this.findLinkRange(
                    editor.value,
                    image.openStart,
                    image.closeEnd
                );

                if (link) {
                    const imageMarkdown = editor.value.substring(
                        image.openStart,
                        image.closeEnd
                    );

                    if (link.content === imageMarkdown) {
                        return false;
                    }
                }

                return true;
            }

            toggleImageToMarkdown(tag, editor) {
                const value = editor.value;
                const selectionStart = editor.selectionStart;
                const selectionEnd = editor.selectionEnd;

                const existing = this.findImageRange(
                    value,
                    selectionStart,
                    selectionEnd
                );

                if (existing) {
                    const linkedImage = this.findLinkRange(
                        value,
                        existing.openStart,
                        existing.closeEnd
                    );

                    const imageMarkdown = value.substring(
                        existing.openStart,
                        existing.closeEnd
                    );

                    if (
                        linkedImage
                        &&
                        linkedImage.content === imageMarkdown
                    ) {
                        editor.focus();
                        return;
                    }

                    editor.setRangeText(
                        "",
                        existing.openStart,
                        existing.closeEnd,
                        "end"
                    );

                    editor.setSelectionRange(
                        existing.openStart,
                        existing.openStart
                    );

                    editor.focus();
                    return;
                }

                const markdown =
                    `![${tag.defaultAlternativeText}](${tag.defaultUrl})`;

                editor.setRangeText(
                    markdown,
                    selectionStart,
                    selectionEnd,
                    "end"
                );

                const alternativeStart = selectionStart + 2;
                const alternativeEnd =
                    alternativeStart + tag.defaultAlternativeText.length;

                editor.setSelectionRange(
                    alternativeStart,
                    alternativeEnd
                );

                editor.focus();
            }

            /* ENLACE WEB */

            getLinkRanges(text) {
                const ranges = [];
                const expression =
                    /(?<!!)\[((?:!\[[^\]\n]*\]\([^)\n]*\)|[^\]\n]*))\]\(([^)\n]*)\)/g;

                let match;

                while ((match = expression.exec(text)) !== null) {
                    ranges.push({
                        openStart: match.index,
                        contentStart: match.index + 1,
                        content: match[1],
                        url: match[2],
                        closeEnd: match.index + match[0].length
                    });
                }

                return ranges;
            }

            findLinkRange(text, start, end = start) {
                for (const range of this.getLinkRanges(text)) {
                    if (start >= range.openStart && end <= range.closeEnd) {
                        return range;
                    }
                }

                return null;
            }

            isLinkActiveInMarkdown(tag, editor) {
                const listInfo = this.getMarkdownListLineAtPosition(
                    editor.value,
                    editor.selectionStart
                );

                if (listInfo?.type === "links") {
                    return false;
                }

                return this.findLinkRange(
                    editor.value,
                    editor.selectionStart,
                    editor.selectionEnd
                ) !== null;
            }

            toggleLinkToMarkdown(tag, editor) {
                const value = editor.value;
                const selectionStart = editor.selectionStart;
                const selectionEnd = editor.selectionEnd;

                const existing = this.findLinkRange(
                    value,
                    selectionStart,
                    selectionEnd
                );

                if (existing) {
                    const isDefaultPlaceholder =
                        existing.content === tag.defaultText;

                    const isImageLink =
                        /^!\[[^\]\n]*\]\([^\)\n]*\)$/.test(
                            existing.content
                        );

                    const formattedLink =
                        this.getWholeTextLinkRangeInMarkdown(
                            editor
                        );

                    if (formattedLink) {
                        const hasExternalFormat =
                            formattedLink.openStart !== existing.openStart
                            ||
                            formattedLink.closeEnd !== existing.closeEnd;

                        if (hasExternalFormat) {
                            editor.setRangeText(
                                "",
                                formattedLink.openStart,
                                formattedLink.closeEnd,
                                "end"
                            );

                            editor.setSelectionRange(
                                formattedLink.openStart,
                                formattedLink.openStart
                            );

                            editor.focus();
                            return;
                        }
                    }

                    const replacement =
                        isDefaultPlaceholder || isImageLink
                            ? ""
                            : existing.content;

                    editor.setRangeText(
                        replacement,
                        existing.openStart,
                        existing.closeEnd,
                        "end"
                    );

                    editor.setSelectionRange(
                        existing.openStart,
                        existing.openStart + replacement.length
                    );

                    editor.focus();
                    return;
                }

                const image = this.findImageRange(
                    value,
                    selectionStart,
                    selectionEnd
                );

                let content;
                let replaceStart;
                let replaceEnd;

                if (image) {
                    content = value.substring(
                        image.openStart,
                        image.closeEnd
                    );

                    replaceStart = image.openStart;
                    replaceEnd = image.closeEnd;
                } else if (selectionStart !== selectionEnd) {
                    content = value.substring(
                        selectionStart,
                        selectionEnd
                    );

                    if (content.includes("\n")) {
                        editor.focus();
                        return;
                    }

                    replaceStart = selectionStart;
                    replaceEnd = selectionEnd;
                } else {
                    content = tag.defaultText;
                    replaceStart = selectionStart;
                    replaceEnd = selectionEnd;
                }

                const markdown =
                    `[${content}](${tag.defaultUrl})`;

                editor.setRangeText(
                    markdown,
                    replaceStart,
                    replaceEnd,
                    "end"
                );

                const contentStart = replaceStart + 1;

                editor.setSelectionRange(
                    contentStart,
                    contentStart + content.length
                );

                editor.focus();
            }

            getWholeInlineMarkdownWrapper(content) {
                for (const inlineTag of this.tags.values()) {
                    if (inlineTag.type !== "inline") continue;
                    if (!inlineTag.markdownStart || !inlineTag.markdownEnd) continue;

                    if (
                        content.startsWith(inlineTag.markdownStart)
                        &&
                        content.endsWith(inlineTag.markdownEnd)
                        &&
                        content.length >=
                            inlineTag.markdownStart.length +
                            inlineTag.markdownEnd.length
                    ) {
                        return inlineTag;
                    }
                }

                return null;
            }

            toggleWholeInlineMarkdownContent(content, tag) {
                const wrapper = this.getWholeInlineMarkdownWrapper(content);

                if (!wrapper) {
                    return tag.markdownStart + content + tag.markdownEnd;
                }

                const inner = content.substring(
                    wrapper.markdownStart.length,
                    content.length - wrapper.markdownEnd.length
                );

                if (wrapper.name === tag.name) {
                    return inner;
                }

                return (
                    wrapper.markdownStart
                    +
                    this.toggleWholeInlineMarkdownContent(inner, tag)
                    +
                    wrapper.markdownEnd
                );
            }

            isWholeInlineMarkdownContentFormatted(content, tag) {
                const wrapper = this.getWholeInlineMarkdownWrapper(content);

                if (!wrapper) {
                    return false;
                }

                if (wrapper.name === tag.name) {
                    return true;
                }

                const inner = content.substring(
                    wrapper.markdownStart.length,
                    content.length - wrapper.markdownEnd.length
                );

                return this.isWholeInlineMarkdownContentFormatted(
                    inner,
                    tag
                );
            }

            getSelectedTextLinkRangeInMarkdown(editor) {
                const link = this.findLinkRange(
                    editor.value,
                    editor.selectionStart,
                    editor.selectionEnd
                );

                if (!link) {
                    return null;
                }

                if (
                    /^!\[[^\]\n]*\]\([^\)\n]*\)$/.test(
                        link.content
                    )
                ) {
                    return null;
                }

                return link;
            }

            getWholeTextLinkRangeInMarkdown(editor) {
                const link = this.getSelectedTextLinkRangeInMarkdown(editor);

                if (!link) {
                    return null;
                }

                const text = editor.value;
                let openStart = link.openStart;
                let closeEnd = link.closeEnd;
                let expanded = true;

                while (expanded) {
                    expanded = false;

                    for (const inlineTag of this.tags.values()) {
                        if (inlineTag.type !== "inline") continue;
                        if (!inlineTag.markdownStart || !inlineTag.markdownEnd) continue;

                        const startLength = inlineTag.markdownStart.length;
                        const endLength = inlineTag.markdownEnd.length;

                        if (
                            openStart >= startLength
                            &&
                            text.substring(
                                openStart - startLength,
                                openStart
                            ) === inlineTag.markdownStart
                            &&
                            text.substring(
                                closeEnd,
                                closeEnd + endLength
                            ) === inlineTag.markdownEnd
                        ) {
                            openStart -= startLength;
                            closeEnd += endLength;
                            expanded = true;
                            break;
                        }
                    }
                }

                return {
                    link,
                    openStart,
                    closeEnd,
                    markdown: text.substring(openStart, closeEnd)
                };
            }

            toggleInlineOnTextLinkToMarkdown(tag, editor) {
                const range = this.getWholeTextLinkRangeInMarkdown(editor);

                if (!range) {
                    return false;
                }

                const newMarkdown = this.toggleWholeInlineMarkdownContent(
                    range.markdown,
                    tag
                );

                editor.setRangeText(
                    newMarkdown,
                    range.openStart,
                    range.closeEnd,
                    "end"
                );

                editor.setSelectionRange(
                    range.openStart,
                    range.openStart + newMarkdown.length
                );

                editor.focus();
                return true;
            }

            /* TEXTO DESTACADO */

            getHighlightRanges(text) {
                const ranges = [];
                const stack = [];
                const lines = text.split("\n");
                let lineStart = 0;

                const countTrailingMarkers = line => {
                    let count = 0;
                    let position = line.length;

                    while (
                        position >= 2
                        && line.substring(position - 2, position) === "=="
                    ) {
                        count++;
                        position -= 2;
                    }

                    return count;
                };

                for (const line of lines) {
                    let position = 0;
                    const openingPositions = [];

                    /*
                     * Los contenedores pueden alternarse al principio de la
                     * línea: > == > ==texto.... Recorremos esa cadena para
                     * registrar cada apertura de destacado, no solo la exterior.
                     */
                    while (position < line.length) {
                        if (line.startsWith("==", position)) {
                            openingPositions.push(lineStart + position);
                            position += 2;
                            continue;
                        }

                        const quote = line.substring(position).match(/^>\s?/);

                        if (quote) {
                            position += quote[0].length;
                            continue;
                        }

                        break;
                    }

                    const trailingCount = countTrailingMarkers(line);
                    const markerOnly = /^(?:>\s?)*(?:==)+$/.test(line);

                    /*
                     * Una línea formada solo por el cierre (por ejemplo ==)
                     * debe cerrar el destacado abierto en la línea anterior,
                     * no abrir otro cuadro vacío.
                     */
                    if (!(markerOnly && stack.length > 0)) {
                        for (const openStart of openingPositions) {
                            stack.push(openStart);
                        }
                    }

                    const closeRegionStart = line.length - trailingCount * 2;

                    for (let index = 0; index < trailingCount; index++) {
                        if (stack.length === 0) break;

                        const closeStart =
                            lineStart + closeRegionStart + index * 2;
                        const openStart = stack.pop();

                        if (closeStart < openStart + 2) continue;

                        ranges.push({
                            openStart,
                            contentStart: openStart + 2,
                            closeStart,
                            closeEnd: closeStart + 2
                        });
                    }

                    lineStart += line.length + 1;
                }

                return ranges;
            }

            findHighlightRange(text, start, end = start) {
                const matches = this.getHighlightRanges(text)
                    .filter(range => (
                        start >= range.openStart
                        && end <= range.closeEnd
                    ))
                    .sort((a, b) => (
                        (a.closeEnd - a.openStart)
                        -
                        (b.closeEnd - b.openStart)
                    ));

                return matches[0] ?? null;
            }

            getContainerLineBounds(text, lineStart, lineEnd) {
                let contentStart = lineStart;
                let contentEnd = lineEnd;

                const highlight = this.findHighlightRange(
                    text,
                    lineStart,
                    lineEnd
                );

                if (highlight) {
                    if (lineStart === highlight.openStart) {
                        contentStart += 2;
                    }

                    if (lineEnd === highlight.closeEnd) {
                        contentEnd -= 2;
                    }
                }

                return { contentStart, contentEnd };
            }

            getDeepContainerLineBounds(text, lineStart, lineEnd) {
                let contentStart = lineStart;
                let contentEnd = lineEnd;
                const ranges = this.getHighlightRanges(text);
                let changed = true;
                let guard = 0;

                while (changed && guard < 30) {
                    changed = false;
                    guard++;

                    const opening = ranges
                        .filter(range => (
                            range.openStart === contentStart
                            && range.closeEnd >= contentEnd
                        ))
                        .sort((a, b) => b.closeEnd - a.closeEnd)[0];

                    if (opening) {
                        contentStart += 2;
                        changed = true;
                    }

                    const quote = text
                        .substring(contentStart, contentEnd)
                        .match(/^>\s?/);

                    if (quote) {
                        contentStart += quote[0].length;
                        changed = true;
                    }

                    const closing = ranges
                        .filter(range => (
                            range.closeEnd === contentEnd
                            && range.openStart <= contentStart
                        ))
                        .sort((a, b) => a.openStart - b.openStart)[0];

                    if (closing) {
                        contentEnd -= 2;
                        changed = true;
                    }
                }

                return { contentStart, contentEnd };
            }

            getMarkdownLineOpeningTokens(text, lineStart, lineEnd) {
                const tokens = [];
                let position = lineStart;

                while (position < lineEnd) {
                    if (text.startsWith("==", position)) {
                        tokens.push({
                            type: "highlight",
                            start: position,
                            end: position + 2,
                            text: "=="
                        });
                        position += 2;
                        continue;
                    }

                    const quote = text
                        .substring(position, lineEnd)
                        .match(/^>\s?/);

                    if (quote) {
                        tokens.push({
                            type: "quote",
                            start: position,
                            end: position + quote[0].length,
                            text: quote[0]
                        });
                        position += quote[0].length;
                        continue;
                    }

                    break;
                }

                return { tokens, contentStart: position };
            }

            getQuoteDepthBeforePosition(text, position) {
                const lineStart = this.getLineStart(text, position);
                const lineEnd = this.getLineEnd(text, position);
                const info = this.getMarkdownLineOpeningTokens(
                    text,
                    lineStart,
                    lineEnd
                );

                return info.tokens.filter(token => (
                    token.type === "quote"
                    && token.start < position
                )).length;
            }

            getInnermostMarkdownTextContainerType(text, position) {
                const lineStart = this.getLineStart(text, position);
                const lineEnd = this.getLineEnd(text, position);
                const info = this.getMarkdownLineOpeningTokens(
                    text,
                    lineStart,
                    lineEnd
                );
                const quoteDepth = info.tokens.filter(
                    token => token.type === "quote"
                ).length;
                const highlight = this.findHighlightRange(
                    text,
                    position,
                    position
                );

                if (!highlight) {
                    return quoteDepth > 0 ? "quote" : null;
                }

                const highlightQuoteDepth =
                    this.getQuoteDepthBeforePosition(
                        text,
                        highlight.openStart
                    );

                return quoteDepth > highlightQuoteDepth
                    ? "quote"
                    : "highlight";
            }

            getLineContentBounds(text, lineStart, lineEnd) {
                const containerBounds = this.getContainerLineBounds(
                    text,
                    lineStart,
                    lineEnd
                );

                let contentStart = containerBounds.contentStart;
                const contentEnd = containerBounds.contentEnd;
                let content = text.substring(contentStart, contentEnd);

                const quote = content.match(/^>\s?/);

                if (quote) {
                    contentStart += quote[0].length;
                    content = text.substring(contentStart, contentEnd);
                }

                const list = content.match(/^([ \t]*)(-|\d+\.)[ \t]+/);

                if (list) {
                    contentStart += list[0].length;
                    content = text.substring(contentStart, contentEnd);
                }

                const heading = content.match(/^(#{1,6})\s+/);

                if (heading) {
                    contentStart += heading[0].length;
                }

                return { contentStart, contentEnd };
            }

            /* SEPARADOR */

            normalizeSeparatorText(text) {
                const separatorTag = this.get("separator");

                if (!separatorTag || !separatorTag.implemented) {
                    return text;
                }

                const separator = separatorTag.markdownLine;
                const lines = text.split("\n");
                const normalizedLines = [];
                let insideHighlight = false;
                let insideCode = false;

                for (const line of lines) {
                    if (/^```/.test(line)) {
                        normalizedLines.push(line);

                        if (insideCode) {
                            if (line.trim() === "```") {
                                insideCode = false;
                            }
                        } else {
                            insideCode = true;
                        }

                        continue;
                    }

                    if (insideCode) {
                        normalizedLines.push(line);
                        continue;
                    }

                    const startsHighlight =
                        !insideHighlight && line.startsWith("==");

                    const singleLineHighlight =
                        startsHighlight &&
                        line.length >= 4 &&
                        line.endsWith("==");

                    if (startsHighlight && !singleLineHighlight) {
                        insideHighlight = true;
                        normalizedLines.push(line);
                        continue;
                    }

                    if (insideHighlight) {
                        normalizedLines.push(line);

                        if (line.endsWith("==")) {
                            insideHighlight = false;
                        }

                        continue;
                    }

                    if (singleLineHighlight || /^>\s?/.test(line)) {
                        normalizedLines.push(line);
                        continue;
                    }

                    const separatorExpression =
                        /(?<!~)~~~(?!~)/g;

                    const separatorMatches =
                        [...line.matchAll(separatorExpression)];

                    if (separatorMatches.length === 0) {
                        normalizedLines.push(line);
                        continue;
                    }

                    if (line === separator) {
                        normalizedLines.push(separator);
                        continue;
                    }

                    let contentStart = 0;

                    for (const match of separatorMatches) {
                        const part = line.substring(
                            contentStart,
                            match.index
                        );

                        if (part.trim().length > 0) {
                            normalizedLines.push(part);
                        }

                        normalizedLines.push(separator);

                        contentStart =
                            match.index + separator.length;
                    }

                    const remaining =
                        line.substring(contentStart);

                    if (remaining.trim().length > 0) {
                        normalizedLines.push(remaining);
                    }
                }

                return normalizedLines.join("\n");
            }

            normalizeSeparatorsInEditor(editor) {
                const originalValue = editor.value;
                const selectionStart = editor.selectionStart;
                const selectionEnd = editor.selectionEnd;
                const normalizedValue = this.normalizeSeparatorText(originalValue);

                if (normalizedValue === originalValue) return;

                const normalizedBeforeStart = this.normalizeSeparatorText(
                    originalValue.substring(0, selectionStart)
                );

                const normalizedBeforeEnd = this.normalizeSeparatorText(
                    originalValue.substring(0, selectionEnd)
                );

                editor.value = normalizedValue;

                editor.setSelectionRange(
                    Math.min(normalizedBeforeStart.length, normalizedValue.length),
                    Math.min(normalizedBeforeEnd.length, normalizedValue.length)
                );
            }

            /* INLINE */

            renderInlineMarkdown(text, allowLinks = true) {
                const links = [];
                const images = [];
                const footnotes = [];

                let temporary = text;

                temporary = temporary.replace(
                    /\[\^([^\]\n]+)\](?!:)/g,
                    (match, id) => {
                        const token = `§MDFOOTNOTE${footnotes.length}§`;

                        footnotes.push(
                            '<sup class="footnote-reference"' +
                            ' data-footnote-id="' +
                            this.escapeAttribute(id) +
                            '">' +
                            '[' +
                            this.escapeHtml(id) +
                            ']</sup>'
                        );

                        return token;
                    }
                );

                if (allowLinks) {
                    temporary = temporary.replace(
                        /(?<!!)\[((?:!\[[^\]\n]*\]\([^)\n]*\)|[^\]\n]*))\]\(([^)\n]*)\)/g,
                        (match, content, url) => {
                            const token = `§MDLINK${links.length}§`;
                            const imageMatch = content.match(
                                /^!\[([^\]\n]*)\]\(([^)\n]*)\)$/
                            );

                            let linkedContent;

                            if (imageMatch) {
                                linkedContent =
                                    "<img" +
                                    ' src="' +
                                    this.escapeAttribute(imageMatch[2]) +
                                    '"' +
                                    ' alt="imagen no disponible"' +
                                    ' data-markdown-alt="' +
                                    this.escapeAttribute(imageMatch[1]) +
                                    '"' +
                                    ' contenteditable="false"' +
                                    ">";
                            } else {
                                linkedContent = this.renderInlineMarkdown(
                                    content,
                                    false
                                );
                            }

                            links.push(
                                '<a href="' +
                                this.escapeAttribute(
                                    this.normalizeWebUrl(url)
                                ) +
                                '" target="_blank" rel="noopener noreferrer">' +
                                linkedContent +
                                '</a>'
                            );

                            return token;
                        }
                    );
                }

                temporary = temporary.replace(
                    /!\[([^\]\n]*)\]\(([^)\n]*)\)/g,
                    (match, alternativeText, url) => {
                        const token = `§MDIMAGE${images.length}§`;

                        images.push(
                            "<img" +
                            ' src="' + this.escapeAttribute(url) + '"' +
                            ' alt="imagen no disponible"' +
                            ' data-markdown-alt="' +
                            this.escapeAttribute(alternativeText) +
                            '"' +
                            ' contenteditable="false"' +
                            ">"
                        );

                        return token;
                    }
                );

                let result = this.escapeHtml(temporary);

                for (const tag of this.tags.values()) {
                    if (tag.type !== "inline") continue;
                    if (typeof tag.markdownToHtml !== "function") continue;
                    result = tag.markdownToHtml(result);
                }

                images.forEach((image, index) => {
                    result = result.replaceAll(
                        `§MDIMAGE${index}§`,
                        image
                    );
                });

                links.forEach((link, index) => {
                    result = result.replaceAll(
                        `§MDLINK${index}§`,
                        link
                    );
                });

                footnotes.forEach((footnote, index) => {
                    result = result.replaceAll(
                        `§MDFOOTNOTE${index}§`,
                        footnote
                    );
                });

                return result;
            }

            /* LISTAS */

            parseMarkdownListLine(line) {
                const match = line.match(
                    /^([ \t]*)(-|\d+\.)[ \t]+(.*)$/
                );

                if (!match) {
                    return null;
                }

                const indent = match[1].replaceAll("\t", "    ");
                const marker = match[2];
                const text = match[3];
                const linkMatch = marker === "-"
                    ? text.match(/^\[([^\]\n]*)\]\(([^)\n]*)\)$/)
                    : null;

                let type;

                if (linkMatch) {
                    type = "links";
                } else if (marker === "-") {
                    type = "unordered";
                } else {
                    type = "ordered";
                }

                return {
                    indent,
                    level: Math.floor(indent.length / 4),
                    marker,
                    type,
                    number: marker === "-" ? null : Number.parseInt(marker, 10),
                    text,
                    linkText: linkMatch ? linkMatch[1] : null,
                    linkUrl: linkMatch ? linkMatch[2] : null
                };
            }

            getMarkdownListLineAtPosition(text, position) {
                const lineStart = this.getLineStart(text, position);
                const lineEnd = this.getLineEnd(text, position);
                const line = text.substring(lineStart, lineEnd);
                const info = this.parseMarkdownListLine(line);

                if (!info) {
                    return null;
                }

                return {
                    ...info,
                    lineStart,
                    lineEnd,
                    line
                };
            }

            getMarkdownLinesWithOffsets(text) {
                const lines = [];
                let start = 0;

                while (start <= text.length) {
                    const newline = text.indexOf("\n", start);
                    const end = newline === -1 ? text.length : newline;

                    lines.push({
                        start,
                        end,
                        text: text.substring(start, end)
                    });

                    if (newline === -1) {
                        break;
                    }

                    start = newline + 1;
                }

                return lines;
            }

            getMarkdownListContainerRange(text, position) {
                const lines = this.getMarkdownLinesWithOffsets(text);
                const lineIndex = lines.findIndex(line => (
                    position >= line.start
                    &&
                    position <= line.end
                ));

                if (lineIndex === -1) {
                    return null;
                }

                const current = this.parseMarkdownListLine(
                    lines[lineIndex].text
                );

                if (!current) {
                    return null;
                }

                let first = lineIndex;
                let last = lineIndex;

                for (let index = lineIndex - 1; index >= 0; index--) {
                    const info = this.parseMarkdownListLine(
                        lines[index].text
                    );

                    if (!info || info.level < current.level) {
                        break;
                    }

                    if (
                        info.level === current.level
                        &&
                        info.type !== current.type
                    ) {
                        break;
                    }

                    if (
                        info.level === current.level
                        &&
                        info.type === current.type
                    ) {
                        first = index;
                    }
                }

                for (let index = lineIndex + 1; index < lines.length; index++) {
                    const info = this.parseMarkdownListLine(
                        lines[index].text
                    );

                    if (!info || info.level < current.level) {
                        break;
                    }

                    if (
                        info.level === current.level
                        &&
                        info.type !== current.type
                    ) {
                        break;
                    }

                    last = index;
                }

                return {
                    type: current.type,
                    level: current.level,
                    start: lines[first].start,
                    end: lines[last].end
                };
            }

            renumberMarkdownListLines(lines) {
                const stack = [];

                return lines.map(line => {
                    const info = this.parseMarkdownListLine(line);

                    if (!info) {
                        stack.length = 0;
                        return line;
                    }

                    const level = info.level;

                    if (stack.length > level + 1) {
                        stack.length = level + 1;
                    }

                    let context = stack[level];

                    if (!context || context.type !== info.type) {
                        context = {
                            type: info.type,
                            counter: 0
                        };

                        stack[level] = context;
                        stack.length = level + 1;
                    }

                    if (info.type === "ordered") {
                        context.counter++;

                        return (
                            info.indent
                            + context.counter
                            + ". "
                            + info.text
                        );
                    }

                    return `${info.indent}- ${info.text}`;
                });
            }

            renumberMarkdownListBlockAtPosition(editor, position) {
                const value = editor.value;
                const lines = this.getMarkdownLinesWithOffsets(value);
                const lineIndex = lines.findIndex(line => (
                    position >= line.start
                    &&
                    position <= line.end
                ));

                if (
                    lineIndex === -1
                    ||
                    !this.parseMarkdownListLine(lines[lineIndex].text)
                ) {
                    return;
                }

                let first = lineIndex;
                let last = lineIndex;

                while (
                    first > 0
                    &&
                    this.parseMarkdownListLine(lines[first - 1].text)
                ) {
                    first--;
                }

                while (
                    last + 1 < lines.length
                    &&
                    this.parseMarkdownListLine(lines[last + 1].text)
                ) {
                    last++;
                }

                const blockStart = lines[first].start;
                const blockEnd = lines[last].end;
                const oldLines = lines
                    .slice(first, last + 1)
                    .map(line => line.text);
                const newLines = this.renumberMarkdownListLines(oldLines);
                const oldText = oldLines.join("\n");
                const newText = newLines.join("\n");

                if (oldText === newText) {
                    return;
                }

                const selectionStart = editor.selectionStart;
                const selectionEnd = editor.selectionEnd;

                const mapPosition = originalPosition => {
                    if (originalPosition < blockStart) {
                        return originalPosition;
                    }

                    if (originalPosition > blockEnd) {
                        return originalPosition + newText.length - oldText.length;
                    }

                    let oldOffset = 0;
                    let newOffset = 0;

                    for (let index = 0; index < oldLines.length; index++) {
                        const oldLine = oldLines[index];
                        const newLine = newLines[index];
                        const oldLineStart = blockStart + oldOffset;
                        const oldLineEnd = oldLineStart + oldLine.length;

                        if (originalPosition <= oldLineEnd) {
                            const column = originalPosition - oldLineStart;
                            const oldInfo = this.parseMarkdownListLine(oldLine);
                            const newInfo = this.parseMarkdownListLine(newLine);

                            if (oldInfo && newInfo) {
                                const oldPrefix =
