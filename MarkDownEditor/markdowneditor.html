                    ? node
                    : node?.parentElement;

                while (current && current !== editor) {
                    if (
                        current.tagName === "TD"
                        ||
                        current.tagName === "TH"
                    ) {
                        return current;
                    }

                    current = current.parentElement;
                }

                return null;
            }

            getTableCellDirectChildFromBoundary(cell, container, offset) {
                if (container === cell) {
                    if (cell.childNodes.length === 0) return null;

                    if (offset < cell.childNodes.length) {
                        return cell.childNodes[offset];
                    }

                    return cell.childNodes[cell.childNodes.length - 1];
                }

                let current = container;

                while (current && current.parentNode !== cell) {
                    current = current.parentNode;
                }

                return current?.parentNode === cell ? current : null;
            }

            wrapTableCellContents(cell, className, range = null) {
                const block = document.createElement("div");
                block.classList.add(className);

                const appendEmptyLine = () => {
                    const empty = this.createEmptyEditableBlock();
                    block.append(empty.block);
                    return empty.textNode;
                };

                if (cell.childNodes.length === 0) {
                    const textNode = appendEmptyLine();
                    cell.append(block);
                    return { block, textNode };
                }

                const isTextContainer = node => (
                    node?.nodeType === Node.ELEMENT_NODE
                    && (
                        node.classList.contains("quote-block")
                        || node.classList.contains("highlight-block")
                    )
                );

                const startDirect = range
                    ? this.getTableCellDirectChildFromBoundary(
                        cell,
                        range.startContainer,
                        range.startOffset
                    )
                    : null;

                const endDirect = range
                    ? this.getTableCellDirectChildFromBoundary(
                        cell,
                        range.endContainer,
                        range.endOffset
                    )
                    : startDirect;

                /*
                 * Si el cursor está dentro de un cuadro de cita o destacado,
                 * el nuevo cuadro del otro tipo se crea dentro del actual.
                 * El mismo tipo sigue comportándose como un interruptor y se
                 * elimina en toggleQuoteToFormatted/toggleHighlightToFormatted.
                 */
                if (range) {
                    const startContainer = this.getInnermostTextContainer(
                        range.startContainer,
                        cell
                    );

                    const endContainer = this.getInnermostTextContainer(
                        range.endContainer,
                        cell
                    );

                    if (startContainer || endContainer) {
                        if (
                            !startContainer
                            || !endContainer
                            || startContainer !== endContainer
                        ) {
                            return null;
                        }

                        if (!startContainer.classList.contains(className)) {
                            const nested = document.createElement("div");
                            nested.classList.add(className);

                            const directFromBoundary = (container, boundary, offset) => {
                                if (boundary === container) {
                                    if (container.childNodes.length === 0) {
                                        return null;
                                    }

                                    const index = Math.min(
                                        offset,
                                        container.childNodes.length - 1
                                    );

                                    return container.childNodes[index];
                                }

                                if (boundary.parentNode === container) {
                                    return boundary;
                                }

                                return this.getDirectChild(boundary, container);
                            };

                            const nestedStart = directFromBoundary(
                                startContainer,
                                range.startContainer,
                                range.startOffset
                            );

                            const nestedEnd = directFromBoundary(
                                startContainer,
                                range.endContainer,
                                range.endOffset
                            );

                            if (!nestedStart || !nestedEnd) {
                                const empty = this.createEmptyEditableBlock();
                                nested.append(empty.block);
                                startContainer.append(nested);
                                return { block: nested, textNode: empty.textNode };
                            }

                            const nestedChildren = [...startContainer.childNodes];
                            const nestedStartIndex = nestedChildren.indexOf(nestedStart);
                            const nestedEndIndex = nestedChildren.indexOf(nestedEnd);

                            if (
                                nestedStartIndex === -1
                                || nestedEndIndex === -1
                            ) {
                                return null;
                            }

                            const nestedFirst = Math.min(
                                nestedStartIndex,
                                nestedEndIndex
                            );

                            const nestedLast = Math.max(
                                nestedStartIndex,
                                nestedEndIndex
                            );

                            const nestedNodes = nestedChildren.slice(
                                nestedFirst,
                                nestedLast + 1
                            );

                            startContainer.insertBefore(
                                nested,
                                nestedNodes[0]
                            );

                            for (const node of nestedNodes) {
                                nested.append(node);
                            }

                            if (nested.childNodes.length === 0) {
                                const empty = this.createEmptyEditableBlock();
                                nested.append(empty.block);
                                return { block: nested, textNode: empty.textNode };
                            }

                            return { block: nested, textNode: null };
                        }
                    }
                }

                if (isTextContainer(startDirect) || isTextContainer(endDirect)) {
                    return null;
                }

                const children = [...cell.childNodes];
                const hasTextContainers = children.some(isTextContainer);
                let nodesToWrap = children;

                if (hasTextContainers && startDirect) {
                    const startIndex = children.indexOf(startDirect);
                    const endIndex = endDirect
                        ? children.indexOf(endDirect)
                        : startIndex;

                    if (startIndex === -1 || endIndex === -1) {
                        const textNode = appendEmptyLine();
                        cell.append(block);
                        return { block, textNode };
                    }

                    const first = Math.min(startIndex, endIndex);
                    const last = Math.max(startIndex, endIndex);

                    for (let index = first; index <= last; index++) {
                        if (isTextContainer(children[index])) {
                            return null;
                        }
                    }

                    /*
                     * Solo se envuelve el bloque donde está realmente el
                     * cursor (o los bloques que forman parte de la selección).
                     * No ampliamos el rango hasta el último contenedor de
                     * cita/destacado, porque eso absorbería las líneas normales
                     * escritas entre ambos cuadros.
                     */
                    nodesToWrap = children.slice(first, last + 1);
                } else if (hasTextContainers && !startDirect) {
                    const textNode = appendEmptyLine();
                    cell.append(block);
                    return { block, textNode };
                }

                if (nodesToWrap.length === 0) {
                    const textNode = appendEmptyLine();
                    cell.append(block);
                    return { block, textNode };
                }

                cell.insertBefore(block, nodesToWrap[0]);

                /*
                 * Firefox puede clonar el contenedor exterior de cita o
                 * destacado si el texto queda directamente bajo él. Los
                 * fragmentos inline se agrupan en líneas <div>, mientras que
                 * los bloques normales se conservan como líneas propias.
                 */
                let inlineLine = null;

                const isExistingBlock = node => (
                    node.nodeType === Node.ELEMENT_NODE
                    && (
                        /^(DIV|P|H[1-6]|UL|OL|TABLE|PRE)$/.test(node.tagName)
                        || node.classList?.contains("code-block")
                    )
                );

                for (const node of nodesToWrap) {
                    if (isTextContainer(node)) {
                        continue;
                    }

                    if (isExistingBlock(node)) {
                        inlineLine = null;
                        block.append(node);
                        continue;
                    }

                    if (!inlineLine) {
                        inlineLine = document.createElement("div");
                        block.append(inlineLine);
                    }

                    inlineLine.append(node);
                }

                if (block.childNodes.length === 0) {
                    const textNode = appendEmptyLine();
                    return { block, textNode };
                }

                return { block, textNode: null };
            }

            getOrCreateContainerLineBlock(container, range) {
                const isLineBlock = node => (
                    node?.nodeType === Node.ELEMENT_NODE
                    && /^(DIV|P|H[1-6])$/.test(node.tagName)
                    && !node.classList.contains("quote-block")
                    && !node.classList.contains("highlight-block")
                );

                const isStructuralBlock = node => (
                    node?.nodeType === Node.ELEMENT_NODE
                    && (
                        /^(UL|OL|TABLE|PRE|HR)$/.test(node.tagName)
                        || node.classList.contains("code-block")
                        || node.classList.contains("quote-block")
                        || node.classList.contains("highlight-block")
                    )
                );

                let direct = this.getDirectChild(
                    range.startContainer,
                    container
                );

                if (!direct && range.startContainer === container) {
                    direct = container.childNodes[
                        Math.min(
                            range.startOffset,
                            Math.max(0, container.childNodes.length - 1)
                        )
                    ] ?? null;
                }

                if (isLineBlock(direct)) {
                    return direct;
                }

                if (isStructuralBlock(direct)) {
                    return null;
                }

                if (!direct) {
                    const empty = this.createEmptyEditableBlock();
                    container.append(empty.block);
                    this.placeCaretInTextNode(empty.textNode, 1);
                    return empty.block;
                }

                /*
                 * Puede existir texto o contenido inline directamente bajo
                 * quote/highlight (por ejemplo al importar HTML). Lo agrupamos
                 * en una sola línea editable, pero nunca absorbemos listas,
                 * tablas, separadores, código ni otro contenedor estructural.
                 */
                let first = direct;

                while (
                    first.previousSibling
                    && !isLineBlock(first.previousSibling)
                    && !isStructuralBlock(first.previousSibling)
                ) {
                    first = first.previousSibling;
                }

                const line = document.createElement("div");
                container.insertBefore(line, first);

                let current = first;
                while (
                    current
                    && !isLineBlock(current)
                    && !isStructuralBlock(current)
                ) {
                    const next = current.nextSibling;
                    line.append(current);
                    current = next;
                }

                if (line.childNodes.length === 0) {
                    line.remove();
                    return null;
                }

                return line;
            }

            ensureEditableLineContent(block) {
                if (!block) return;

                const text = (block.textContent ?? "")
                    .replaceAll("\u200B", "")
                    .trim();

                const hasVisualContent = block.querySelector?.(
                    "img, hr, table, ul, ol, .code-block"
                ) !== null;

                if (text.length === 0 && !hasVisualContent) {
                    block.replaceChildren(
                        document.createTextNode("\u200B")
                    );
                }
            }

            getInnermostTextContainer(node, editor) {
                let current = node?.nodeType === Node.ELEMENT_NODE
                    ? node
                    : node?.parentElement;

                /*
                 * Recorremos la jerarquía desde el punto real del cursor
                 * hacia fuera. El primer quote/highlight encontrado es el
                 * contenedor activo. Esto funciona también con varios niveles
                 * del mismo tipo, por ejemplo quote dentro de quote.
                 */
                while (current && current !== editor) {
                    if (
                        current.classList?.contains("quote-block")
                        || current.classList?.contains("highlight-block")
                    ) {
                        return current;
                    }

                    current = current.parentElement;
                }

                return null;
            }

            isTextContainerLine(block) {
                return Boolean(
                    block
                    && block.nodeType === Node.ELEMENT_NODE
                    && /^(DIV|P|H[1-6])$/.test(block.tagName)
                    && !block.classList.contains("quote-block")
                    && !block.classList.contains("highlight-block")
                );
            }

            isTextContainerLineEmpty(block) {
                if (!this.isTextContainerLine(block)) return false;

                const text = (block.textContent ?? "")
                    .replaceAll("\u200B", "")
                    .trim();

                const hasVisualContent = block.querySelector(
                    "img, hr, table, ul, ol, .code-block"
                ) !== null;

                return text.length === 0 && !hasVisualContent;
            }

            exitTextContainerAtEmptyLines(container, currentBlock, editor) {
                const previousBlock = currentBlock.previousElementSibling;

                /*
                 * Para salir deben existir DOS líneas vacías consecutivas.
                 * De este modo una línea vacía (o dos, antes de la siguiente
                 * pulsación) sigue siendo contenido válido del cuadro.
                 */
                if (
                    !previousBlock
                    || !this.isTextContainerLineEmpty(currentBlock)
                    || !this.isTextContainerLineEmpty(previousBlock)
                ) {
                    return false;
                }

                const trailingNodes = [];
                let trailing = currentBlock.nextSibling;

                while (trailing) {
                    const next = trailing.nextSibling;
                    trailingNodes.push(trailing);
                    trailing = next;
                }

                /*
                 * La tercera pulsación de Enter elimina únicamente las dos
                 * líneas vacías finales usadas como señal de salida. Las líneas
                 * vacías anteriores que formen parte del contenido se conservan.
                 */
                previousBlock.remove();
                currentBlock.remove();

                const outside = this.createEmptyEditableBlock();
                container.after(outside.block);

                if (trailingNodes.length > 0) {
                    const continuation = container.cloneNode(false);
                    outside.block.after(continuation);

                    for (const node of trailingNodes) {
                        continuation.append(node);
                    }
                }

                if (container.childNodes.length === 0) {
                    container.remove();
                }

                this.placeCaretInTextNode(outside.textNode, 1);
                editor.focus();
                return true;
            }

            handleEnterOnTextContainer(editor) {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return false;

                const range = selection.getRangeAt(0);
                if (!range.collapsed) return false;

                const container = this.getInnermostTextContainer(
                    range.startContainer,
                    editor
                );

                if (!container) return false;

                const currentBlock = this.getOrCreateContainerLineBlock(
                    container,
                    range
                );

                if (!this.isTextContainerLine(currentBlock)) {
                    return false;
                }

                if (
                    this.isTextContainerLineEmpty(currentBlock)
                    && this.isTextContainerLineEmpty(
                        currentBlock.previousElementSibling
                    )
                ) {
                    return this.exitTextContainerAtEmptyLines(
                        container,
                        currentBlock,
                        editor
                    );
                }

                const activeSelection = window.getSelection();
                if (!activeSelection || activeSelection.rangeCount === 0) {
                    return false;
                }

                const activeRange = activeSelection.getRangeAt(0);
                const tailRange = document.createRange();

                try {
                    tailRange.setStart(
                        activeRange.startContainer,
                        activeRange.startOffset
                    );
                    tailRange.setEnd(
                        currentBlock,
                        currentBlock.childNodes.length
                    );
                } catch {
                    return false;
                }

                const tail = tailRange.extractContents();
                const newBlock = document.createElement("div");
                newBlock.append(tail);

                this.ensureEditableLineContent(currentBlock);
                this.ensureEditableLineContent(newBlock);

                currentBlock.after(newBlock);
                this.placeCaretAtStart(newBlock);
                editor.focus();
                return true;
            }

            isBlockEmpty(block) {
                if (!block) return false;

                const text = (block.textContent ?? "")
                    .replaceAll("\u200B", "")
                    .trim();

                return text.length === 0;
            }

            isEmptyEditableBlock(block) {
                if (!block || block.nodeType !== Node.ELEMENT_NODE) return false;

                const tagName = block.tagName.toLowerCase();

                if (tagName !== "div" && tagName !== "p") return false;

                return (block.textContent ?? "")
                    .replaceAll("\u200B", "")
                    .trim()
                    .length === 0;
            }

            getFormatAncestor(tag, node, editor) {
                let element = node.nodeType === Node.ELEMENT_NODE
                    ? node
                    : node.parentElement;

                while (element && element !== editor) {
                    if (tag.htmlTags?.includes(element.tagName.toLowerCase())) {
                        return element;
                    }

                    element = element.parentElement;
                }

                return null;
            }

            getFormatElementForRange(tag, range, editor) {
                const start = this.getFormatAncestor(
                    tag,
                    range.startContainer,
                    editor
                );

                if (range.collapsed) {
                    return start;
                }

                const end = this.getFormatAncestor(
                    tag,
                    range.endContainer,
                    editor
                );

                if (start && start === end) {
                    return start;
                }

                const selector = (tag.htmlTags ?? [])
                    .map(tagName => tagName.toLowerCase())
                    .join(",");

                if (!selector) {
                    return null;
                }

                const selectedText = range.toString()
                    .replaceAll("\u200B", "");

                for (const element of editor.querySelectorAll(selector)) {
                    if (!range.intersectsNode(element)) {
                        continue;
                    }

                    const contentRange = document.createRange();
                    contentRange.selectNodeContents(element);

                    const containsSelection =
                        contentRange.compareBoundaryPoints(
                            Range.START_TO_START,
                            range
                        ) <= 0
                        &&
                        contentRange.compareBoundaryPoints(
                            Range.END_TO_END,
                            range
                        ) >= 0;

                    if (containsSelection) {
                        return element;
                    }

                    /*
                     * Al seleccionar visualmente todo un elemento inline, los
                     * extremos del Range pueden quedar en el nodo padre, justo
                     * antes y después del elemento. En ese caso comparamos el
                     * texto seleccionado con el contenido del elemento.
                     */
                    const elementText = (element.textContent ?? "")
                        .replaceAll("\u200B", "");

                    if (
                        selectedText.length > 0
                        &&
                        selectedText === elementText
                    ) {
                        return element;
                    }
                }

                return null;
            }

            formattedHasFormat(tag, range, editor) {
                return this.getFormatElementForRange(
                    tag,
                    range,
                    editor
                ) !== null;
            }

            removeFormatFromFormattedSelection(
                tag,
                element,
                range,
                editor
            ) {
                if (range.collapsed) {
                    this.unwrapElement(element);
                    return;
                }

                const elementRange = document.createRange();
                elementRange.selectNodeContents(element);

                const selectsWholeElement =
                    elementRange.compareBoundaryPoints(
                        Range.START_TO_START,
                        range
                    ) === 0
                    && elementRange.compareBoundaryPoints(
                        Range.END_TO_END,
                        range
                    ) === 0;

                const selectedText = range.toString()
                    .replaceAll("\u200B", "");

                const elementText = (element.textContent ?? "")
                    .replaceAll("\u200B", "");

                if (
                    selectsWholeElement
                    || (
                        selectedText.length > 0
                        && selectedText === elementText
                    )
                ) {
                    this.unwrapElement(element);
                    return;
                }

                const beforeRange = document.createRange();
                beforeRange.selectNodeContents(element);
                beforeRange.setEnd(
                    range.startContainer,
                    range.startOffset
                );

                const afterRange = document.createRange();
                afterRange.selectNodeContents(element);
                afterRange.setStart(
                    range.endContainer,
                    range.endOffset
                );

                const beforeContents = beforeRange.cloneContents();
                const selectedContents = range.cloneContents();
                const afterContents = afterRange.cloneContents();

                const hasContent = fragment => {
                    if (!fragment || fragment.childNodes.length === 0) {
                        return false;
                    }

                    const probe = document.createElement("div");
                    probe.append(fragment.cloneNode(true));

                    return (
                        (probe.textContent ?? "")
                            .replaceAll("\u200B", "")
                            .length > 0
                        || probe.children.length > 0
                    );
                };

                const replacement = document.createDocumentFragment();

                if (hasContent(beforeContents)) {
                    const beforeWrapper = element.cloneNode(false);
                    beforeWrapper.append(beforeContents);
                    replacement.append(beforeWrapper);
                }

                const selectedNodes = [...selectedContents.childNodes];
                replacement.append(selectedContents);

                if (hasContent(afterContents)) {
                    const afterWrapper = element.cloneNode(false);
                    afterWrapper.append(afterContents);
                    replacement.append(afterWrapper);
                }

                element.replaceWith(replacement);

                if (selectedNodes.length > 0) {
                    const selection = window.getSelection();
                    const newRange = document.createRange();
                    newRange.setStartBefore(selectedNodes[0]);
                    newRange.setEndAfter(
                        selectedNodes[selectedNodes.length - 1]
                    );
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                }

                editor.focus();
            }

            unwrapElement(element) {
                const parent = element.parentNode;
                const fragment = document.createDocumentFragment();

                while (element.firstChild) {
                    fragment.append(element.firstChild);
                }

                parent.insertBefore(fragment, element);
                element.remove();
            }

            isInlineFormatElement(element) {
                if (
                    !element
                    ||
                    element.nodeType !== Node.ELEMENT_NODE
                ) {
                    return false;
                }

                const tagName = element.tagName.toLowerCase();

                for (const inlineTag of this.tags.values()) {
                    if (inlineTag.type !== "inline") continue;

                    if (inlineTag.htmlTags?.includes(tagName)) {
                        return true;
                    }
                }

                return false;
            }

            getWholeFormattedInlineElement(container, tag) {
                let current = container;

                while (
                    current
                    &&
                    current.childNodes.length === 1
                    &&
                    current.firstChild?.nodeType === Node.ELEMENT_NODE
                    &&
                    this.isInlineFormatElement(current.firstChild)
                ) {
                    const child = current.firstChild;

                    if (
                        tag.htmlTags?.includes(
                            child.tagName.toLowerCase()
                        )
                    ) {
                        return child;
                    }

                    current = child;
                }

                return null;
            }

            getDeepestWholeFormattedInlineContainer(container) {
                let current = container;

                while (
                    current.childNodes.length === 1
                    &&
                    current.firstChild?.nodeType === Node.ELEMENT_NODE
                    &&
                    this.isInlineFormatElement(current.firstChild)
                ) {
                    current = current.firstChild;
                }

                return current;
            }

            getSelectedTextLink(editor) {
                const link = this.getSelectedLink(editor);

                if (!link || link.querySelector("img")) {
                    return null;
                }

                return link;
            }

            placeCaretAtEnd(element) {
                let current = element;

                while (current?.lastChild) {
                    current = current.lastChild;
                }

                if (current?.nodeType === Node.TEXT_NODE) {
                    this.placeCaretInTextNode(
                        current,
                        current.textContent.length
                    );
                    return true;
                }

                const selection = window.getSelection();
                if (!selection) return false;

                const range = document.createRange();
                range.selectNodeContents(element);
                range.collapse(false);
                selection.removeAllRanges();
                selection.addRange(range);
                return true;
            }

            getWholeFormattedLinkWrapper(link, tag, editor) {
                let current = link.parentElement;

                while (
                    current
                    &&
                    current !== editor
                    &&
                    this.isInlineFormatElement(current)
                    &&
                    current.childNodes.length === 1
                ) {
                    if (
                        tag.htmlTags?.includes(
                            current.tagName.toLowerCase()
                        )
                    ) {
                        return current;
                    }

                    current = current.parentElement;
                }

                return null;
            }

            getOutermostFormattedLinkContainer(link, editor) {
                let current = link;

                while (
                    current.parentElement
                    &&
                    current.parentElement !== editor
                    &&
                    this.isInlineFormatElement(current.parentElement)
                    &&
                    current.parentElement.childNodes.length === 1
                ) {
                    current = current.parentElement;
                }

                return current;
            }

            toggleInlineOnTextLinkToFormatted(tag, editor) {
                const link = this.getSelectedTextLink(editor);

                if (!link) {
                    return false;
                }

                const existing = this.getWholeFormattedLinkWrapper(
                    link,
                    tag,
                    editor
                );

                if (existing) {
                    this.unwrapElement(existing);
                } else {
                    const container = this.getOutermostFormattedLinkContainer(
                        link,
                        editor
                    );

                    const element = document.createElement(
                        tag.htmlCreateTag
                    );

                    container.replaceWith(element);
                    element.append(container);
                }

                this.placeCaretAtEnd(link);
                editor.focus();
                return true;
            }

            toggleInlineToFormatted(tag, editor) {
                if (
                    this.toggleInlineOnTextLinkToFormatted(
                        tag,
                        editor
                    )
                ) {
                    return;
                }

                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return;

                const range = selection.getRangeAt(0);
                const existing = this.getFormatElementForRange(
                    tag,
                    range,
                    editor
                );

                if (existing) {
                    this.removeFormatFromFormattedSelection(
                        tag,
                        existing,
                        range,
                        editor
                    );
                    editor.focus();
                    return;
                }

                const element = document.createElement(tag.htmlCreateTag);

                if (range.collapsed) {
                    const textNode = document.createTextNode("\u200B");
                    element.append(textNode);
                    range.insertNode(element);
                    this.placeCaretInTextNode(textNode, 1);
                } else {
                    element.append(range.extractContents());
                    range.insertNode(element);

                    const newRange = document.createRange();
                    newRange.selectNodeContents(element);
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                }

                editor.focus();
            }

            /* IMAGEN FORMATEADA */

            getSelectedImage(editor) {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return null;

                const range = selection.getRangeAt(0);

                const isImage = node => (
                    node &&
                    node.nodeType === Node.ELEMENT_NODE &&
                    node.tagName === "IMG"
                );

                const getImageFromNode = node => {
                    if (isImage(node)) return node;

                    if (
                        node &&
                        node.nodeType === Node.ELEMENT_NODE &&
                        node.tagName === "A" &&
                        node.children.length === 1 &&
                        isImage(node.firstElementChild)
                    ) {
                        return node.firstElementChild;
                    }

                    return null;
                };

                let current = range.startContainer;

                while (current && current !== editor) {
                    if (isImage(current)) return current;
                    current = current.parentNode;
                }

                if (range.startContainer.nodeType === Node.TEXT_NODE) {
                    const previous = range.startContainer.previousSibling;
                    const next = range.startContainer.nextSibling;

                    const previousImage = getImageFromNode(previous);
                    const nextImage = getImageFromNode(next);

                    if (previousImage) return previousImage;
                    if (nextImage) return nextImage;
                }

                if (range.startContainer.nodeType === Node.ELEMENT_NODE) {
                    const container = range.startContainer;
                    const nodeAt = container.childNodes[range.startOffset];

                    const imageAt = getImageFromNode(nodeAt);

                    if (imageAt) return imageAt;

                    if (range.startOffset > 0) {
                        const previous = container.childNodes[range.startOffset - 1];
                        const previousImage = getImageFromNode(previous);

                        if (previousImage) return previousImage;
                    }
                }

                return null;
            }

            placeCaretAfterImage(image) {
                if (!image?.isConnected) return false;

                let caretText = image.nextSibling;

                if (
                    !caretText
                    ||
                    caretText.nodeType !== Node.TEXT_NODE
                ) {
                    caretText = document.createTextNode("\u200B");
                    image.after(caretText);
                } else if (caretText.textContent.length === 0) {
                    caretText.textContent = "\u200B";
                }

                this.placeCaretInTextNode(
                    caretText,
                    caretText.textContent.startsWith("\u200B") ? 1 : 0
                );

                return true;
            }

            toggleImageToFormatted(tag, editor) {
                const selectedImage = this.getSelectedImage(editor);

                if (
                    selectedImage
                    &&
                    selectedImage.parentElement?.tagName === "A"
                ) {
                    editor.focus();
                    return;
                }

                if (selectedImage) {
                    const parent = selectedImage.parentNode;
                    const next = selectedImage.nextSibling;
                    const previous = selectedImage.previousSibling;
                    selectedImage.remove();

                    if (next) {
                        this.placeCaretAtStart(next);
                    } else if (previous) {
                        const selection = window.getSelection();
                        const range = document.createRange();
                        range.setStartAfter(previous);
                        range.collapse(true);
                        selection.removeAllRanges();
                        selection.addRange(range);
                    } else {
                        const empty = this.createEmptyEditableBlock();
                        parent.append(empty.block);
                        this.placeCaretInTextNode(empty.textNode, 1);
                    }

                    editor.focus();
                    return;
                }

                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return;

                const range = selection.getRangeAt(0).cloneRange();
                const image = document.createElement("img");

                image.setAttribute("src", tag.defaultUrl);
                image.setAttribute("alt", "imagen no disponible");
                image.dataset.markdownAlt = tag.defaultAlternativeText;
                image.setAttribute("contenteditable", "false");

                range.deleteContents();
                range.insertNode(image);

                this.placeCaretAfterImage(image);
                editor.focus();
            }

            /* ENLACE WEB FORMATEADO */

            getSelectedLink(editor) {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return null;

                const range = selection.getRangeAt(0);

                const isLink = node => (
                    node &&
                    node.nodeType === Node.ELEMENT_NODE &&
                    node.tagName === "A"
                );

                let current = range.startContainer;

                while (current && current !== editor) {
                    if (isLink(current)) return current;
                    current = current.parentNode;
                }

                if (range.startContainer.nodeType === Node.TEXT_NODE) {
                    const previous = range.startContainer.previousSibling;
                    const next = range.startContainer.nextSibling;

                    if (isLink(previous)) return previous;
                    if (isLink(next)) return next;
                }

                if (range.startContainer.nodeType === Node.ELEMENT_NODE) {
                    const container = range.startContainer;
                    const nodeAt = container.childNodes[range.startOffset];

                    if (isLink(nodeAt)) return nodeAt;

                    if (range.startOffset > 0) {
                        const previous =
                            container.childNodes[range.startOffset - 1];

                        if (isLink(previous)) return previous;
                    }
                }

                const selectedImage = this.getSelectedImage(editor);

                if (
                    selectedImage
                    &&
                    selectedImage.parentElement?.tagName === "A"
                ) {
                    return selectedImage.parentElement;
                }

                return null;
            }

            placeCaretAfterLink(link) {
                if (!link?.isConnected) return false;

                let caretText = link.nextSibling;

                if (
                    !caretText
                    ||
                    caretText.nodeType !== Node.TEXT_NODE
                ) {
                    caretText = document.createTextNode("\u200B");
                    link.after(caretText);
                } else if (caretText.textContent.length === 0) {
                    caretText.textContent = "\u200B";
                }

                this.placeCaretInTextNode(
                    caretText,
                    caretText.textContent.startsWith("\u200B") ? 1 : 0
                );

                return true;
            }

            handleEnterAfterLinkedImage(editor) {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return false;

                const range = selection.getRangeAt(0);
                if (!range.collapsed) return false;

                const link = this.getSelectedLink(editor);

                if (
                    !link
                    ||
                    link.children.length !== 1
                    ||
                    link.firstElementChild?.tagName !== "IMG"
                ) {
                    return false;
                }

                const isCaretAfterLink =
                    (
                        range.startContainer.nodeType === Node.TEXT_NODE
                        &&
                        range.startContainer.previousSibling === link
                    )
                    ||
                    (
                        range.startContainer.nodeType === Node.ELEMENT_NODE
                        &&
                        range.startOffset > 0
                        &&
                        range.startContainer.childNodes[range.startOffset - 1] === link
                    );

                if (!isCaretAfterLink) return false;

                const quote = this.getQuoteAncestor(link, editor);
                const highlight = this.getHighlightAncestor(link, editor);
                const container = quote || highlight || editor;
                const block = this.getDirectChild(link, container);

                if (!block) return false;

                const empty = this.createEmptyEditableBlock();
                block.after(empty.block);
                this.placeCaretInTextNode(empty.textNode, 1);
                editor.focus();

                return true;
            }

            toggleLinkToFormatted(tag, editor) {
                const selectedLink = this.getSelectedLink(editor);

                if (selectedLink) {
                    const caretText =
                        document.createTextNode("\u200B");

                    const linkContainer =
                        selectedLink.querySelector("img")
                            ? selectedLink
                            : this.getOutermostFormattedLinkContainer(
                                selectedLink,
                                editor
                            );

                    linkContainer.replaceWith(
                        caretText
                    );

                    this.placeCaretInTextNode(
                        caretText,
                        1
                    );

                    editor.focus();
                    return;
                }

                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return;

                const selectedImage = this.getSelectedImage(editor);
                const link = document.createElement("a");
                link.setAttribute("href", this.normalizeWebUrl(tag.defaultUrl));
                link.setAttribute("target", "_blank");
                link.setAttribute("rel", "noopener noreferrer");

                if (selectedImage) {
                    selectedImage.replaceWith(link);
                    link.append(selectedImage);

                    this.placeCaretAfterLink(link);
                    editor.focus();
                    return;
                }

                const range = selection.getRangeAt(0).cloneRange();

                if (range.collapsed) {
                    const textNode = document.createTextNode(tag.defaultText);
                    link.append(textNode);
                    range.insertNode(link);

                    const newRange = document.createRange();
                    newRange.selectNodeContents(link);
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                } else {
                    const selectedText = range.toString();

                    if (selectedText.includes("\n")) {
                        editor.focus();
                        return;
                    }

                    link.append(range.extractContents());
                    range.insertNode(link);

                    const newRange = document.createRange();
                    newRange.selectNodeContents(link);
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                }

                editor.focus();
            }

            /* CONTENEDORES FORMATEADOS */

            unwrapContainerBlock(container) {
                const parent = container.parentNode;
                const nodes = [...container.childNodes];

                if (nodes.length === 0) {
                    const empty = this.createEmptyEditableBlock();
                    container.replaceWith(empty.block);
                    return [empty.block];
                }

                for (const node of nodes) {
                    parent.insertBefore(node, container);
                }

                container.remove();
                return nodes;
            }

            createTextContainerCaretMarker(range) {
                if (!range.collapsed) return null;

                const marker = document.createComment(
                    "markdowneditor-text-container-caret"
                );

                const markerRange = range.cloneRange();
                markerRange.insertNode(marker);
                return marker;
            }

            restoreTextContainerCaretMarker(marker) {
                if (!marker?.parentNode) return false;

                const selection = window.getSelection();
                if (!selection) return false;

                const range = document.createRange();
                range.setStartBefore(marker);
                range.collapse(true);
                selection.removeAllRanges();
                selection.addRange(range);
                marker.remove();
                return true;
            }

            getTextContainerBoundaryChild(
                context,
                boundary,
                offset,
                isEnd = false
            ) {
                if (!context || !boundary) return null;

                if (boundary === context) {
                    if (context.childNodes.length === 0) return null;

                    let index;

                    if (isEnd && offset > 0) {
                        index = offset - 1;
                    } else {
                        index = Math.min(
                            offset,
                            context.childNodes.length - 1
                        );
                    }

                    index = Math.max(
                        0,
                        Math.min(index, context.childNodes.length - 1)
                    );

                    return context.childNodes[index] ?? null;
                }

                let current = boundary;

                while (current && current.parentNode !== context) {
                    current = current.parentNode;
                }

                return current?.parentNode === context
                    ? current
                    : null;
            }

            isTextContainerStructuralNode(node) {
                if (!node || node.nodeType !== Node.ELEMENT_NODE) {
                    return false;
                }

                if (
                    node.classList.contains("quote-block")
                    || node.classList.contains("highlight-block")
                    || node.classList.contains("code-block")
                ) {
                    return true;
                }

                return /^(DIV|P|H[1-6]|UL|OL|TABLE|PRE|HR|BR)$/.test(
                    node.tagName
                );
            }

            normalizeTextContainerChildren(container) {
                let inlineLine = null;

                for (const node of [...container.childNodes]) {
                    if (this.isTextContainerStructuralNode(node)) {
                        inlineLine = null;
                        continue;
                    }

                    if (!inlineLine) {
                        inlineLine = document.createElement("div");
                        container.insertBefore(inlineLine, node);
                    }

                    inlineLine.append(node);
                }

                if (container.childNodes.length === 0) {
                    const empty = this.createEmptyEditableBlock();
                    container.append(empty.block);
                    return;
                }

                for (const child of [...container.children]) {
                    if (!this.isTextContainerLine(child)) continue;

                    const hasCaretMarker = [...child.childNodes].some(
                        node => (
                            node.nodeType === Node.COMMENT_NODE
                            && node.data ===
                                "markdowneditor-text-container-caret"
                        )
                    );

                    if (hasCaretMarker) {
                        const text = (child.textContent ?? "")
                            .replaceAll("\u200B", "")
                            .trim();

                        const hasVisualContent = child.querySelector(
                            "img, hr, table, ul, ol, .code-block"
                        ) !== null;

                        if (text.length === 0 && !hasVisualContent) {
                            const marker = [...child.childNodes].find(
                                node => (
                                    node.nodeType === Node.COMMENT_NODE
                                    && node.data ===
                                        "markdowneditor-text-container-caret"
                                )
                            );

                            child.insertBefore(
                                document.createTextNode("\u200B"),
                                marker ?? child.firstChild
                            );
                        }

                        continue;
                    }

                    this.ensureEditableLineContent(child);
                }
            }

            wrapRangeInTextContainer(
                context,
                className,
                startBoundary,
                startOffset,
                endBoundary,
                endOffset,
                collapsed
            ) {
                const block = document.createElement("div");
                block.classList.add(className);

                if (context.childNodes.length === 0) {
                    const empty = this.createEmptyEditableBlock();
                    block.append(empty.block);
                    context.append(block);
                    return block;
                }

                let startDirect = this.getTextContainerBoundaryChild(
                    context,
                    startBoundary,
                    startOffset,
                    false
                );

                let endDirect = collapsed
                    ? startDirect
                    : this.getTextContainerBoundaryChild(
                        context,
                        endBoundary,
                        endOffset,
                        true
                    );

                if (!startDirect || !endDirect) {
                    const empty = this.createEmptyEditableBlock();
                    block.append(empty.block);
                    context.append(block);
                    return block;
                }

                /*
                 * Cuando una celda (o un contenedor importado) tiene texto
                 * inline directamente, el marcador del cursor puede quedar
                 * como hijo directo. Expandimos solo hasta los límites de esa
                 * línea inline, sin absorber otros cuadros ni bloques.
                 */
                if (!this.isTextContainerStructuralNode(startDirect)) {
                    while (
                        startDirect.previousSibling
                        && !this.isTextContainerStructuralNode(
                            startDirect.previousSibling
                        )
                    ) {
                        startDirect = startDirect.previousSibling;
                    }
                }

                if (!this.isTextContainerStructuralNode(endDirect)) {
                    while (
                        endDirect.nextSibling
                        && !this.isTextContainerStructuralNode(
                            endDirect.nextSibling
                        )
                    ) {
                        endDirect = endDirect.nextSibling;
                    }
                }

                const children = [...context.childNodes];
                const startIndex = children.indexOf(startDirect);
                const endIndex = children.indexOf(endDirect);

                if (startIndex === -1 || endIndex === -1) {
                    return null;
                }

                const first = Math.min(startIndex, endIndex);
                const last = Math.max(startIndex, endIndex);
                const nodes = children.slice(first, last + 1);

                context.insertBefore(block, nodes[0]);

                for (const node of nodes) {
                    block.append(node);
                }

                this.normalizeTextContainerChildren(block);
                return block;
            }

            toggleTextContainerToFormatted(className, editor) {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return;

                const range = selection.getRangeAt(0);
                const wasCollapsed = range.collapsed;

                if (editor.childNodes.length === 0) {
                    const empty = className === "quote-block"
                        ? this.createEmptyQuoteBlock()
                        : this.createEmptyHighlightBlock();

                    editor.append(empty.block);
                    this.placeCaretInTextNode(empty.textNode, 1);
                    editor.focus();
                    return;
                }

                const innerStart = this.getInnermostTextContainer(
                    range.startContainer,
                    editor
                );

                const innerEnd = this.getInnermostTextContainer(
                    range.endContainer,
                    editor
                );

                if (
                    (innerStart || innerEnd)
                    && (
                        !innerStart
                        || !innerEnd
                        || innerStart !== innerEnd
                    )
                ) {
                    editor.focus();
                    return;
                }

                const sameTypeStart = this.getClassAncestor(
                    range.startContainer,
                    className,
                    editor
                );

                const sameTypeEnd = this.getClassAncestor(
                    range.endContainer,
                    className,
                    editor
                );

                if (
                    sameTypeStart
                    && (
                        range.collapsed
                        || sameTypeStart === sameTypeEnd
                    )
                ) {
                    this.unwrapContainerBlock(sameTypeStart);
                    editor.focus();
                    return;
                }

                let context = innerStart;

                if (!context) {
                    const startCell = this.getTableCellAncestor(
                        range.startContainer,
                        editor
                    );

                    const endCell = this.getTableCellAncestor(
                        range.endContainer,
                        editor
                    );

                    if (startCell || endCell) {
                        if (!startCell || startCell !== endCell) {
                            editor.focus();
                            return;
                        }

                        context = startCell;
                    } else {
                        context = editor;
                    }
                }

                let startBoundary = range.startContainer;
                let startOffset = range.startOffset;
                let endBoundary = range.endContainer;
                let endOffset = range.endOffset;
                let marker = null;

                if (wasCollapsed) {
                    marker = this.createTextContainerCaretMarker(range);

                    if (!marker) {
                        editor.focus();
                        return;
                    }

                    startBoundary = marker;
                    startOffset = 0;
                    endBoundary = marker;
                    endOffset = 0;
                }

                const wrapped = this.wrapRangeInTextContainer(
                    context,
                    className,
                    startBoundary,
                    startOffset,
                    endBoundary,
                    endOffset,
                    wasCollapsed
                );

                if (!wrapped) {
                    marker?.remove();
                    editor.focus();
                    return;
                }

                if (wasCollapsed) {
                    this.restoreTextContainerCaretMarker(marker);
                } else {
                    const newRange = document.createRange();
                    newRange.selectNodeContents(wrapped);
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                }

                editor.focus();
            }

            toggleHighlightToFormatted(tag, editor) {
                this.toggleTextContainerToFormatted(
                    "highlight-block",
                    editor
                );
            }

            /* TEXTO CITADO FORMATEADO */

            toggleQuoteToFormatted(tag, editor) {
                this.toggleTextContainerToFormatted(
                    "quote-block",
                    editor
                );
            }

            /* TÍTULOS FORMATEADOS */

            replaceBlockTag(block, tagName) {
                const replacement = document.createElement(tagName);

                while (block.firstChild) {
                    replacement.append(block.firstChild);
                }

                block.replaceWith(replacement);
                return replacement;
            }

            toggleSingleHeadingBlock(block, tag) {
                if (block.nodeType === Node.TEXT_NODE) {
                    const heading = document.createElement(`h${tag.level}`);
                    heading.textContent = block.textContent;
                    block.replaceWith(heading);
                    return heading;
                }

                if (block.nodeType !== Node.ELEMENT_NODE) return block;
                if (block.tagName.toLowerCase() === "hr") return block;

                if (
                    block.classList.contains("highlight-block") ||
                    block.classList.contains("quote-block")
                ) {
                    return block;
                }

                const currentTag = block.tagName.toLowerCase();

                if (currentTag === `h${tag.level}`) {
                    return this.replaceBlockTag(block, "div");
                }

                return this.replaceBlockTag(block, `h${tag.level}`);
            }

            toggleHeadingInsideContainer(container, tag, range) {
                let startBlock = this.getDirectChild(range.startContainer, container);
                let endBlock = this.getDirectChild(range.endContainer, container);

                if (range.startContainer === container) {
                    startBlock = container.childNodes[
                        Math.min(range.startOffset, container.childNodes.length - 1)
                    ];
                }

                if (range.endContainer === container) {
                    endBlock = container.childNodes[
                        Math.min(range.endOffset, container.childNodes.length - 1)
                    ];
                }

                if (!startBlock || !endBlock) return;

                const children = [...container.childNodes];
                const startIndex = children.indexOf(startBlock);
                const endIndex = children.indexOf(endBlock);

                if (startIndex === -1 || endIndex === -1) return;

                const first = Math.min(startIndex, endIndex);
                const last = Math.max(startIndex, endIndex);
                const resulting = [];

                for (const block of children.slice(first, last + 1)) {
                    resulting.push(this.toggleSingleHeadingBlock(block, tag));
                }

                if (resulting.length > 0) {
                    const selection = window.getSelection();
                    const newRange = document.createRange();
                    newRange.setStartBefore(resulting[0]);
                    newRange.setEndAfter(resulting[resulting.length - 1]);
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                }
            }

            toggleHeadingToFormatted(tag, editor) {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return;

                const range = selection.getRangeAt(0);

                if (editor.childNodes.length === 0) {
                    const heading = document.createElement(`h${tag.level}`);
                    const textNode = document.createTextNode("\u200B");
                    heading.append(textNode);
                    editor.append(heading);
                    this.placeCaretInTextNode(textNode, 1);
                    return;
                }

                const quote = this.getQuoteAncestor(range.startContainer, editor);

                if (
                    quote &&
                    quote === this.getQuoteAncestor(range.endContainer, editor)
                ) {
                    this.toggleHeadingInsideContainer(quote, tag, range);
                    editor.focus();
                    return;
                }

                const highlight = this.getHighlightAncestor(range.startContainer, editor);

                if (
                    highlight &&
                    highlight === this.getHighlightAncestor(range.endContainer, editor)
                ) {
                    this.toggleHeadingInsideContainer(highlight, tag, range);
                    editor.focus();
                    return;
                }

                const startTop = this.getBlockFromBoundary(
                    range.startContainer,
                    range.startOffset,
                    editor
                );

                const endTop = this.getBlockFromBoundary(
                    range.endContainer,
                    range.endOffset,
                    editor
                );

                if (!startTop || !endTop) return;

                const children = [...editor.childNodes];
                const startIndex = children.indexOf(startTop);
                const endIndex = children.indexOf(endTop);

                if (startIndex === -1 || endIndex === -1) return;

                const first = Math.min(startIndex, endIndex);
                const last = Math.max(startIndex, endIndex);
                const resulting = [];

                for (const block of children.slice(first, last + 1)) {
                    resulting.push(this.toggleSingleHeadingBlock(block, tag));
                }

                if (resulting.length > 0) {
                    const newRange = document.createRange();
                    newRange.setStartBefore(resulting[0]);
                    newRange.setEndAfter(resulting[resulting.length - 1]);
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                }

                editor.focus();
            }

            /* SEPARADOR FORMATEADO */

            getSelectedSeparator(editor) {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return null;

                const range = selection.getRangeAt(0);

                const isHr = node => (
                    node &&
                    node.nodeType === Node.ELEMENT_NODE &&
                    node.tagName.toLowerCase() === "hr"
                );

                let current = range.startContainer;

                while (current && current !== editor) {
                    if (isHr(current)) return current;
                    current = current.parentNode;
                }

                if (range.startContainer.nodeType === Node.ELEMENT_NODE) {
                    const container = range.startContainer;
                    const nodeAt = container.childNodes[range.startOffset];
                    if (isHr(nodeAt)) return nodeAt;

                    if (range.startOffset > 0) {
                        const previous = container.childNodes[range.startOffset - 1];
                        if (isHr(previous)) return previous;
                    }
                }

                return null;
            }

            ensureEditableBlockAfter(separator) {
                const parent = separator.parentNode;
                const next = separator.nextSibling;

                if (
                    next &&
                    !(
                        next.nodeType === Node.ELEMENT_NODE &&
                        next.tagName.toLowerCase() === "hr"
                    )
                ) {
                    return next;
                }

                const empty = this.createEmptyEditableBlock();
                parent.insertBefore(empty.block, next);
                return empty.block;
            }

            handleEnterOnSeparator(editor) {
                const separator = this.getSelectedSeparator(editor);
                if (!separator) return false;

                const block = this.ensureEditableBlockAfter(separator);
                this.placeCaretAtStart(block);
                editor.focus();
                return true;
            }

            handleBackspaceOnSeparator(editor) {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return false;

                const range = selection.getRangeAt(0);
                if (!range.collapsed) return false;

                const isSeparator = node => (
                    node
                    && node.nodeType === Node.ELEMENT_NODE
                    && node.tagName.toLowerCase() === "hr"
                    && !node.classList.contains("footnotes-separator")
                );

                const removeSeparator = separator => {
                    const parent = separator.parentNode;
                    if (!parent) return false;

                    separator.remove();

                    if (!editor.contains(range.startContainer)) {
                        const empty = this.createEmptyEditableBlock();
                        parent.append(empty.block);
                        this.placeCaretInTextNode(empty.textNode, 1);
                    }

                    editor.focus();
                    return true;
                };

                if (range.startContainer.nodeType === Node.ELEMENT_NODE) {
                    const container = range.startContainer;

                    if (range.startOffset > 0) {
                        const previous = container.childNodes[range.startOffset - 1];
                        if (isSeparator(previous)) {
                            return removeSeparator(previous);
                        }
                    }
                }

                let current = range.startContainer.nodeType === Node.ELEMENT_NODE
                    ? range.startContainer
                    : range.startContainer.parentElement;

                while (current && current !== editor) {
                    const previous = current.previousSibling;

                    if (isSeparator(previous)) {
                        const beforeCaret = document.createRange();
                        beforeCaret.selectNodeContents(current);

                        try {
                            beforeCaret.setEnd(
                                range.startContainer,
                                range.startOffset
                            );
                        } catch {
                            return false;
                        }

                        const fragment = beforeCaret.cloneContents();
                        const temporary = document.createElement("div");
                        temporary.append(fragment);

                        const textBefore = (temporary.textContent ?? "")
                            .replaceAll("\u200B", "");

                        const hasContentBefore = textBefore.length > 0
                            || temporary.querySelector(
                                "img, table, ul, ol, hr, pre, .code-block"
                            ) !== null;

                        if (!hasContentBefore) {
                            return removeSeparator(previous);
                        }
                    }

                    current = current.parentElement;
                }

                return false;
            }

            /* TEXTO DESTACADO */

            correctCaretAroundSeparator(editor, clientY) {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return false;

                const range = selection.getRangeAt(0);
                if (!range.collapsed) return false;

                const container = range.startContainer;
                if (container.nodeType !== Node.ELEMENT_NODE) return false;

                const checkSeparator = separator => {
                    if (
                        !separator ||
                        separator.nodeType !== Node.ELEMENT_NODE ||
                        separator.tagName.toLowerCase() !== "hr"
                    ) {
                        return false;
                    }

                    const rect = separator.getBoundingClientRect();
                    if (clientY <= rect.bottom) return false;

                    const block = this.ensureEditableBlockAfter(separator);
                    this.placeCaretAtStart(block);
                    editor.focus();
                    return true;
                };

                if (checkSeparator(container.childNodes[range.startOffset])) {
                    return true;
                }

                if (
                    range.startOffset > 0 &&
                    checkSeparator(container.childNodes[range.startOffset - 1])
                ) {
                    return true;
                }

                return false;
            }

            toggleSeparatorToFormatted(tag, editor) {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return;

                const selectedSeparator = this.getSelectedSeparator(editor);

                if (selectedSeparator) {
                    const parent = selectedSeparator.parentNode;
                    const next = selectedSeparator.nextSibling;
                    selectedSeparator.remove();

                    if (next) {
                        this.placeCaretAtStart(next);
                    } else {
                        const empty = this.createEmptyEditableBlock();
                        parent.append(empty.block);
                        this.placeCaretInTextNode(empty.textNode, 1);
                    }

                    editor.focus();
                    return;
                }

                let range = selection.getRangeAt(0);

                if (!range.collapsed) {
                    range = range.cloneRange();
                    range.collapse(true);
                    selection.removeAllRanges();
                    selection.addRange(range);
                }

                const quote = this.getQuoteAncestor(range.startContainer, editor);
                const highlight = this.getHighlightAncestor(range.startContainer, editor);
                let container = editor;

                if (quote) container = quote;
                else if (highlight) container = highlight;

                let block = this.getDirectChild(range.startContainer, container);

                if (range.startContainer === container) {
                    block = container.childNodes[
                        Math.min(range.startOffset, container.childNodes.length - 1)
                    ];
                }

                if (!block) {
                    const separator = this.createSeparatorElement(tag);
                    const empty = this.createEmptyEditableBlock();
                    container.append(separator, empty.block);
                    this.placeCaretInTextNode(empty.textNode, 1);
                    return;
                }

                const visibleText =
                    block.textContent?.replaceAll("\u200B", "") ?? "";

                if (visibleText.length === 0) {
                    const separator = this.createSeparatorElement(tag);
                    const empty = this.createEmptyEditableBlock();
                    block.replaceWith(separator, empty.block);
                    this.placeCaretInTextNode(empty.textNode, 1);
                    editor.focus();
                    return;
                }

                if (block.nodeType !== Node.ELEMENT_NODE) return;

                const beforeRange = document.createRange();
                beforeRange.selectNodeContents(block);
                beforeRange.setEnd(range.startContainer, range.startOffset);

                const afterRange = document.createRange();
                afterRange.selectNodeContents(block);
                afterRange.setStart(range.startContainer, range.startOffset);

                const beforeFragment = beforeRange.cloneContents();
                const afterFragment = afterRange.cloneContents();

                const temporaryBefore = document.createElement("div");
                temporaryBefore.append(beforeFragment.cloneNode(true));

                const temporaryAfter = document.createElement("div");
                temporaryAfter.append(afterFragment.cloneNode(true));

                const hasBefore = temporaryBefore.textContent
                    .replaceAll("\u200B", "")
                    .length > 0;

                const hasAfter = temporaryAfter.textContent
                    .replaceAll("\u200B", "")
                    .length > 0;

                const nodes = [];

                if (hasBefore) {
