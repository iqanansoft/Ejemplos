                                    oldInfo.indent.length
                                    + oldInfo.marker.length
                                    + 1;

                                const newPrefix =
                                    newInfo.indent.length
                                    + newInfo.marker.length
                                    + 1;

                                const mappedColumn = column >= oldPrefix
                                    ? newPrefix + (column - oldPrefix)
                                    : Math.min(column, newPrefix);

                                return blockStart + newOffset + mappedColumn;
                            }

                            return (
                                blockStart
                                + newOffset
                                + Math.min(column, newLine.length)
                            );
                        }

                        oldOffset += oldLine.length + 1;
                        newOffset += newLine.length + 1;
                    }

                    return originalPosition;
                };

                const newSelectionStart = mapPosition(selectionStart);
                const newSelectionEnd = mapPosition(selectionEnd);

                editor.setRangeText(
                    newText,
                    blockStart,
                    blockEnd,
                    "end"
                );

                editor.setSelectionRange(
                    newSelectionStart,
                    newSelectionEnd
                );
            }

            isListActiveInMarkdown(tag, editor) {
                const info = this.getMarkdownListLineAtPosition(
                    editor.value,
                    editor.selectionStart
                );

                return info?.type === tag.listType;
            }

            toggleListToMarkdown(tag, editor) {
                const value = editor.value;
                const selectionStart = editor.selectionStart;
                const selectionEnd = editor.selectionEnd;
                const current = this.getMarkdownListLineAtPosition(
                    value,
                    selectionStart
                );

                if (
                    current
                    &&
                    current.type === tag.listType
                ) {
                    const container = this.getMarkdownListContainerRange(
                        value,
                        selectionStart
                    );

                    if (container) {
                        let removeStart = container.start;
                        let removeEnd = container.end;

                        if (container.level > 0) {
                            while (removeStart > 0) {
                                const previousLineEnd = removeStart - 1;
                                const previousLineStart = this.getLineStart(
                                    value,
                                    previousLineEnd
                                );

                                const previousLine = value.substring(
                                    previousLineStart,
                                    previousLineEnd
                                );

                                if (previousLine.trim().length > 0) {
                                    break;
                                }

                                removeStart = previousLineStart;
                            }

                            if (
                                removeEnd < value.length
                                &&
                                value[removeEnd] === "\n"
                            ) {
                                removeEnd++;
                            }

                            while (removeEnd < value.length) {
                                const nextLineEnd = this.getLineEnd(
                                    value,
                                    removeEnd
                                );

                                const nextLine = value.substring(
                                    removeEnd,
                                    nextLineEnd
                                );

                                if (nextLine.trim().length > 0) {
                                    break;
                                }

                                removeEnd = nextLineEnd;

                                if (
                                    removeEnd < value.length
                                    &&
                                    value[removeEnd] === "\n"
                                ) {
                                    removeEnd++;
                                }
                            }

                            if (
                                removeEnd === value.length
                                &&
                                removeStart > 0
                                &&
                                value[removeStart - 1] === "\n"
                            ) {
                                removeStart--;
                            }
                        } else if (
                            removeEnd < value.length
                            &&
                            value[removeEnd] === "\n"
                        ) {
                            removeEnd++;
                        } else if (
                            removeStart > 0
                            &&
                            value[removeStart - 1] === "\n"
                        ) {
                            removeStart--;
                        }

                        editor.setRangeText(
                            "",
                            removeStart,
                            removeEnd,
                            "end"
                        );

                        editor.setSelectionRange(
                            removeStart,
                            removeStart
                        );

                        editor.focus();
                        return;
                    }
                }

                if (
                    current
                    &&
                    current.type !== tag.listType
                    &&
                    selectionStart === selectionEnd
                ) {
                    const marker =
                        tag.listType === "ordered"
                            ? "1."
                            : "-";

                    const childContent =
                        tag.listType === "links"
                            ? `[${tag.defaultText}](${tag.defaultUrl})`
                            : "";

                    const childIndent = current.indent + "    ";

                    if (current.text.trim().length === 0) {
                        const previousLineEnd = current.lineStart - 1;

                        if (previousLineEnd >= 0) {
                            const previousLineStart = this.getLineStart(
                                value,
                                previousLineEnd
                            );

                            const previousInfo = this.parseMarkdownListLine(
                                value.substring(
                                    previousLineStart,
                                    previousLineEnd
                                )
                            );

                            if (
                                previousInfo
                                &&
                                previousInfo.level === current.level
                            ) {
                                const replacement =
                                    `${childIndent}${marker} ${childContent}`;

                                editor.setRangeText(
                                    replacement,
                                    current.lineStart,
                                    current.lineEnd,
                                    "end"
                                );

                                const position =
                                    current.lineStart + replacement.length;

                                editor.setSelectionRange(
                                    position,
                                    position
                                );

                                this.renumberMarkdownListBlockAtPosition(
                                    editor,
                                    current.lineStart
                                );

                                editor.focus();
                                return;
                            }
                        }
                    }

                    const insertion =
                        `\n${childIndent}${marker} ${childContent}`;

                    editor.setRangeText(
                        insertion,
                        current.lineEnd,
                        current.lineEnd,
                        "end"
                    );

                    const position =
                        current.lineEnd + insertion.length;

                    editor.setSelectionRange(
                        position,
                        position
                    );

                    this.renumberMarkdownListBlockAtPosition(
                        editor,
                        current.lineStart
                    );

                    editor.focus();
                    return;
                }

                const blockStart = this.getLineStart(value, selectionStart);
                let effectiveEnd = selectionEnd;

                if (
                    effectiveEnd > blockStart
                    &&
                    value[effectiveEnd - 1] === "\n"
                ) {
                    effectiveEnd--;
                }

                const blockEnd = this.getLineEnd(value, effectiveEnd);
                const lines = value.substring(blockStart, blockEnd).split("\n");
                const parsed = lines.map(line => this.parseMarkdownListLine(line));

                const result = lines.map((line, index) => {
                    const info = parsed[index];
                    let indent;
                    let content;

                    if (info) {
                        indent = info.indent;
                        content = info.text;
                    } else {
                        const whitespace = line.match(/^[ \t]*/)?.[0] ?? "";
                        indent = whitespace.replaceAll("\t", "    ");
                        content = line.substring(whitespace.length);
                    }

                    if (tag.listType === "unordered") {
                        return `${indent}- ${content}`;
                    }

                    if (tag.listType === "links") {
                        const existingLink =
                            content.match(/^\[[^\]\n]*\]\([^)\n]*\)$/);

                        const linkContent = existingLink
                            ? content
                            : `[${content.trim().length > 0 ? content : tag.defaultText}](${tag.defaultUrl})`;

                        return `${indent}- ${linkContent}`;
                    }

                    return `${indent}1. ${content}`;
                });

                const normalized = this.renumberMarkdownListLines(result);

                editor.setRangeText(
                    normalized.join("\n"),
                    blockStart,
                    blockEnd,
                    "select"
                );

                this.renumberMarkdownListBlockAtPosition(
                    editor,
                    blockStart
                );

                editor.focus();
            }

            handleEnterOnListMarkdown(editor) {
                if (editor.selectionStart !== editor.selectionEnd) {
                    return false;
                }

                const info = this.getMarkdownListLineAtPosition(
                    editor.value,
                    editor.selectionStart
                );

                if (!info) {
                    return false;
                }

                if (info.type === "links") {
                    const emptyLink =
                        (info.linkText ?? "").trim().length === 0
                        &&
                        (info.linkUrl ?? "").trim().length === 0;

                    if (emptyLink) {
                        editor.setRangeText(
                            "",
                            info.lineStart,
                            info.lineEnd,
                            "end"
                        );

                        editor.setSelectionRange(
                            info.lineStart,
                            info.lineStart
                        );

                        editor.focus();
                        return true;
                    }

                    const linkTag = this.get("link");
                    const nextItem =
                        `\n${info.indent}- [${linkTag.defaultText}](${linkTag.defaultUrl})`;

                    editor.setRangeText(
                        nextItem,
                        editor.selectionStart,
                        editor.selectionEnd,
                        "end"
                    );

                    const linkStart =
                        editor.selectionStart
                        - linkTag.defaultUrl.length
                        - linkTag.defaultText.length
                        - 3;

                    const textStart =
                        linkStart + 1;

                    editor.setSelectionRange(
                        textStart,
                        textStart + linkTag.defaultText.length
                    );

                    editor.focus();
                    return true;
                }

                if (info.text.trim().length === 0) {
                    if (info.indent.length >= 4) {
                        const newIndent = info.indent.substring(
                            0,
                            info.indent.length - 4
                        );

                        const marker =
                            info.type === "unordered"
                                ? "-"
                                : "1.";

                        const replacement = `${newIndent}${marker} `;

                        editor.setRangeText(
                            replacement,
                            info.lineStart,
                            info.lineEnd,
                            "end"
                        );

                        const position = info.lineStart + replacement.length;
                        editor.setSelectionRange(position, position);

                        this.renumberMarkdownListBlockAtPosition(
                            editor,
                            info.lineStart
                        );
                    } else {
                        editor.setRangeText(
                            "",
                            info.lineStart,
                            info.lineEnd,
                            "end"
                        );

                        editor.setSelectionRange(
                            info.lineStart,
                            info.lineStart
                        );
                    }

                    editor.focus();
                    return true;
                }

                const marker =
                    info.type === "unordered"
                        ? "-"
                        : `${(info.number ?? 0) + 1}.`;

                editor.setRangeText(
                    `\n${info.indent}${marker} `,
                    editor.selectionStart,
                    editor.selectionEnd,
                    "end"
                );

                this.renumberMarkdownListBlockAtPosition(
                    editor,
                    info.lineStart
                );

                editor.focus();
                return true;
            }

            handleTabOnListMarkdown(editor, outdent = false) {
                const value = editor.value;
                const selectionStart = editor.selectionStart;
                const selectionEnd = editor.selectionEnd;
                const blockStart = this.getLineStart(value, selectionStart);
                let effectiveEnd = selectionEnd;

                if (
                    effectiveEnd > blockStart
                    &&
                    value[effectiveEnd - 1] === "\n"
                ) {
                    effectiveEnd--;
                }

                const blockEnd = this.getLineEnd(value, effectiveEnd);
                const lines = value.substring(blockStart, blockEnd).split("\n");

                if (!lines.some(line => this.parseMarkdownListLine(line))) {
                    return false;
                }

                const result = lines.map(line => {
                    const info = this.parseMarkdownListLine(line);

                    if (!info) {
                        return line;
                    }

                    if (outdent) {
                        const newIndent = info.indent.substring(
                            0,
                            Math.max(0, info.indent.length - 4)
                        );

                        return `${newIndent}${info.marker} ${info.text}`;
                    }

                    const marker =
                        info.type === "ordered"
                            ? "1."
                            : info.marker;

                    return `    ${info.indent}${marker} ${info.text}`;
                });

                editor.setRangeText(
                    result.join("\n"),
                    blockStart,
                    blockEnd,
                    "select"
                );

                this.renumberMarkdownListBlockAtPosition(
                    editor,
                    blockStart
                );

                editor.focus();
                return true;
            }

            renderListBlock(lines) {
                const items = lines
                    .map(line => this.parseMarkdownListLine(line))
                    .filter(Boolean);

                if (items.length === 0) {
                    return "";
                }

                const renderLevel = (startIndex, level) => {
                    let index = startIndex;
                    let html = "";

                    while (
                        index < items.length
                        &&
                        items[index].level === level
                    ) {
                        const type = items[index].type;
                        const listTag = type === "ordered" ? "ol" : "ul";
                        const startNumber = items[index].number ?? 1;
                        const startAttribute =
                            type === "ordered"
                            &&
                            level === 0
                            &&
                            startNumber !== 1
                                ? ` start="${startNumber}"`
                                : "";
                        const classAttribute =
                            type === "links"
                                ? ' class="link-list"'
                                : "";

                        html += `<${listTag}${classAttribute}${startAttribute}>`;

                        while (
                            index < items.length
                            &&
                            items[index].level === level
                            &&
                            items[index].type === type
                        ) {
                            const item = items[index];
                            const content =
                                item.text.length === 0
                                    ? "\u200B"
                                    : this.renderInlineMarkdown(item.text);

                            html += `<li>${content}`;
                            index++;

                            while (
                                index < items.length
                                &&
                                items[index].level > level
                            ) {
                                const nested = renderLevel(
                                    index,
                                    items[index].level
                                );

                                html += nested.html;
                                index = nested.index;
                            }

                            html += "</li>";
                        }

                        html += `</${listTag}>`;
                    }

                    return { html, index };
                };

                return renderLevel(0, items[0].level).html;
            }

            renderMarkdownLine(line) {
                if (line === "~~~") {
                    return '<hr contenteditable="false">';
                }

                const heading = line.match(/^(#{1,6})\s+(.*)$/);

                if (heading) {
                    const level = heading[1].length;
                    return `<h${level}>${this.renderInlineMarkdown(heading[2])}</h${level}>`;
                }

                const emptyHeading = line.match(/^(#{1,6})\s*$/);

                if (emptyHeading) {
                    const level = emptyHeading[1].length;
                    return `<h${level}>\u200B</h${level}>`;
                }

                if (line.length === 0) {
                    return "<div>\u200B</div>";
                }

                return "<div>" + this.renderInlineMarkdown(line) + "</div>";
            }

            /* TABLAS */

            splitMarkdownTableRow(line) {
                let content = line.trim();

                if (content.startsWith("|")) {
                    content = content.substring(1);
                }

                if (content.endsWith("|")) {
                    content = content.substring(0, content.length - 1);
                }

                return content
                    .split("|")
                    .map(cell => cell.trim());
            }

            isMarkdownTableSeparatorLine(line) {
                const cells = this.splitMarkdownTableRow(line);

                return (
                    cells.length > 0
                    &&
                    cells.every(cell => /^:?-{3,}:?$/.test(cell))
                );
            }

            isMarkdownTableRow(line) {
                const trimmed = line.trim();

                return (
                    trimmed.length > 0
                    &&
                    trimmed.includes("|")
                );
            }

            getMarkdownTableInfo(lines, index) {
                if (index < 0 || index >= lines.length) {
                    return null;
                }

                if (
                    index + 1 < lines.length
                    &&
                    this.isMarkdownTableRow(lines[index])
                    &&
                    !this.isMarkdownTableSeparatorLine(lines[index])
                    &&
                    this.isMarkdownTableSeparatorLine(lines[index + 1])
                ) {
                    const header = this.splitMarkdownTableRow(lines[index]);
                    const separator = this.splitMarkdownTableRow(lines[index + 1]);

                    if (
                        header.length === separator.length
                        &&
                        header.length > 0
                    ) {
                        return {
                            hasHeaders: true,
                            columnCount: header.length,
                            dataStartIndex: index + 2
                        };
                    }
                }

                if (
                    index + 1 < lines.length
                    &&
                    this.isMarkdownTableSeparatorLine(lines[index])
                    &&
                    this.isMarkdownTableRow(lines[index + 1])
                    &&
                    !this.isMarkdownTableSeparatorLine(lines[index + 1])
                ) {
                    const separator = this.splitMarkdownTableRow(lines[index]);
                    const firstRow = this.splitMarkdownTableRow(lines[index + 1]);

                    if (
                        separator.length === firstRow.length
                        &&
                        separator.length > 0
                    ) {
                        return {
                            hasHeaders: false,
                            columnCount: separator.length,
                            dataStartIndex: index + 1
                        };
                    }
                }

                return null;
            }

            isMarkdownTableStart(lines, index) {
                return this.getMarkdownTableInfo(lines, index) !== null;
            }

            getMarkdownTableEndIndex(lines, startIndex) {
                const info = this.getMarkdownTableInfo(lines, startIndex);

                if (!info) {
                    return startIndex;
                }

                let index = info.dataStartIndex;

                while (
                    index < lines.length
                    &&
                    this.isMarkdownTableRow(lines[index])
                    &&
                    !this.isMarkdownTableSeparatorLine(lines[index])
                ) {
                    const row = this.splitMarkdownTableRow(lines[index]);

                    if (row.length !== info.columnCount) {
                        break;
                    }

                    index++;
                }

                return index;
            }

            renderTableCellContent(cell) {
                const rawSegments = cell.split(/<br\s*\/?>/i);

                const parseSegment = raw => {
                    let content = raw.trim();
                    const wrappers = [];
                    let changed = true;
                    let guard = 0;

                    while (changed && guard < 10) {
                        changed = false;
                        guard++;

                        if (
                            content.length >= 4
                            && content.startsWith("==")
                            && content.endsWith("==")
                        ) {
                            wrappers.push("highlight");
                            content = content.substring(2, content.length - 2);
                            changed = true;
                            continue;
                        }

                        if (/^>\s?/.test(content)) {
                            wrappers.push("quote");
                            content = content.replace(/^>\s?/, "");
                            changed = true;
                        }
                    }

                    return { wrappers, content };
                };

                const segments = rawSegments.map(parseSegment);

                if (
                    segments.length === 1
                    && segments[0].wrappers.length === 0
                ) {
                    return this.renderInlineMarkdown(cell);
                }

                const html = [];
                let openWrappers = [];

                const classForWrapper = type => (
                    type === "quote"
                        ? "quote-block"
                        : "highlight-block"
                );

                for (const segment of segments) {
                    let common = 0;

                    while (
                        common < openWrappers.length
                        && common < segment.wrappers.length
                        && openWrappers[common] === segment.wrappers[common]
                    ) {
                        common++;
                    }

                    for (
                        let index = openWrappers.length - 1;
                        index >= common;
                        index--
                    ) {
                        html.push("</div>");
                    }

                    for (
                        let index = common;
                        index < segment.wrappers.length;
                        index++
                    ) {
                        html.push(
                            '<div class="'
                            + classForWrapper(segment.wrappers[index])
                            + '">'
                        );
                    }

                    html.push(
                        "<div>"
                        + (
                            segment.content.length > 0
                                ? this.renderInlineMarkdown(segment.content)
                                : "&#8203;"
                        )
                        + "</div>"
                    );

                    openWrappers = segment.wrappers;
                }

                for (
                    let index = openWrappers.length - 1;
                    index >= 0;
                    index--
                ) {
                    html.push("</div>");
                }

                return html.join("");
            }

            renderTableBlock(lines) {
                const info = this.getMarkdownTableInfo(lines, 0);

                if (!info) {
                    return lines.map(line => this.renderMarkdownLine(line)).join("");
                }

                const bodyRows = lines
                    .slice(info.hasHeaders ? 2 : 1)
                    .map(line => this.splitMarkdownTableRow(line));

                let html = `<table data-has-headers="${info.hasHeaders ? "true" : "false"}">`;

                if (info.hasHeaders) {
                    const header = this.splitMarkdownTableRow(lines[0]);
                    html += "<thead><tr>";

                    for (const cell of header) {
                        html += "<th>" + this.renderTableCellContent(cell) + "</th>";
                    }

                    html += "</tr></thead>";
                }

                html += "<tbody>";

                for (const row of bodyRows) {
                    html += "<tr>";

                    for (const cell of row) {
                        html += "<td>" + this.renderTableCellContent(cell) + "</td>";
                    }

                    html += "</tr>";
                }

                html += "</tbody></table>";
                return html;
            }

            findMarkdownTableRange(text, position) {
                const lines = text.split("\n");
                const starts = [];
                let offset = 0;

                for (const line of lines) {
                    starts.push(offset);
                    offset += line.length + 1;
                }

                for (let index = 0; index < lines.length; index++) {
                    if (!this.isMarkdownTableStart(lines, index)) {
                        continue;
                    }

                    const endIndex = this.getMarkdownTableEndIndex(
                        lines,
                        index
                    );

                    const openStart = starts[index];
                    const closeEnd =
                        endIndex < lines.length
                            ? starts[endIndex] - 1
                            : text.length;

                    if (
                        position >= openStart
                        &&
                        position <= closeEnd
                    ) {
                        return {
                            openStart,
                            closeEnd,
                            startIndex: index,
                            endIndex
                        };
                    }

                    index = endIndex - 1;
                }

                return null;
            }

            isTableActiveInMarkdown(tag, editor) {
                return this.findMarkdownTableRange(
                    editor.value,
                    editor.selectionStart
                ) !== null;
            }

            buildMarkdownTable(columnCount, rowCount, hasHeaders) {
                const columns = Math.max(1, Math.min(20, columnCount));
                const rows = Math.max(1, Math.min(50, rowCount));
                const lines = [];

                if (hasHeaders) {
                    lines.push(
                        "| "
                        + Array.from(
                            { length: columns },
                            (_, index) => `Columna ${index + 1}`
                        ).join(" | ")
                        + " |"
                    );
                }

                lines.push(
                    "| "
                    + Array.from(
                        { length: columns },
                        () => "---"
                    ).join(" | ")
                    + " |"
                );

                let cellNumber = 1;

                for (let row = 0; row < rows; row++) {
                    lines.push(
                        "| "
                        + Array.from(
                            { length: columns },
                            () => `Celda ${cellNumber++}`
                        ).join(" | ")
                        + " |"
                    );
                }

                return lines.join("\n");
            }

            toggleTableToMarkdown(tag, editor, options = null) {
                const existing = this.findMarkdownTableRange(
                    editor.value,
                    editor.selectionStart
                );

                if (existing) {
                    let start = existing.openStart;
                    let end = existing.closeEnd;

                    if (
                        end < editor.value.length
                        &&
                        editor.value[end] === "\n"
                    ) {
                        end++;
                    } else if (
                        start > 0
                        &&
                        editor.value[start - 1] === "\n"
                    ) {
                        start--;
                    }

                    editor.setRangeText("", start, end, "end");
                    editor.setSelectionRange(start, start);
                    editor.focus();
                    return;
                }

                if (!options) {
                    editor.focus();
                    return;
                }

                const markdown = this.buildMarkdownTable(
                    options.columns,
                    options.rows,
                    options.hasHeaders
                );

                const value = editor.value;
                const position = editor.selectionStart;
                const lineStart = this.getLineStart(value, position);
                const lineEnd = this.getLineEnd(value, position);
                const line = value.substring(lineStart, lineEnd);
                const prefixLength = line.trim().length > 0
                    ? line.length + 1
                    : 0;

                const replacement = line.trim().length > 0
                    ? line + "\n" + markdown
                    : markdown;

                editor.setRangeText(
                    replacement,
                    lineStart,
                    lineEnd,
                    "end"
                );

                const firstText = options.hasHeaders
                    ? "Columna 1"
                    : "Celda 1";

                const firstTextStart =
                    lineStart
                    +
                    prefixLength
                    +
                    markdown.indexOf(firstText);

                editor.setSelectionRange(
                    firstTextStart,
                    firstTextStart + firstText.length
                );

                editor.focus();
            }

            getTableAncestor(node, editor) {
                let current = node.nodeType === Node.ELEMENT_NODE
                    ? node
                    : node.parentElement;

                while (current && current !== editor) {
                    if (current.tagName === "TABLE") {
                        return current;
                    }

                    current = current.parentElement;
                }

                return null;
            }

            createFormattedTable(columnCount, rowCount, hasHeaders) {
                const columns = Math.max(1, Math.min(20, columnCount));
                const rows = Math.max(1, Math.min(50, rowCount));
                const table = document.createElement("table");
                const tbody = document.createElement("tbody");
                let firstTextNode = null;
                let cellNumber = 1;

                table.dataset.hasHeaders = hasHeaders ? "true" : "false";

                if (hasHeaders) {
                    const thead = document.createElement("thead");
                    const headerRow = document.createElement("tr");

                    for (let column = 0; column < columns; column++) {
                        const header = document.createElement("th");
                        const textNode = document.createTextNode(
                            `Columna ${column + 1}`
                        );

                        header.append(textNode);
                        headerRow.append(header);

                        if (!firstTextNode) {
                            firstTextNode = textNode;
                        }
                    }

                    thead.append(headerRow);
                    table.append(thead);
                }

                for (let row = 0; row < rows; row++) {
                    const bodyRow = document.createElement("tr");

                    for (let column = 0; column < columns; column++) {
                        const cell = document.createElement("td");
                        const textNode = document.createTextNode(
                            `Celda ${cellNumber++}`
                        );

                        cell.append(textNode);
                        bodyRow.append(cell);

                        if (!firstTextNode) {
                            firstTextNode = textNode;
                        }
                    }

                    tbody.append(bodyRow);
                }

                table.append(tbody);

                return {
                    table,
                    firstTextNode
                };
            }

            toggleTableToFormatted(tag, editor, options = null) {
                const selection = window.getSelection();

                if (!selection || selection.rangeCount === 0) {
                    return;
                }

                const range = selection.getRangeAt(0);
                const existing = this.getTableAncestor(
                    range.startContainer,
                    editor
                );

                if (existing) {
                    const empty = this.createEmptyEditableBlock();
                    existing.replaceWith(empty.block);
                    this.placeCaretInTextNode(empty.textNode, 1);
                    editor.focus();
                    return;
                }

                if (!options) {
                    editor.focus();
                    return;
                }

                const created = this.createFormattedTable(
                    options.columns,
                    options.rows,
                    options.hasHeaders
                );

                const topBlock = this.getTopLevelBlock(
                    range.startContainer,
                    editor
                );

                if (
                    topBlock
                    &&
                    this.isEmptyEditableBlock(topBlock)
                ) {
                    topBlock.replaceWith(created.table);
                } else if (topBlock) {
                    topBlock.after(created.table);
                } else {
                    editor.append(created.table);
                }

                const empty = this.createEmptyEditableBlock();
                created.table.after(empty.block);

                this.placeCaretInTextNode(
                    created.firstTextNode,
                    0
                );

                editor.focus();
            }

            /* CÓDIGO DE PROGRAMACIÓN */

            getCodeBlockRanges(text) {
                const ranges = [];
                const lines = text.split("\n");
                const starts = [];
                let offset = 0;

                for (const line of lines) {
                    starts.push(offset);
                    offset += line.length + 1;
                }

                for (let index = 0; index < lines.length; index++) {
                    if (!/^```[^\n]*$/.test(lines[index])) {
                        continue;
                    }

                    const openStart = starts[index];
                    const openEnd = openStart + lines[index].length;
                    let closeIndex = -1;

                    for (let search = index + 1; search < lines.length; search++) {
                        if (lines[search].trim() === "```") {
                            closeIndex = search;
                            break;
                        }
                    }

                    if (closeIndex === -1) {
                        continue;
                    }

                    const contentStart =
                        openEnd < text.length && text[openEnd] === "\n"
                            ? openEnd + 1
                            : openEnd;

                    const closeStart = starts[closeIndex];
                    const contentEnd =
                        closeStart > 0 && text[closeStart - 1] === "\n"
                            ? closeStart - 1
                            : closeStart;

                    const closeEnd = closeStart + lines[closeIndex].length;

                    ranges.push({
                        openStart,
                        openEnd,
                        contentStart,
                        contentEnd,
                        closeStart,
                        closeEnd,
                        startLineIndex: index,
                        endLineIndex: closeIndex
                    });

                    index = closeIndex;
                }

                return ranges;
            }

            findCodeBlockRange(text, start, end = start) {
                for (const range of this.getCodeBlockRanges(text)) {
                    if (
                        start >= range.openStart
                        &&
                        end <= range.closeEnd
                    ) {
                        return range;
                    }
                }

                return null;
            }

            isCodeActiveInMarkdown(tag, editor) {
                return this.findCodeBlockRange(
                    editor.value,
                    editor.selectionStart,
                    editor.selectionEnd
                ) !== null;
            }

            toggleCodeToMarkdown(tag, editor) {
                const value = editor.value;
                const selectionStart = editor.selectionStart;
                const selectionEnd = editor.selectionEnd;

                const existing = this.findCodeBlockRange(
                    value,
                    selectionStart,
                    selectionEnd
                );

                if (existing) {
                    const code = value.substring(
                        existing.contentStart,
                        existing.contentEnd
                    );

                    editor.setRangeText(
                        code,
                        existing.openStart,
                        existing.closeEnd,
                        "end"
                    );

                    editor.setSelectionRange(
                        existing.openStart,
                        existing.openStart + code.length
                    );

                    editor.focus();
                    return;
                }

                const selected = value.substring(
                    selectionStart,
                    selectionEnd
                );

                const prefix =
                    selectionStart > 0
                    &&
                    value[selectionStart - 1] !== "\n"
                        ? "\n"
                        : "";

                const suffix =
                    selectionEnd < value.length
                    &&
                    value[selectionEnd] !== "\n"
                        ? "\n"
                        : "";

                const markdown =
                    prefix
                    + "```\n"
                    + selected
                    + "\n```"
                    + suffix;

                editor.setRangeText(
                    markdown,
                    selectionStart,
                    selectionEnd,
                    "end"
                );

                const contentStart =
                    selectionStart
                    + prefix.length
                    + 4;

                if (selected.length > 0) {
                    editor.setSelectionRange(
                        contentStart,
                        contentStart + selected.length
                    );
                } else {
                    editor.setSelectionRange(
                        contentStart,
                        contentStart
                    );
                }

                editor.focus();
            }

            renderCodeBlock(lines, startIndex, endIndex) {
                const codeLines = lines.slice(startIndex + 1, endIndex);

                const content = codeLines.length > 0
                    ? codeLines.map(line => (
                        "<div>"
                        + (line.length > 0 ? this.escapeHtml(line) : "\u200B")
                        + "</div>"
                    )).join("")
                    : "<div>\u200B</div>";

                return (
                    '<div class="code-block">'
                    + content
                    + "</div>"
                );
            }

            getCodeAncestor(node, editor) {
                return this.getClassAncestor(
                    node,
                    "code-block",
                    editor
                );
            }

            createFormattedCodeBlock(text = "") {
                const block = document.createElement("div");
                block.classList.add("code-block");

                const lines = text.length > 0
                    ? text.split("\n")
                    : [""];

                const lineBlocks = [];

                for (const line of lines) {
                    const lineBlock = document.createElement("div");
                    const textNode = document.createTextNode(
                        line.length > 0 ? line : "\u200B"
                    );

                    lineBlock.append(textNode);
                    block.append(lineBlock);
                    lineBlocks.push({
                        block: lineBlock,
                        textNode
                    });
                }

                return {
                    pre: block,
                    code: block,
                    textNode: lineBlocks[0].textNode,
                    lineBlocks
                };
            }

            replaceCodeBlockWithPlainText(pre) {
                const lines = [...pre.children].map(line =>
                    (line.textContent ?? "").replaceAll("\u200B", "")
                );

                const blocks = [];

                if (lines.length === 0) {
                    const empty = this.createEmptyEditableBlock();
                    pre.replaceWith(empty.block);
                    this.placeCaretInTextNode(empty.textNode, 1);
                    return;
                }

                for (const line of lines) {
                    const block = document.createElement("div");
                    const textNode = document.createTextNode(
                        line.length > 0 ? line : "\u200B"
                    );

                    block.append(textNode);
                    blocks.push({ block, textNode });
                }

                pre.replaceWith(...blocks.map(item => item.block));
                this.placeCaretInTextNode(
                    blocks[0].textNode,
                    blocks[0].textNode.textContent.startsWith("\u200B") ? 1 : 0
                );
            }

            toggleCodeToFormatted(tag, editor) {
                const selection = window.getSelection();

                if (!selection || selection.rangeCount === 0) {
                    return;
                }

                const range = selection.getRangeAt(0);
                const existing = this.getCodeAncestor(
                    range.startContainer,
                    editor
                );

                if (existing) {
                    this.replaceCodeBlockWithPlainText(existing);
                    editor.focus();
                    return;
                }

                const startCell = this.getTableCellAncestor(
                    range.startContainer,
                    editor
                );

                const endCell = this.getTableCellAncestor(
                    range.endContainer,
                    editor
                );

                if (
                    (startCell || endCell)
                    &&
                    (!startCell || !endCell || startCell !== endCell)
                ) {
                    editor.focus();
                    return;
                }

                const context = startCell || editor;

                const selectedText = range.collapsed
                    ? ""
                    : range.toString();

                const created = this.createFormattedCodeBlock(
                    selectedText
                );

                const topBlock = this.getDirectChild(
                    range.startContainer,
                    context
                );

                if (!range.collapsed) {
                    range.deleteContents();
                }

                if (
                    topBlock
                    &&
                    this.isEmptyEditableBlock(topBlock)
                ) {
                    topBlock.replaceWith(created.pre);
                } else if (topBlock) {
                    topBlock.after(created.pre);
                } else {
                    context.append(created.pre);
                }

                const empty = this.createEmptyEditableBlock();
                created.pre.after(empty.block);

                if (selectedText.length > 0) {
                    const newRange = document.createRange();
                    newRange.selectNodeContents(created.code);
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                } else {
                    this.placeCaretInTextNode(created.textNode, 1);
                }

                editor.focus();
            }

            handleEnterOnCodeMarkdown(editor) {
                if (
                    editor.selectionStart !==
                    editor.selectionEnd
                ) {
                    return false;
                }

                const existing = this.findCodeBlockRange(
                    editor.value,
                    editor.selectionStart,
                    editor.selectionEnd
                );

                if (!existing) {
                    return false;
                }

                const position = editor.selectionStart;
                const lineStart = this.getLineStart(
                    editor.value,
                    position
                );
                const lineEnd = this.getLineEnd(
                    editor.value,
                    position
                );

                if (
                    lineStart < existing.contentStart
                    ||
                    lineEnd > existing.contentEnd
                ) {
                    return false;
                }

                const currentLine = editor.value.substring(
                    lineStart,
                    lineEnd
                );

                const currentLineIsEmpty =
                    currentLine.trim().length === 0;

                const isLastCodeLine =
                    lineEnd === existing.contentEnd;

                let previousLineIsEmpty = false;
                let previousLineStart = -1;
                let previousLineEnd = -1;

                if (lineStart > existing.contentStart) {
                    previousLineEnd = lineStart - 1;
                    previousLineStart = this.getLineStart(
                        editor.value,
                        previousLineEnd
                    );

                    const previousLine = editor.value.substring(
                        previousLineStart,
                        previousLineEnd
                    );

                    previousLineIsEmpty =
                        previousLine.trim().length === 0;
                }

                /*
                 * Igual que Texto citado:
                 * una línea vacía está permitida dentro del bloque.
                 * Solo salimos cuando la línea actual está vacía,
                 * la anterior también está vacía y estamos al final
                 * del contenido del bloque de código.
                 */
                if (
                    currentLineIsEmpty
                    &&
                    previousLineIsEmpty
                    &&
                    isLastCodeLine
                ) {
                    const removeStart =
                        previousLineStart > existing.contentStart
                            ? previousLineStart - 1
                            : previousLineStart;

                    editor.setRangeText(
                        "",
                        removeStart,
                        lineEnd,
                        "end"
                    );

                    const updatedBlock = this.findCodeBlockRange(
                        editor.value,
                        existing.openStart
                    );

                    if (!updatedBlock) {
                        return false;
                    }

                    if (
                        updatedBlock.closeEnd >= editor.value.length
                        ||
                        editor.value[updatedBlock.closeEnd] !== "\n"
                    ) {
                        editor.setRangeText(
                            "\n",
                            updatedBlock.closeEnd,
                            updatedBlock.closeEnd,
                            "end"
                        );
                    }

                    const outsidePosition =
                        updatedBlock.closeEnd + 1;

                    editor.setSelectionRange(
                        outsidePosition,
                        outsidePosition
                    );

                    editor.focus();
                    return true;
                }

                /*
                 * Enter normal dentro del código:
                 * siempre crea un salto de línea.
                 */
                editor.setRangeText(
                    "\n",
                    position,
                    position,
                    "end"
                );

                editor.setSelectionRange(
                    position + 1,
                    position + 1
                );

                editor.focus();
                return true;
            }

            handleEnterOnCodeFormatted(editor) {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return false;

                const range = selection.getRangeAt(0);
                if (!range.collapsed) return false;

                const codeBlock = this.getCodeAncestor(
                    range.startContainer,
                    editor
                );

                if (!codeBlock) return false;

                let currentBlock = this.getDirectChild(
                    range.startContainer,
                    codeBlock
                );

                if (!currentBlock && range.startContainer === codeBlock) {
                    if (range.startOffset < codeBlock.childNodes.length) {
                        currentBlock = codeBlock.childNodes[range.startOffset];
                    } else if (range.startOffset > 0) {
                        currentBlock = codeBlock.childNodes[range.startOffset - 1];
                    }
                }

                if (!this.isEmptyEditableBlock(currentBlock)) {
                    return false;
                }

                const previousBlock =
                    currentBlock.previousElementSibling;

                if (!this.isEmptyEditableBlock(previousBlock)) {
                    return false;
                }

                /*
                 * Igual que Texto citado: cuando existen dos líneas
                 * vacías consecutivas y pulsamos Enter en la segunda,
                 * eliminamos ambas y salimos del bloque.
                 */
                currentBlock.remove();
                previousBlock.remove();

                const empty = this.createEmptyEditableBlock();
                codeBlock.after(empty.block);
                this.placeCaretInTextNode(empty.textNode, 1);
                editor.focus();
                return true;
            }

            handleTabOnCodeFormatted(editor, outdent = false) {
                const selection = window.getSelection();

                if (!selection || selection.rangeCount === 0) {
                    return false;
                }

                const range = selection.getRangeAt(0);
                const codeBlock = this.getCodeAncestor(
                    range.startContainer,
                    editor
                );

                if (!codeBlock) {
                    return false;
                }

                if (outdent) {
                    editor.focus();
                    return true;
                }

                range.deleteContents();
                const spaces = document.createTextNode("    ");
                range.insertNode(spaces);
                this.placeCaretInTextNode(spaces, 4);
                editor.focus();
                return true;
            }

            /* NOTAS AL PIE */

            getFootnoteDefinitions(text) {
                const definitions = [];
                const expression = /^\[\^([^\]\n]+)\]:[ \t]*(.*)$/gm;
                let match;

                while ((match = expression.exec(text)) !== null) {
                    definitions.push({
                        id: match[1],
                        text: match[2],
                        openStart: match.index,
                        closeEnd: match.index + match[0].length
                    });
                }

                return definitions;
            }

            getFootnoteReferences(text) {
                const references = [];
                const expression = /\[\^([^\]\n]+)\](?!:)/g;
                let match;

                while ((match = expression.exec(text)) !== null) {
                    references.push({
                        id: match[1],
                        openStart: match.index,
                        closeEnd: match.index + match[0].length
                    });
                }

                return references;
            }

            getNextFootnoteId(text) {
                const ids = [
                    ...this.getFootnoteDefinitions(text),
                    ...this.getFootnoteReferences(text)
                ]
                    .map(item => Number.parseInt(item.id, 10))
                    .filter(Number.isFinite);

                return ids.length === 0
                    ? "1"
                    : String(Math.max(...ids) + 1);
            }

            findFootnoteAtPosition(text, start, end = start) {
                for (const reference of this.getFootnoteReferences(text)) {
                    if (
                        start >= reference.openStart
                        &&
                        end <= reference.closeEnd
                    ) {
                        return {
                            type: "reference",
                            ...reference
                        };
                    }
                }

                for (const definition of this.getFootnoteDefinitions(text)) {
                    if (
                        start >= definition.openStart
                        &&
                        end <= definition.closeEnd
                    ) {
                        return {
                            type: "definition",
                            ...definition
                        };
                    }
                }

                return null;
            }

            isFootnoteActiveInMarkdown(tag, editor) {
                return this.findFootnoteAtPosition(
                    editor.value,
                    editor.selectionStart,
                    editor.selectionEnd
                ) !== null;
            }

            removeFootnoteFromMarkdown(editor) {
                const selected = this.findFootnoteAtPosition(
                    editor.value,
                    editor.selectionStart,
                    editor.selectionEnd
                );

                if (!selected) {
                    return false;
                }

                const id = selected.id;
                const value = editor.value;
                const ranges = [
                    ...this.getFootnoteReferences(value)
                        .filter(item => item.id === id),
                    ...this.getFootnoteDefinitions(value)
                        .filter(item => item.id === id)
                ].sort((a, b) => b.openStart - a.openStart);

                let newValue = value;
                let caret = selected.openStart;

                for (const range of ranges) {
                    let start = range.openStart;
                    let end = range.closeEnd;

                    if (
                        this.getFootnoteDefinitions(value).some(definition => (
                            definition.id === id
                            &&
                            definition.openStart === range.openStart
                        ))
                    ) {
                        if (start > 0 && value[start - 1] === "\n") {
                            start--;
                        } else if (end < value.length && value[end] === "\n") {
                            end++;
                        }
                    }

                    newValue = newValue.substring(0, start) + newValue.substring(end);
                    caret = Math.min(caret, start);
                }

                newValue = newValue.replace(/\n{3,}/g, "\n\n");
                editor.value = newValue;
                caret = Math.min(caret, newValue.length);
                editor.setSelectionRange(caret, caret);
                editor.focus();
                return true;
            }

            getFootnoteElement(node, editor) {
                let current = node?.nodeType === Node.ELEMENT_NODE
                    ? node
                    : node?.parentElement;

                while (current && current !== editor) {
                    if (
                        current.classList?.contains("footnote-reference")
                        ||
                        current.classList?.contains("footnote-definition")
                    ) {
                        return current;
                    }

                    current = current.parentElement;
                }

                return null;
            }

            getSelectedFootnoteElement(editor) {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return null;

                const range = selection.getRangeAt(0);
                const direct = this.getFootnoteElement(
                    range.startContainer,
                    editor
                );

                if (direct) return direct;

                if (range.startContainer.nodeType === Node.ELEMENT_NODE) {
                    const container = range.startContainer;
                    const at = container.childNodes[range.startOffset];
                    const previous = range.startOffset > 0
                        ? container.childNodes[range.startOffset - 1]
                        : null;

                    return this.getFootnoteElement(at, editor)
                        ?? this.getFootnoteElement(previous, editor);
                }

                return null;
            }

            removeFootnoteFromFormatted(editor) {
                const selected = this.getSelectedFootnoteElement(editor);
                if (!selected) return false;

                const id = selected.dataset.footnoteId;
                if (!id) return false;

                const references = [...editor.querySelectorAll(
                    ".footnote-reference"
                )].filter(element => (
                    element.dataset.footnoteId === id
                ));

                const definitions = [...editor.querySelectorAll(
                    ".footnote-definition"
                )].filter(element => (
                    element.dataset.footnoteId === id
                ));

                const caretText = document.createTextNode("\u200B");
                const reference = references[0] ?? null;

                if (reference?.isConnected) {
                    reference.replaceWith(caretText);
                }

                for (const otherReference of references.slice(1)) {
                    if (otherReference.isConnected) {
                        otherReference.remove();
                    }
                }

                for (const definition of definitions) {
                    if (definition.isConnected) {
                        definition.remove();
                    }
                }

                const footnotesSection = editor.querySelector(
                    ":scope > .footnotes-section"
                );

                if (
                    footnotesSection
                    &&
                    !footnotesSection.querySelector(
                        ".footnote-definition"
                    )
                ) {
                    footnotesSection.remove();
                }

                if (caretText.isConnected) {
                    this.placeCaretInTextNode(caretText, 1);
                } else {
                    editor.focus();
                }

                return true;
            }

            /* TEXTO CITADO */

            isQuoteMarkdownLine(line) {
                return /^>\s?/.test(line);
            }

            stripQuoteMarkdownLine(line) {
                return line.replace(/^>\s?/, "");
            }

            renderQuoteContent(lines) {
                return this.renderMarkdownLines(
                    lines.map(line => this.stripQuoteMarkdownLine(line))
                );
            }

            getHighlightMarkdownOpeningCount(line) {
                let position = 0;
                let count = 0;

                while (position < line.length) {
                    if (line.startsWith("==", position)) {
                        count++;
                        position += 2;
                        continue;
                    }

                    const quote = line.substring(position).match(/^>\s?/);

                    if (quote) {
                        position += quote[0].length;
                        continue;
                    }

                    break;
                }

                return count;
            }

            getHighlightMarkdownClosingCount(line) {
                let position = line.length;
                let count = 0;

                while (
                    position >= 2
                    && line.substring(position - 2, position) === "=="
                ) {
                    count++;
                    position -= 2;
                }

                return count;
            }

            findHighlightMarkdownBlockEnd(lines, startIndex) {
                let depth = 0;

                for (let index = startIndex; index < lines.length; index++) {
                    const line = lines[index];
                    let openings = this.getHighlightMarkdownOpeningCount(line);
                    const closings = this.getHighlightMarkdownClosingCount(line);
                    const markerOnly = /^(?:>\s?)*(?:==)+$/.test(line);

                    if (markerOnly && depth > 0) {
                        openings = 0;
                    }

                    depth += openings;
                    depth -= closings;

                    if (depth <= 0) {
                        return index;
                    }
                }

                return -1;
            }

            renderMarkdownLines(lines) {
                const html = [];

                for (let index = 0; index < lines.length; index++) {
                    const line = lines[index];

                    if (/^```[^\n]*$/.test(line)) {
                        let closeIndex = -1;

                        for (let search = index + 1; search < lines.length; search++) {
                            if (lines[search].trim() === "```") {
                                closeIndex = search;
                                break;
                            }
                        }

                        if (closeIndex !== -1) {
                            html.push(
                                this.renderCodeBlock(
                                    lines,
                                    index,
                                    closeIndex
                                )
                            );

                            index = closeIndex;
                            continue;
                        }
                    }

                    const footnoteDefinition = line.match(
                        /^\[\^([^\]\n]+)\]:[ \t]*(.*)$/
                    );

                    if (footnoteDefinition) {
                        const id = footnoteDefinition[1];
                        const noteText = footnoteDefinition[2];

                        html.push(
                            '<div class="footnote-definition"' +
                            ' data-footnote-id="' +
                            this.escapeAttribute(id) +
                            '">' +
                            '<span class="footnote-number">[' +
                            this.escapeHtml(id) +
                            ']</span>' +
                            '<span class="footnote-text">' +
                            this.renderInlineMarkdown(noteText) +
                            '</span></div>'
                        );

                        continue;
                    }

                    if (this.isMarkdownTableStart(lines, index)) {
                        const endIndex = this.getMarkdownTableEndIndex(
                            lines,
                            index
                        );

                        html.push(
                            this.renderTableBlock(
                                lines.slice(index, endIndex)
                            )
                        );

                        index = endIndex - 1;
                        continue;
                    }

                    if (line.startsWith("==")) {
                        const closeIndex =
                            this.findHighlightMarkdownBlockEnd(
                                lines,
                                index
                            );

                        if (closeIndex !== -1) {
                            const contentLines = [];

                            if (closeIndex === index) {
                                contentLines.push(
                                    line.substring(2, line.length - 2)
                                );
                            } else {
                                contentLines.push(line.substring(2));

                                for (
                                    let contentIndex = index + 1;
                                    contentIndex < closeIndex;
                                    contentIndex++
                                ) {
                                    contentLines.push(lines[contentIndex]);
                                }

                                contentLines.push(
                                    lines[closeIndex].substring(
                                        0,
                                        lines[closeIndex].length - 2
                                    )
                                );
                            }

                            html.push(
                                '<div class="highlight-block">' +
                                this.renderHighlightContent(contentLines) +
                                "</div>"
                            );

                            index = closeIndex;
                            continue;
                        }
                    }

                    if (this.parseMarkdownListLine(line)) {
                        const listLines = [];
                        let listIndex = index;

                        while (
                            listIndex < lines.length
                            &&
                            this.parseMarkdownListLine(lines[listIndex])
                        ) {
                            listLines.push(lines[listIndex]);
                            listIndex++;
                        }

                        html.push(this.renderListBlock(listLines));
                        index = listIndex - 1;
                        continue;
                    }

                    if (this.isQuoteMarkdownLine(line)) {
                        const quoteLines = [];
                        let quoteIndex = index;

                        while (
                            quoteIndex < lines.length &&
                            this.isQuoteMarkdownLine(lines[quoteIndex])
                        ) {
                            quoteLines.push(lines[quoteIndex]);
                            quoteIndex++;
                        }

                        html.push(
                            '<div class="quote-block">' +
                            this.renderQuoteContent(quoteLines) +
                            "</div>"
                        );

                        index = quoteIndex - 1;
                        continue;
                    }

                    html.push(this.renderMarkdownLine(line));
                }

                return html.join("");
            }

            renderHighlightContent(lines) {
                return this.renderMarkdownLines(lines);
            }

            /* MARKDOWN -> HTML */

            markdownToHtml(markdown) {
                const normalized = this.normalizeSeparatorText(
                    markdown.replaceAll("\r\n", "\n")
                );

                const lines = normalized.split("\n");
                const html = [];
                const footnoteDefinitions = [];

                for (let index = 0; index < lines.length; index++) {
                    const line = lines[index];

                    if (/^```[^\n]*$/.test(line)) {
                        let closeIndex = -1;

                        for (let search = index + 1; search < lines.length; search++) {
                            if (lines[search].trim() === "```") {
                                closeIndex = search;
                                break;
                            }
                        }

                        if (closeIndex !== -1) {
                            html.push(
                                this.renderCodeBlock(
                                    lines,
                                    index,
                                    closeIndex
                                )
                            );

                            index = closeIndex;
                            continue;
                        }
                    }

                    const footnoteDefinition = line.match(
                        /^\[\^([^\]\n]+)\]:[ \t]*(.*)$/
                    );

                    if (footnoteDefinition) {
                        const id = footnoteDefinition[1];
                        const noteText = footnoteDefinition[2];

                        footnoteDefinitions.push(
                            '<div class="footnote-definition"' +
                            ' data-footnote-id="' +
                            this.escapeAttribute(id) +
                            '">' +
                            '<span class="footnote-number" contenteditable="false">[' +
                            this.escapeHtml(id) +
                            ']</span>' +
                            '<span class="footnote-text">' +
                            this.renderInlineMarkdown(noteText) +
                            '</span></div>'
                        );

                        continue;
                    }

                    if (this.isMarkdownTableStart(lines, index)) {
                        const endIndex = this.getMarkdownTableEndIndex(
                            lines,
                            index
                        );

                        html.push(
                            this.renderTableBlock(
                                lines.slice(index, endIndex)
                            )
                        );

                        index = endIndex - 1;
                        continue;
                    }

                    if (line.startsWith("==")) {
                        const closeIndex =
                            this.findHighlightMarkdownBlockEnd(
                                lines,
                                index
                            );

                        if (closeIndex !== -1) {
                            const contentLines = [];

                            if (closeIndex === index) {
                                contentLines.push(
                                    line.substring(2, line.length - 2)
                                );
                            } else {
                                contentLines.push(line.substring(2));

                                for (
                                    let contentIndex = index + 1;
