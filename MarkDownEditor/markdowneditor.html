        function getMarkdownAsHtmlForSave() {
            const markdown =
                getMarkdownForSave();

            const body =
                '<main class="document">' +
                '<pre class="markdown-source">' +
                markdownController.escapeHtml(
                    markdown
                ) +
                "</pre>" +
                "</main>";

            return buildStandaloneHtmlDocument(
                body,
                "markdown"
            );
        }

        function getFormattedAsHtmlForSave() {
            const markdown =
                getMarkdownForSave();

            const temporary =
                document.createElement(
                    "div"
                );

            temporary.innerHTML =
                markdownController.markdownToHtml(
                    markdown
                );

            for (
                const editPoint
                of temporary.querySelectorAll(
                    ".footnote-edit-point"
                )
            ) {
                editPoint.remove();
            }

            for (
                const element
                of temporary.querySelectorAll(
                    "[contenteditable]"
                )
            ) {
                element.removeAttribute(
                    "contenteditable"
                );
            }

            for (
                const image
                of temporary.querySelectorAll(
                    "img[data-markdown-alt]"
                )
            ) {
                image.setAttribute(
                    "alt",
                    image.dataset.markdownAlt ?? ""
                );

                delete image.dataset.markdownAlt;
            }

            for (
                const table
                of temporary.querySelectorAll(
                    "table[data-has-headers]"
                )
            ) {
                delete table.dataset.hasHeaders;
            }

            const body =
                '<main class="document">' +
                temporary.innerHTML +
                "</main>";

            return buildStandaloneHtmlDocument(
                body,
                "formatted"
            );
        }

        function getHtmlForSave(
            contentTypeName
        ) {
            if (
                contentTypeName ===
                "markdown"
            ) {
                return getMarkdownAsHtmlForSave();
            }

            if (
                contentTypeName ===
                "formatted"
            ) {
                return getFormattedAsHtmlForSave();
            }

            return "";
        }

        /* ===== GENERACIÓN DOCX =====
         * El DOCX se construye manualmente como un paquete Open XML (ZIP) para
         * evitar depender de librerías externas.
         */
        function escapeDocxXml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&apos;");
        }

        function getDocxRunPropertiesXml(properties = {}) {
            const parts = [];

            if (properties.bold) {
                parts.push("<w:b/>");
            }

            if (properties.italic) {
                parts.push("<w:i/>");
            }

            if (properties.strike) {
                parts.push("<w:strike/>");
            }

            if (properties.superscript) {
                parts.push('<w:vertAlign w:val="superscript"/>');
            }

            if (properties.monospace) {
                parts.push(
                    '<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas" w:eastAsia="Consolas"/>'
                );
            }

            if (properties.color) {
                parts.push(
                    '<w:color w:val="' +
                    escapeDocxXml(properties.color) +
                    '"/>'
                );
            }

            if (properties.underline) {
                parts.push('<w:u w:val="single"/>');
            }

            if (parts.length === 0) {
                return "";
            }

            return "<w:rPr>" + parts.join("") + "</w:rPr>";
        }

        function createDocxTextRuns(text, properties = {}) {
            const cleanText = String(text ?? "")
                .replaceAll("\u200B", "")
                .replaceAll("\t", "    ");

            const lines = cleanText.split("\n");
            const runs = [];

            lines.forEach((line, index) => {
                if (index > 0) {
                    runs.push("<w:r><w:br/></w:r>");
                }

                if (line.length === 0) {
                    return;
                }

                runs.push(
                    "<w:r>" +
                    getDocxRunPropertiesXml(properties) +
                    '<w:t xml:space="preserve">' +
                    escapeDocxXml(line) +
                    "</w:t>" +
                    "</w:r>"
                );
            });

            return runs.join("");
        }

        function createDocxParagraphPropertiesXml(options = {}) {
            const parts = [];

            if (options.style) {
                parts.push(
                    '<w:pStyle w:val="' +
                    escapeDocxXml(options.style) +
                    '"/>'
                );
            }

            if (
                Number.isFinite(options.leftIndent) ||
                Number.isFinite(options.hangingIndent)
            ) {
                let indentation = "<w:ind";

                if (Number.isFinite(options.leftIndent)) {
                    indentation +=
                        ' w:left="' +
                        Math.max(0, Math.round(options.leftIndent)) +
                        '"';
                }

                if (Number.isFinite(options.hangingIndent)) {
                    indentation +=
                        ' w:hanging="' +
                        Math.max(0, Math.round(options.hangingIndent)) +
                        '"';
                }

                indentation += "/>";
                parts.push(indentation);
            }

            if (options.shading) {
                parts.push(
                    '<w:shd w:val="clear" w:color="auto" w:fill="' +
                    escapeDocxXml(options.shading) +
                    '"/>'
                );
            }

            if (options.borderBottom) {
                parts.push(
                    '<w:pBdr><w:bottom w:val="single" w:sz="8" w:space="1" w:color="888888"/></w:pBdr>'
                );
            }

            if (options.borderLeft) {
                parts.push(
                    '<w:pBdr><w:left w:val="single" w:sz="10" w:space="8" w:color="777777"/></w:pBdr>'
                );
            }

            if (parts.length === 0) {
                return "";
            }

            return "<w:pPr>" + parts.join("") + "</w:pPr>";
        }

        function createDocxParagraphXml(
            runs,
            options = {}
        ) {
            return (
                "<w:p>" +
                createDocxParagraphPropertiesXml(options) +
                runs +
                "</w:p>"
            );
        }

        function addDocxHyperlinkRelationship(state, url) {
            const id =
                "rId" + state.nextRelationshipId++;

            state.relationships.push({
                id,
                type:
                    "http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink",
                target: String(url ?? ""),
                external: true
            });

            return id;
        }

        function docxInlineNodesToXml(
            nodes,
            state,
            inheritedProperties = {}
        ) {
            let xml = "";

            const appendNode = (
                node,
                properties
            ) => {
                if (node.nodeType === Node.TEXT_NODE) {
                    xml += createDocxTextRuns(
                        node.textContent,
                        properties
                    );
                    return;
                }

                if (node.nodeType !== Node.ELEMENT_NODE) {
                    return;
                }

                if (
                    node.classList.contains(
                        "footnote-edit-point"
                    )
                ) {
                    return;
                }

                const tagName =
                    node.tagName.toLowerCase();

                if (tagName === "br") {
                    xml += "<w:r><w:br/></w:r>";
                    return;
                }

                if (tagName === "img") {
                    const alternativeText =
                        node.dataset.markdownAlt ??
                        node.getAttribute("alt") ??
                        "imagen";

                    xml += createDocxTextRuns(
                        alternativeText || "imagen",
                        {
                            ...properties,
                            italic: true
                        }
                    );
                    return;
                }

                if (tagName === "a") {
                    const relationshipId =
                        addDocxHyperlinkRelationship(
                            state,
                            node.getAttribute("href") ?? ""
                        );

                    const oldXml = xml;
                    xml = "";

                    for (const child of node.childNodes) {
                        appendNode(
                            child,
                            {
                                ...properties,
                                color: "0563C1",
                                underline: true
                            }
                        );
                    }

                    const hyperlinkContent = xml;
                    xml =
                        oldXml +
                        '<w:hyperlink r:id="' +
                        relationshipId +
                        '">' +
                        hyperlinkContent +
                        "</w:hyperlink>";
                    return;
                }

                let childProperties = {
                    ...properties
                };

                if (
                    tagName === "strong" ||
                    tagName === "b"
                ) {
                    childProperties.bold = true;
                }

                if (
                    tagName === "em" ||
                    tagName === "i"
                ) {
                    childProperties.italic = true;
                }

                if (
                    tagName === "del" ||
                    tagName === "s"
                ) {
                    childProperties.strike = true;
                }

                if (
                    tagName === "sup" ||
                    node.classList.contains(
                        "footnote-reference"
                    )
                ) {
                    childProperties.superscript = true;
                }

                if (tagName === "code") {
                    childProperties.monospace = true;
                }

                for (const child of node.childNodes) {
                    appendNode(
                        child,
                        childProperties
                    );
                }
            };

            for (const node of nodes) {
                appendNode(
                    node,
                    inheritedProperties
                );
            }

            return xml;
        }

        function createDocxListXml(
            list,
            state,
            depth = 0
        ) {
            let xml = "";
            let orderedIndex = 1;

            for (const item of list.children) {
                if (item.tagName !== "LI") {
                    continue;
                }

                const directNodes = [
                    ...item.childNodes
                ].filter(node => !(
                    node.nodeType === Node.ELEMENT_NODE &&
                    (
                        node.tagName === "UL" ||
                        node.tagName === "OL"
                    )
                ));

                const prefix =
                    list.tagName === "OL"
                        ? `${orderedIndex}. `
                        : "• ";

                orderedIndex++;

                const runs =
                    createDocxTextRuns(
                        prefix
                    ) +
                    docxInlineNodesToXml(
                        directNodes,
                        state
                    );

                xml += createDocxParagraphXml(
                    runs,
                    {
                        leftIndent:
                            720 + (depth * 540),
                        hangingIndent: 360
                    }
                );

                for (const child of item.children) {
                    if (
                        child.tagName === "UL" ||
                        child.tagName === "OL"
                    ) {
                        xml += createDocxListXml(
                            child,
                            state,
                            depth + 1
                        );
                    }
                }
            }

            return xml;
        }

        function createDocxTableXml(
            table,
            state
        ) {
            let xml =
                "<w:tbl>" +
                "<w:tblPr>" +
                '<w:tblW w:w="0" w:type="auto"/>' +
                "<w:tblBorders>" +
                '<w:top w:val="single" w:sz="6" w:color="B7B7B7"/>' +
                '<w:left w:val="single" w:sz="6" w:color="B7B7B7"/>' +
                '<w:bottom w:val="single" w:sz="6" w:color="B7B7B7"/>' +
                '<w:right w:val="single" w:sz="6" w:color="B7B7B7"/>' +
                '<w:insideH w:val="single" w:sz="6" w:color="B7B7B7"/>' +
                '<w:insideV w:val="single" w:sz="6" w:color="B7B7B7"/>' +
                "</w:tblBorders>" +
                "</w:tblPr>";

            for (const row of table.rows) {
                xml += "<w:tr>";

                for (const cell of row.cells) {
                    const isHeader =
                        cell.tagName === "TH";

                    const runs =
                        docxInlineNodesToXml(
                            cell.childNodes,
                            state,
                            isHeader
                                ? { bold: true }
                                : {}
                        );

                    xml +=
                        "<w:tc>" +
                        "<w:tcPr>" +
                        '<w:tcW w:w="0" w:type="auto"/>' +
                        (
                            isHeader
                                ? '<w:shd w:val="clear" w:color="auto" w:fill="F2F2F2"/>'
                                : ""
                        ) +
                        "</w:tcPr>" +
                        createDocxParagraphXml(runs) +
                        "</w:tc>";
                }

                xml += "</w:tr>";
            }

            xml += "</w:tbl>";
            return xml;
        }

        function createDocxFormattedBlocksXml(
            container,
            state
        ) {
            let xml = "";

            const renderBlock = node => {
                if (node.nodeType === Node.TEXT_NODE) {
                    const text =
                        node.textContent
                            .replaceAll("\u200B", "");

                    if (text.trim().length > 0) {
                        xml += createDocxParagraphXml(
                            createDocxTextRuns(text)
                        );
                    }

                    return;
                }

                if (node.nodeType !== Node.ELEMENT_NODE) {
                    return;
                }

                const tagName =
                    node.tagName.toLowerCase();

                if (
                    tagName === "ul" ||
                    tagName === "ol"
                ) {
                    xml += createDocxListXml(
                        node,
                        state
                    );
                    return;
                }

                if (tagName === "table") {
                    xml += createDocxTableXml(
                        node,
                        state
                    );
                    return;
                }

                if (tagName === "hr") {
                    if (
                        node.classList.contains(
                            "footnotes-separator"
                        )
                    ) {
                        xml += createDocxParagraphXml(
                            "",
                            {
                                borderBottom: true
                            }
                        );
                    } else {
                        xml += createDocxParagraphXml(
                            "",
                            {
                                borderBottom: true
                            }
                        );
                    }
                    return;
                }

                if (
                    node.classList.contains(
                        "code-block"
                    )
                ) {
                    xml += createDocxParagraphXml(
                        createDocxTextRuns(
                            "</code>",
                            {
                                bold: true,
                                monospace: true
                            }
                        ),
                        {
                            shading: "F5F5F5"
                        }
                    );

                    for (const line of node.children) {
                        xml += createDocxParagraphXml(
                            createDocxTextRuns(
                                line.textContent
                                    .replaceAll("\u200B", ""),
                                {
                                    monospace: true
                                }
                            ),
                            {
                                style: "Code",
                                shading: "F5F5F5"
                            }
                        );
                    }
                    return;
                }

                if (
                    node.classList.contains(
                        "quote-block"
                    )
                ) {
                    for (const child of node.childNodes) {
                        if (
                            child.nodeType === Node.ELEMENT_NODE &&
                            (
                                child.tagName === "UL" ||
                                child.tagName === "OL" ||
                                child.tagName === "TABLE"
                            )
                        ) {
                            renderBlock(child);
                            continue;
                        }

                        const childNodes =
                            child.nodeType === Node.ELEMENT_NODE
                                ? child.childNodes
                                : [child];

                        xml += createDocxParagraphXml(
                            docxInlineNodesToXml(
                                childNodes,
                                state
                            ),
                            {
                                leftIndent: 720,
                                borderLeft: true
                            }
                        );
                    }
                    return;
                }

                if (
                    node.classList.contains(
                        "highlight-block"
                    )
                ) {
                    for (const child of node.childNodes) {
                        const childNodes =
                            child.nodeType === Node.ELEMENT_NODE
                                ? child.childNodes
                                : [child];

                        xml += createDocxParagraphXml(
                            docxInlineNodesToXml(
                                childNodes,
                                state
                            ),
                            {
                                shading: "F2F2F2"
                            }
                        );
                    }
                    return;
                }

                if (
                    node.classList.contains(
                        "footnotes-section"
                    )
                ) {
                    for (const child of node.children) {
                        renderBlock(child);
                    }
                    return;
                }

                if (
                    node.classList.contains(
                        "footnote-definition"
                    )
                ) {
                    xml += createDocxParagraphXml(
                        docxInlineNodesToXml(
                            node.childNodes,
                            state
                        )
                    );
                    return;
                }

                const heading =
                    tagName.match(/^h([1-6])$/);

                if (heading) {
                    xml += createDocxParagraphXml(
                        docxInlineNodesToXml(
                            node.childNodes,
                            state
                        ),
                        {
                            style:
                                "Heading" +
                                heading[1]
                        }
                    );
                    return;
                }

                if (
                    tagName === "div" ||
                    tagName === "p"
                ) {
                    xml += createDocxParagraphXml(
                        docxInlineNodesToXml(
                            node.childNodes,
                            state
                        )
                    );
                    return;
                }

                xml += createDocxParagraphXml(
                    docxInlineNodesToXml(
                        node.childNodes,
                        state
                    )
                );
            };

            for (const node of container.childNodes) {
                renderBlock(node);
            }

            return xml;
        }

        function getDocxStylesXml() {
            return (
                '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
                '<w:style w:type="paragraph" w:default="1" w:styleId="Normal">' +
                '<w:name w:val="Normal"/>' +
                '<w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/></w:rPr>' +
                '</w:style>' +
                [1, 2, 3, 4, 5, 6].map(level => {
                    const sizes = [32, 28, 26, 24, 22, 20];
                    return (
                        '<w:style w:type="paragraph" w:styleId="Heading' + level + '">' +
                        '<w:name w:val="heading ' + level + '"/>' +
                        '<w:basedOn w:val="Normal"/>' +
                        '<w:next w:val="Normal"/>' +
                        '<w:rPr><w:b/><w:sz w:val="' + sizes[level - 1] + '"/></w:rPr>' +
                        '</w:style>'
                    );
                }).join("") +
                '<w:style w:type="paragraph" w:styleId="Code">' +
                '<w:name w:val="Code"/>' +
                '<w:basedOn w:val="Normal"/>' +
                '<w:rPr><w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/><w:sz w:val="20"/></w:rPr>' +
                '</w:style>' +
                '</w:styles>'
            );
        }

        function getDocxDocumentRelationshipsXml(state) {
            const relationships = [
                {
                    id: "rId1",
                    type:
                        "http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles",
                    target: "styles.xml",
                    external: false
                },
                ...state.relationships
            ];

            return (
                '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
                relationships.map(relationship => (
                    '<Relationship Id="' +
                    escapeDocxXml(relationship.id) +
                    '" Type="' +
                    escapeDocxXml(relationship.type) +
                    '" Target="' +
                    escapeDocxXml(relationship.target) +
                    '"' +
                    (relationship.external ? ' TargetMode="External"' : '') +
                    '/>'
                )).join("") +
                '</Relationships>'
            );
        }

        function createDocxDocumentXml(
            contentTypeName,
            state
        ) {
            const markdown =
                getMarkdownForSave();

            let bodyXml = "";

            if (contentTypeName === "markdown") {
                const lines =
                    markdown
                        .replaceAll("\r\n", "\n")
                        .split("\n");

                for (const line of lines) {
                    bodyXml += createDocxParagraphXml(
                        createDocxTextRuns(
                            line,
                            {
                                monospace: true
                            }
                        ),
                        {
                            style: "Code"
                        }
                    );
                }
            } else if (contentTypeName === "formatted") {
                const temporary =
                    document.createElement("div");

                temporary.innerHTML =
                    markdownController.markdownToHtml(
                        markdown
                    );

                bodyXml =
                    createDocxFormattedBlocksXml(
                        temporary,
                        state
                    );
            } else {
                return "";
            }

            return (
                '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                '<w:document ' +
                'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
                'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
                '<w:body>' +
                bodyXml +
                '<w:sectPr>' +
                '<w:pgSz w:w="11906" w:h="16838"/>' +
                '<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/>' +
                '</w:sectPr>' +
                '</w:body>' +
                '</w:document>'
            );
        }

        function getDocxContentTypesXml() {
            return (
                '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
                '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
                '<Default Extension="xml" ContentType="application/xml"/>' +
                '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
                '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
                '</Types>'
            );
        }

        function getDocxRootRelationshipsXml() {
            return (
                '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
                '<Relationship Id="rId1" ' +
                'Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" ' +
                'Target="word/document.xml"/>' +
                '</Relationships>'
            );
        }

        let docxCrc32Table = null;

        function getDocxCrc32Table() {
            if (docxCrc32Table) {
                return docxCrc32Table;
            }

            const table =
                new Uint32Array(256);

            for (let index = 0; index < 256; index++) {
                let value = index;

                for (let bit = 0; bit < 8; bit++) {
                    value =
                        (value & 1)
                            ? (0xEDB88320 ^ (value >>> 1))
                            : (value >>> 1);
                }

                table[index] = value >>> 0;
            }

            docxCrc32Table = table;
            return table;
        }

        function getDocxCrc32(bytes) {
            const table =
                getDocxCrc32Table();

            let crc = 0xFFFFFFFF;

            for (const byte of bytes) {
                crc =
                    table[(crc ^ byte) & 0xFF] ^
                    (crc >>> 8);
            }

            return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        function createLittleEndianBytes(
            length,
            writer
        ) {
            const bytes =
                new Uint8Array(length);

            const view =
                new DataView(
                    bytes.buffer
                );

            writer(view);
            return bytes;
        }

        function concatenateUint8Arrays(arrays) {
            const totalLength =
                arrays.reduce(
                    (sum, array) => sum + array.length,
                    0
                );

            const result =
                new Uint8Array(totalLength);

            let offset = 0;

            for (const array of arrays) {
                result.set(array, offset);
                offset += array.length;
            }

            return result;
        }

        function createStoredZip(files) {
            const encoder =
                new TextEncoder();

            const localParts = [];
            const centralParts = [];
            let localOffset = 0;

            for (const file of files) {
                const nameBytes =
                    encoder.encode(file.name);

                const dataBytes =
                    typeof file.data === "string"
                        ? encoder.encode(file.data)
                        : file.data;

                const crc =
                    getDocxCrc32(dataBytes);

                const localHeader =
                    createLittleEndianBytes(
                        30,
                        view => {
                            view.setUint32(0, 0x04034B50, true);
                            view.setUint16(4, 20, true);
                            view.setUint16(6, 0x0800, true);
                            view.setUint16(8, 0, true);
                            view.setUint16(10, 0, true);
                            view.setUint16(12, 0x0021, true);
                            view.setUint32(14, crc, true);
                            view.setUint32(18, dataBytes.length, true);
                            view.setUint32(22, dataBytes.length, true);
                            view.setUint16(26, nameBytes.length, true);
                            view.setUint16(28, 0, true);
                        }
                    );

                localParts.push(
                    localHeader,
                    nameBytes,
                    dataBytes
                );

                const centralHeader =
                    createLittleEndianBytes(
                        46,
                        view => {
                            view.setUint32(0, 0x02014B50, true);
                            view.setUint16(4, 20, true);
                            view.setUint16(6, 20, true);
                            view.setUint16(8, 0x0800, true);
                            view.setUint16(10, 0, true);
                            view.setUint16(12, 0, true);
                            view.setUint16(14, 0x0021, true);
                            view.setUint32(16, crc, true);
                            view.setUint32(20, dataBytes.length, true);
                            view.setUint32(24, dataBytes.length, true);
                            view.setUint16(28, nameBytes.length, true);
                            view.setUint16(30, 0, true);
                            view.setUint16(32, 0, true);
                            view.setUint16(34, 0, true);
                            view.setUint16(36, 0, true);
                            view.setUint32(38, 0, true);
                            view.setUint32(42, localOffset, true);
                        }
                    );

                centralParts.push(
                    centralHeader,
                    nameBytes
                );

                localOffset +=
                    localHeader.length +
                    nameBytes.length +
                    dataBytes.length;
            }

            const centralDirectory =
                concatenateUint8Arrays(
                    centralParts
                );

            const endRecord =
                createLittleEndianBytes(
                    22,
                    view => {
                        view.setUint32(0, 0x06054B50, true);
                        view.setUint16(4, 0, true);
                        view.setUint16(6, 0, true);
                        view.setUint16(8, files.length, true);
                        view.setUint16(10, files.length, true);
                        view.setUint32(12, centralDirectory.length, true);
                        view.setUint32(16, localOffset, true);
                        view.setUint16(20, 0, true);
                    }
                );

            return concatenateUint8Arrays([
                ...localParts,
                centralDirectory,
                endRecord
            ]);
        }

        /* Monta las piezas XML y relaciones necesarias antes de crear el ZIP DOCX. */
        function buildDocxPackage(contentTypeName) {
            const state = {
                relationships: [],
                nextRelationshipId: 2
            };

            const documentXml =
                createDocxDocumentXml(
                    contentTypeName,
                    state
                );

            if (!documentXml) {
                return null;
            }

            return createStoredZip([
                {
                    name: "[Content_Types].xml",
                    data: getDocxContentTypesXml()
                },
                {
                    name: "_rels/.rels",
                    data: getDocxRootRelationshipsXml()
                },
                {
                    name: "word/document.xml",
                    data: documentXml
                },
                {
                    name: "word/styles.xml",
                    data: getDocxStylesXml()
                },
                {
                    name: "word/_rels/document.xml.rels",
                    data: getDocxDocumentRelationshipsXml(
                        state
                    )
                }
            ]);
        }

        function saveDocxContent(contentTypeName) {
            const packageBytes =
                buildDocxPackage(
                    contentTypeName
                );

            if (!packageBytes) {
                return false;
            }

            const format =
                saveController.get(
                    "docx"
                );

            const fileName =
                saveController.buildFileName(
                    format
                );

            saveController.downloadFile(
                packageBytes,
                fileName,
                format.mimeType
            );

            return true;
        }

        const PDF_PAGE_WIDTH_PT = 595.28;
        const PDF_PAGE_HEIGHT_PT = 841.89;
        const PDF_PAGE_CSS_WIDTH = 794;
        const PDF_PAGE_CSS_HEIGHT = 1123;
        const PDF_PAGE_SCALE = 2;
        const PDF_PAGE_MARGIN_CSS = 48;

        /* ===== GENERACIÓN PDF =====
         * El documento se pagina sobre canvas y después se empaqueta como PDF.
         * La vista Markdown y la formateada utilizan rutas de renderizado propias.
         */
        function createPdfPageCanvas() {
            const canvas = document.createElement("canvas");

            canvas.width =
                PDF_PAGE_CSS_WIDTH *
                PDF_PAGE_SCALE;

            canvas.height =
                PDF_PAGE_CSS_HEIGHT *
                PDF_PAGE_SCALE;

            const context =
                canvas.getContext("2d");

            context.fillStyle = "#ffffff";
            context.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            return canvas;
        }

        function getLargestCanvasTextPart(
            context,
            text,
            maxWidth
        ) {
            let low = 1;
            let high = text.length;
            let best = 1;

            while (low <= high) {
                const middle =
                    Math.floor(
                        (low + high) / 2
                    );

                const width =
                    context.measureText(
                        text.substring(
                            0,
                            middle
                        )
                    ).width;

                if (width <= maxWidth) {
                    best = middle;
                    low = middle + 1;
                } else {
                    high = middle - 1;
                }
            }

            return Math.max(
                1,
                best
            );
        }

        function wrapMarkdownPdfLine(
            context,
            line,
            maxWidth
        ) {
            const normalizedLine =
                line.replaceAll(
                    "\t",
                    "    "
                );

            if (
                normalizedLine.length === 0
            ) {
                return [""];
            }

            const result = [];
            let remaining =
                normalizedLine;

            while (
                remaining.length > 0
            ) {
                if (
                    context.measureText(
                        remaining
                    ).width <= maxWidth
                ) {
                    result.push(
                        remaining
                    );

                    break;
                }

                const length =
                    getLargestCanvasTextPart(
                        context,
                        remaining,
                        maxWidth
                    );

                result.push(
                    remaining.substring(
                        0,
                        length
                    )
                );

                remaining =
                    remaining.substring(
                        length
                    );
            }

            return result;
        }

        function renderMarkdownPdfCanvases(
            markdown
        ) {
            const canvases = [];
            const margin =
                PDF_PAGE_MARGIN_CSS *
                PDF_PAGE_SCALE;

            const fontSize = 24;
            const lineHeight = 34;

            let canvas =
                createPdfPageCanvas();

            let context =
                canvas.getContext("2d");

            const prepareContext = () => {
                context.fillStyle = "#111111";
                context.textBaseline = "top";
                context.font =
                    `${fontSize}px ui-monospace, SFMono-Regular, Consolas, monospace`;
            };

            prepareContext();

            let y = margin;

            const maxWidth =
                canvas.width -
                (margin * 2);

            const maxY =
                canvas.height -
                margin;

            const addPage = () => {
                canvases.push(
                    canvas
                );

                canvas =
                    createPdfPageCanvas();

                context =
                    canvas.getContext("2d");

                prepareContext();

                y = margin;
            };

            const lines =
                markdown
                    .replaceAll(
                        "\r\n",
                        "\n"
                    )
                    .split("\n");

            for (
                const sourceLine
                of lines
            ) {
                const wrappedLines =
                    wrapMarkdownPdfLine(
                        context,
                        sourceLine,
                        maxWidth
                    );

                for (
                    const line
                    of wrappedLines
                ) {
                    if (
                        y + lineHeight >
                        maxY
                    ) {
                        addPage();
                    }

                    context.fillText(
                        line,
                        margin,
                        y
                    );

                    y += lineHeight;
                }
            }

            canvases.push(
                canvas
            );

            return canvases;
        }

        function getFormattedPdfStyles() {
            const styles =
                [...document.querySelectorAll("style")]
                    .map(
                        style =>
                            style.textContent ?? ""
                    )
                    .join("\n")
                    .replaceAll(
                        "#formattedEditor",
                        ".pdf-formatted-editor"
                    );

            return (
                styles +
                `
                .pdf-formatted-editor {
                    box-sizing: border-box;
                    width: 100% !important;
                    height: auto !important;
                    min-height: 0 !important;
                    padding: 0 !important;
                    margin: 0 !important;
                    border: 0 !important;
                    border-radius: 0 !important;
                    overflow: visible !important;
                    background: #ffffff !important;
                    color: #111111;
                }

                .pdf-formatted-editor .footnote-edit-point {
                    display: none !important;
                }
                `
            );
        }

        function waitForPdfImages(
            root
        ) {
            const images =
                [...root.querySelectorAll("img")];

            return Promise.all(
                images.map(
                    image => {
                        if (image.complete) {
                            return Promise.resolve();
                        }

                        return new Promise(
                            resolve => {
                                let finished = false;

                                const complete = () => {
                                    if (finished) {
                                        return;
                                    }

                                    finished = true;
                                    resolve();
                                };

                                image.addEventListener(
                                    "load",
                                    complete,
                                    {
                                        once: true
                                    }
                                );

                                image.addEventListener(
                                    "error",
                                    complete,
                                    {
                                        once: true
                                    }
                                );

                                window.setTimeout(
                                    complete,
                                    1200
                                );
                            }
                        );
                    }
                )
            );
        }

        function createFormattedPdfMeasureRoot(
            markdown
        ) {
            const contentWidth =
                PDF_PAGE_CSS_WIDTH -
                (PDF_PAGE_MARGIN_CSS * 2);

            const root =
                document.createElement(
                    "div"
                );

            root.className =
                "pdf-formatted-editor";

            root.innerHTML =
                markdownController.markdownToHtml(
                    markdown
                );

            root.style.position = "fixed";
            root.style.left = "-100000px";
            root.style.top = "0";
            root.style.width =
                `${contentWidth}px`;
            root.style.height = "auto";
            root.style.minHeight = "0";
            root.style.padding = "0";
            root.style.margin = "0";
            root.style.border = "0";
            root.style.overflow = "visible";
            root.style.background = "#ffffff";

            document.body.append(
                root
            );

            return root;
        }

        function loadPdfSvgImage(
            svg
        ) {
            return new Promise(
                (resolve, reject) => {
                    const blob =
                        new Blob(
                            [svg],
                            {
                                type:
                                    "image/svg+xml;charset=utf-8"
                            }
                        );

                    const url =
                        URL.createObjectURL(
                            blob
                        );

                    const image =
                        new Image();

                    image.onload = () => {
                        URL.revokeObjectURL(
                            url
                        );

                        resolve(
                            image
                        );
                    };

                    image.onerror = () => {
                        URL.revokeObjectURL(
                            url
                        );

                        reject(
                            new Error(
                                "No se pudo renderizar la página PDF."
                            )
                        );
                    };

                    image.src = url;
                }
            );
        }

        async function renderFormattedPdfCanvases(
            markdown
        ) {
            const measureRoot =
                createFormattedPdfMeasureRoot(
                    markdown
                );

            try {
                await waitForPdfImages(
                    measureRoot
                );

                const contentWidth =
                    PDF_PAGE_CSS_WIDTH -
                    (PDF_PAGE_MARGIN_CSS * 2);

                const contentHeightPerPage =
                    PDF_PAGE_CSS_HEIGHT -
                    (PDF_PAGE_MARGIN_CSS * 2);

                const totalHeight =
                    Math.max(
                        1,
                        measureRoot.scrollHeight
                    );

                const pageCount =
                    Math.max(
                        1,
                        Math.ceil(
                            totalHeight /
                            contentHeightPerPage
                        )
                    );

                const styleText =
                    getFormattedPdfStyles()
                        .replaceAll(
                            "]]>",
                            "] ]>"
                        );

                const contentHtml =
                    measureRoot.innerHTML;

                const canvases = [];

                for (
                    let pageIndex = 0;
                    pageIndex < pageCount;
                    pageIndex++
                ) {
                    const offset =
                        pageIndex *
                        contentHeightPerPage;

                    const svg =
                        `<svg xmlns="http://www.w3.org/2000/svg" ` +
                        `width="${PDF_PAGE_CSS_WIDTH}" ` +
                        `height="${PDF_PAGE_CSS_HEIGHT}">` +
                        `<foreignObject ` +
                        `x="${PDF_PAGE_MARGIN_CSS}" ` +
                        `y="${PDF_PAGE_MARGIN_CSS}" ` +
                        `width="${contentWidth}" ` +
                        `height="${contentHeightPerPage}">` +
                        `<div xmlns="http://www.w3.org/1999/xhtml" ` +
                        `style="position:relative;width:${contentWidth}px;` +
                        `height:${contentHeightPerPage}px;overflow:hidden;` +
                        `background:#ffffff;">` +
                        `<style><![CDATA[${styleText}]]></style>` +
                        `<div class="pdf-formatted-editor" ` +
                        `style="position:absolute;left:0;top:-${offset}px;` +
                        `width:${contentWidth}px;height:auto;min-height:0;` +
                        `padding:0;margin:0;border:0;overflow:visible;` +
                        `background:#ffffff;">` +
                        contentHtml +
                        `</div>` +
                        `</div>` +
                        `</foreignObject>` +
                        `</svg>`;

                    const image =
                        await loadPdfSvgImage(
                            svg
                        );

                    const canvas =
                        createPdfPageCanvas();

                    const context =
                        canvas.getContext("2d");

                    context.drawImage(
                        image,
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

                    canvases.push(
                        canvas
                    );
                }

                return canvases;
            } finally {
                measureRoot.remove();
            }
        }

        function canvasToJpegBytes(
            canvas
        ) {
            return new Promise(
                (resolve, reject) => {
                    canvas.toBlob(
                        async blob => {
                            if (!blob) {
                                reject(
                                    new Error(
                                        "No se pudo crear la imagen de la página PDF."
                                    )
                                );

                                return;
                            }

                            const buffer =
                                await blob.arrayBuffer();

                            resolve(
                                new Uint8Array(
                                    buffer
                                )
                            );
                        },
                        "image/jpeg",
                        0.92
                    );
                }
            );
        }

        function buildPdfFromJpegPages(
            jpegPages,
            imageWidth,
            imageHeight
        ) {
            const encoder =
                new TextEncoder();

            const chunks = [];
            const offsets = [0];
            let byteLength = 0;

            const appendBytes = bytes => {
                chunks.push(bytes);
                byteLength += bytes.byteLength;
            };

            const appendText = text => {
                appendBytes(
                    encoder.encode(
                        text
                    )
                );
            };

            appendText(
                "%PDF-1.4\n%PDFJS\n"
            );

            const pageObjectNumbers = [];
            const imageObjectNumbers = [];
            const contentObjectNumbers = [];

            for (
                let index = 0;
                index < jpegPages.length;
                index++
            ) {
                pageObjectNumbers.push(
                    3 + (index * 3)
                );

                imageObjectNumbers.push(
                    4 + (index * 3)
                );

                contentObjectNumbers.push(
                    5 + (index * 3)
                );
            }

            const objectCount =
                2 +
                (jpegPages.length * 3);

            const objects =
                new Map();

            objects.set(
                1,
                {
                    type: "text",
                    value:
                        "<< /Type /Catalog /Pages 2 0 R >>"
                }
            );

            objects.set(
                2,
                {
                    type: "text",
                    value:
                        "<< /Type /Pages /Kids [" +
                        pageObjectNumbers
                            .map(
                                number =>
                                    `${number} 0 R`
                            )
                            .join(" ") +
                        `] /Count ${jpegPages.length} >>`
                }
            );

            for (
                let index = 0;
                index < jpegPages.length;
                index++
            ) {
                const pageObject =
                    pageObjectNumbers[index];

                const imageObject =
                    imageObjectNumbers[index];

                const contentObject =
                    contentObjectNumbers[index];

                objects.set(
                    pageObject,
                    {
                        type: "text",
                        value:
                            "<< /Type /Page " +
                            "/Parent 2 0 R " +
                            `/MediaBox [0 0 ${PDF_PAGE_WIDTH_PT} ${PDF_PAGE_HEIGHT_PT}] ` +
                            "/Resources << /XObject << " +
                            `/Im0 ${imageObject} 0 R` +
                            " >> >> " +
                            `/Contents ${contentObject} 0 R >>`
                    }
                );

                objects.set(
                    imageObject,
                    {
                        type: "image",
                        value:
                            jpegPages[index]
                    }
                );

                const stream =
                    `q\n${PDF_PAGE_WIDTH_PT} 0 0 ${PDF_PAGE_HEIGHT_PT} 0 0 cm\n/Im0 Do\nQ\n`;

                objects.set(
                    contentObject,
                    {
                        type: "stream",
                        value:
                            encoder.encode(
                                stream
                            )
                    }
                );
            }

            for (
                let objectNumber = 1;
                objectNumber <= objectCount;
                objectNumber++
            ) {
                const object =
                    objects.get(
                        objectNumber
                    );

                offsets[objectNumber] =
                    byteLength;

                appendText(
                    `${objectNumber} 0 obj\n`
                );

                if (
                    object.type === "text"
                ) {
                    appendText(
                        object.value
                    );
                } else if (
                    object.type === "image"
                ) {
                    const imageBytes =
                        object.value;

                    appendText(
                        "<< /Type /XObject " +
                        "/Subtype /Image " +
                        `/Width ${imageWidth} ` +
                        `/Height ${imageHeight} ` +
                        "/ColorSpace /DeviceRGB " +
                        "/BitsPerComponent 8 " +
                        "/Filter /DCTDecode " +
                        `/Length ${imageBytes.byteLength} >>\nstream\n`
                    );

                    appendBytes(
                        imageBytes
                    );

                    appendText(
                        "\nendstream"
                    );
                } else {
                    const streamBytes =
                        object.value;

                    appendText(
                        `<< /Length ${streamBytes.byteLength} >>\nstream\n`
                    );

                    appendBytes(
                        streamBytes
                    );

                    appendText(
                        "endstream"
                    );
                }

                appendText(
                    "\nendobj\n"
                );
            }

            const xrefOffset =
                byteLength;

            appendText(
                `xref\n0 ${objectCount + 1}\n`
            );

            appendText(
                "0000000000 65535 f \n"
            );

            for (
                let objectNumber = 1;
                objectNumber <= objectCount;
                objectNumber++
            ) {
                appendText(
                    String(
                        offsets[objectNumber]
                    ).padStart(10, "0") +
                    " 00000 n \n"
                );
            }

            appendText(
                "trailer\n" +
                `<< /Size ${objectCount + 1} /Root 1 0 R >>\n` +
                "startxref\n" +
                `${xrefOffset}\n` +
                "%%EOF"
            );

            return new Blob(
                chunks,
                {
                    type:
                        "application/pdf"
                }
            );
        }

        function downloadPdfBlob(
            blob,
            fileName
        ) {
            const url =
                URL.createObjectURL(
                    blob
                );

            const link =
                document.createElement(
                    "a"
                );

            link.href = url;
            link.download = fileName;
            link.style.display = "none";

            document.body.append(
                link
            );

            link.click();
            link.remove();

            window.setTimeout(
                () => {
                    URL.revokeObjectURL(
                        url
                    );
                },
                0
            );
        }

        async function savePdfContent(
            contentTypeName
        ) {
            const markdown =
                getMarkdownForSave();

            let canvases;

            try {
                if (
                    contentTypeName ===
                    "markdown"
                ) {
                    canvases =
                        renderMarkdownPdfCanvases(
                            markdown
                        );
                } else if (
                    contentTypeName ===
                    "formatted"
                ) {
                    canvases =
                        await renderFormattedPdfCanvases(
                            markdown
                        );
                } else {
                    return false;
                }

                const jpegPages = [];

                for (
                    const canvas
                    of canvases
                ) {
                    jpegPages.push(
                        await canvasToJpegBytes(
                            canvas
                        )
                    );
                }

                const pdfBlob =
                    buildPdfFromJpegPages(
                        jpegPages,
                        canvases[0].width,
                        canvases[0].height
                    );

                const pdfFormat =
                    saveController.get(
                        "pdf"
                    );

                const fileName =
                    saveController.buildFileName(
                        pdfFormat
                    );

                downloadPdfBlob(
                    pdfBlob,
                    fileName
                );

                return true;
            } catch (error) {
                return false;
            }
        }

        /* ===== NORMALIZACIÓN DE HTML IMPORTADO =====
         * Limpia y adapta HTML externo antes de convertirlo al dialecto Markdown
         * que entiende este editor.
         */
        function prepareHtmlForMarkdownImport(source) {
            const container =
                document.createElement(
                    "div"
                );

            container.innerHTML =
                source.innerHTML;

            for (
                const element
                of container.querySelectorAll(
                    "script, style, noscript, template"
                )
            ) {
                element.remove();
            }

            const removeFormattingWhitespace = root => {
                const walker =
                    document.createTreeWalker(
                        root,
                        NodeFilter.SHOW_TEXT
                    );

                const nodesToRemove = [];
                let node;

                while (
                    (node = walker.nextNode())
                ) {
                    if (
                        /^[\t\r\n ]+$/.test(
                            node.textContent ?? ""
                        )
                        &&
                        /[\t\r\n]/.test(
                            node.textContent ?? ""
                        )
                    ) {
                        nodesToRemove.push(
                            node
                        );
                    }
                }

                for (
                    const textNode
                    of nodesToRemove
                ) {
                    textNode.remove();
                }
            };

            removeFormattingWhitespace(
                container
            );

            for (
                const lineBreak
                of [...container.querySelectorAll("br")]
            ) {
                lineBreak.replaceWith(
                    document.createTextNode(
                        "\n"
                    )
                );
            }

            for (
                const strike
                of [...container.querySelectorAll("strike")]
            ) {
                const replacement =
                    document.createElement(
                        "del"
                    );

                while (
                    strike.firstChild
                ) {
                    replacement.append(
                        strike.firstChild
                    );
                }

                strike.replaceWith(
                    replacement
                );
            }

            for (
                const mark
                of [...container.querySelectorAll("mark")]
            ) {
                const fragment =
                    document.createDocumentFragment();

                fragment.append(
                    document.createTextNode(
                        "=="
                    )
                );

                while (
                    mark.firstChild
                ) {
                    fragment.append(
                        mark.firstChild
                    );
                }

                fragment.append(
                    document.createTextNode(
                        "=="
                    )
                );

                mark.replaceWith(
                    fragment
                );
            }

            for (
                const quote
                of [...container.querySelectorAll("blockquote")]
            ) {
                const replacement =
                    document.createElement(
                        "div"
                    );

                replacement.classList.add(
                    "quote-block"
                );

                while (
                    quote.firstChild
                ) {
                    replacement.append(
                        quote.firstChild
                    );
                }

                quote.replaceWith(
                    replacement
                );
            }

            for (
                const pre
                of [...container.querySelectorAll("pre")]
            ) {
                if (
                    pre.classList.contains(
                        "markdown-source"
                    )
                ) {
                    continue;
                }

                if (
                    pre.classList.contains(
                        "code-block"
                    )
                ) {
                    continue;
                }

                const replacement =
                    document.createElement(
                        "div"
                    );

                replacement.classList.add(
                    "code-block"
                );

                const lines =
                    (pre.textContent ?? "")
                        .replaceAll("\r\n", "\n")
                        .replaceAll("\r", "\n")
                        .split("\n");

                for (
                    const line
                    of lines
                ) {
                    const lineElement =
                        document.createElement(
                            "div"
                        );

                    lineElement.textContent =
                        line;

                    replacement.append(
                        lineElement
                    );
                }

                pre.replaceWith(
                    replacement
                );
            }

            const wrapperSelector =
                "article, section, main";

            let wrapper =
                container.querySelector(
                    wrapperSelector
                );

            while (wrapper) {
                if (
                    !wrapper.classList.contains(
                        "document"
                    )
                ) {
                    wrapper.replaceWith(
                        ...wrapper.childNodes
                    );
                }

                wrapper =
                    container.querySelector(
                        wrapperSelector
                    );

                if (
                    wrapper
                    &&
                    wrapper.classList.contains(
                        "document"
                    )
                ) {
                    break;
                }
            }

            return container;
        }


        async function importMarkdownFromHtml(
            file
        ) {
            let html =
                await file.text();

            if (
                html.charCodeAt(0) ===
                0xFEFF
            ) {
                html =
                    html.substring(1);
            }

            const parser =
                new DOMParser();

            const documentHtml =
                parser.parseFromString(
                    html,
                    "text/html"
                );

            if (
                !documentHtml
                ||
                !documentHtml.body
            ) {
                throw new Error(
                    "No se ha podido leer el documento HTML."
                );
            }

            const markdownSource =
                documentHtml.body.querySelector(
                    "pre.markdown-source"
                );

            if (
                documentHtml.body.classList.contains(
                    "markdown-source-document"
                )
                &&
                markdownSource
            ) {
                return (
                    markdownSource.textContent
                    ??
                    ""
                );
            }

            let source =
                documentHtml.body;

            if (
                documentHtml.body.classList.contains(
                    "formatted-document"
                )
            ) {
                source =
                    documentHtml.body.querySelector(
                        "main.document"
                    )
                    ??
                    documentHtml.body;
            } else {
                source =
                    documentHtml.body.querySelector(
                        ":scope > main.document"
                    )
                    ??
                    documentHtml.body;
            }

            const prepared =
                prepareHtmlForMarkdownImport(
                    source
                );

            return markdownController.htmlToMarkdown(
                prepared
            );
        }
